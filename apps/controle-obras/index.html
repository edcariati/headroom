<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Controle de Obras Cariati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --surface2:#F5F7F6; --ink:#15242C; --ink2:#4B5C65; --ink3:#77888F;
  --line:#D2D9DB; --line2:#E3E8E9;
  --steel:#2B5B7B; --steel-soft:#DBE8F0; --on-steel:#FFFFFF;
  --ok:#2A7554; --ok-soft:#DCEEE5;
  --amber:#B87D00; --amber-bar:#E2A400; --amber-soft:#FAEFC8;
  --crit:#B4382C; --crit-soft:#F8DEDA;
  --idle:#CBD2D5; --shadow:0 1px 0 rgba(21,36,44,.06);
  --s1:#2B5B7B; --s2:#2A8A85; --s3:#B87D00; --s4:#8A4F91; --s5:#6C7A2B;
  --a-engenharia:var(--steel); --a-suprimentos:var(--amber-bar); --a-prestadores:var(--s2); --a-financeiro:var(--s4); --a-cliente:var(--s5); --a-legal:var(--ink2);
  --f-head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181C; --surface:#1A242A; --surface2:#202B32; --ink:#E6ECEE; --ink2:#A3B3BA; --ink3:#7C8D95;
    --line:#2F3D45; --line2:#26333A;
    --steel:#79B4DA; --steel-soft:#203B4D; --on-steel:#0D1A22;
    --ok:#5DC192; --ok-soft:#1B3A2E;
    --amber:#E3AE32; --amber-bar:#E7B341; --amber-soft:#3B3116;
    --crit:#F0806F; --crit-soft:#432420;
    --idle:#3A4A53; --shadow:none;
    --s1:#79B4DA; --s2:#5CC7C0; --s3:#E3AE32; --s4:#C68FD0; --s5:#B4C563;
  }
}
:root[data-theme="dark"]{
  --bg:#11181C; --surface:#1A242A; --surface2:#202B32; --ink:#E6ECEE; --ink2:#A3B3BA; --ink3:#7C8D95;
  --line:#2F3D45; --line2:#26333A;
  --steel:#79B4DA; --steel-soft:#203B4D; --on-steel:#0D1A22;
  --ok:#5DC192; --ok-soft:#1B3A2E;
  --amber:#E3AE32; --amber-bar:#E7B341; --amber-soft:#3B3116;
  --crit:#F0806F; --crit-soft:#432420;
  --idle:#3A4A53; --shadow:none;
  --s1:#79B4DA; --s2:#5CC7C0; --s3:#E3AE32; --s4:#C68FD0; --s5:#B4C563;
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;line-height:1.15;margin:0;letter-spacing:.005em}
h1{font-size:30px;font-weight:700}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
a{color:var(--steel);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:3px}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}
.num{font-family:var(--f-head);font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.stack>*+*{margin-top:12px}
.hide{display:none!important}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.01em;color:var(--ink);white-space:nowrap}
.brand span{color:var(--steel)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav a{font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--ink2);padding:6px 12px;border-radius:4px;white-space:nowrap}
.nav a:hover{text-decoration:none;background:var(--surface2)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--steel);border-radius:0}
.top .tools{margin-left:auto;display:flex;gap:6px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 64px}
.banner{background:var(--amber-soft);color:var(--ink);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;text-align:center}

/* botões */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--on-steel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ico{padding:8px 10px}
.ro [data-write]{display:none!important}

/* cartões e listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.pad{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.grid{display:grid;gap:14px}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.cols3{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.sec{margin-top:26px}
.sec>h2,.sec>.sec-h{margin-bottom:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--line);color:var(--ink2);background:var(--surface2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.steel{background:var(--steel-soft);color:var(--steel);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--amber-bar)}.dot.crit{background:var(--crit)}.dot.steel{background:var(--steel)}

/* alertas */
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line2)}
.alerts li:first-child{border-top:0}
.alerts .dot{margin-top:6px}

/* cabeçalho da obra */
.ob-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ob-head .meta{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:6px;color:var(--ink2);font-size:14px}
.back{font-size:14px;color:var(--ink2);display:inline-block;margin-bottom:6px}

/* régua de etapas */
.regua-wrap{overflow-x:auto;padding-bottom:4px}
.regua{display:flex;gap:10px;min-width:640px}
.regua .fase{min-width:0}
.regua .fase .segs{display:grid;gap:2px}
.regua .fase .lbl{font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;align-items:flex-end;justify-content:center;height:38px;border-radius:2px;background:transparent;border:1px solid var(--idle);color:var(--ink3);font-family:var(--f-head);font-size:11px;font-weight:600;padding-bottom:3px;position:relative}
.seg:hover{text-decoration:none;border-color:var(--ink2)}
.seg.em_execucao{background:var(--steel);border-color:var(--steel);color:var(--on-steel)}
.seg.aguardando_vistoria{background:var(--amber-bar);border-color:var(--amber-bar);color:#241B00}
.seg.liberada{background:var(--ok);border-color:var(--ok);color:#fff}
.seg.crit::before{content:"";position:absolute;left:-1px;right:-1px;top:-4px;height:4px;background:var(--crit);border-radius:2px 2px 0 0}
.regua.mini{min-width:0;gap:5px}
.regua.mini .seg{height:12px;padding:0;font-size:0;border-radius:1px}
.regua.mini .fase .lbl{display:none}
.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink2)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px;border:1px solid var(--idle)}
.legenda i.em_execucao{background:var(--steel);border-color:var(--steel)}
.legenda i.aguardando_vistoria{background:var(--amber-bar);border-color:var(--amber-bar)}
.legenda i.liberada{background:var(--ok);border-color:var(--ok)}
.legenda i.crit{background:var(--crit);border-color:var(--crit)}

/* abas */
.tabs{display:flex;flex-wrap:wrap;gap:0 2px;border-bottom:1px solid var(--line);margin-top:20px;scrollbar-width:none}
.tabs a{font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--ink2);padding:9px 14px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs.grupos a{font-size:17px}
.tabs.sub{margin-top:0;border-bottom:1px solid var(--line2)}
.tabs.sub a{font-size:14px;font-weight:500;padding:7px 12px}
.tabs a:hover{text-decoration:none;color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--steel)}

/* quadro de indicadores */
.ind{width:100%;border-collapse:collapse}
.ind th,.ind td{text-align:left;padding:10px 16px;border-top:1px solid var(--line2);vertical-align:top}
.ind thead th{border-top:0;font-size:12px;color:var(--ink3);font-weight:500}
.ind td.v{font-family:var(--f-head);font-size:21px;font-weight:600;white-space:nowrap}
.ind .f{font-size:12px;color:var(--ink3)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding:8px 16px 0}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars .b .col{width:100%;max-width:38px;background:var(--steel);border-radius:2px 2px 0 0;min-height:2px}
.bars .b .col.low{background:var(--crit)}
.bars .b .col.open{background:var(--idle)}
.bars .b span{font-size:11px;color:var(--ink3);margin-top:4px;white-space:nowrap}
.bars .b .val{font-family:var(--f-head);font-size:12px;color:var(--ink2);margin:0 0 2px}
.hbar{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;padding:4px 16px;font-size:13px}
.hbar .t{height:10px;background:var(--surface2);border-radius:2px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--steel)}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line2);border-radius:6px;min-height:120px}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-family:var(--f-head);font-weight:600;font-size:15px}
.col>header .n{color:var(--ink3);font-weight:500}
.col .cards{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 12px;position:relative}
.kcard.crit{border-left:4px solid var(--crit)}
.kcard.importante{border-left:4px solid var(--amber-bar)}
.kcard .t{font-weight:500;display:block;color:var(--ink);line-height:1.3}
.kcard .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kcard .mv{display:flex;gap:6px;margin-top:8px}

/* gantt */
.gantt-scroll{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-height:70vh}
.gantt{--dw:16px;--lw:230px;position:relative;min-width:min-content}
.g-row{display:grid;grid-template-columns:var(--lw) calc(var(--days)*var(--dw));border-top:1px solid var(--line2);min-height:34px}
.g-row.head{position:sticky;top:0;z-index:3;background:var(--surface);border-top:0;border-bottom:1px solid var(--line)}
.g-label{position:sticky;left:0;z-index:2;background:var(--surface);padding:6px 10px;border-right:1px solid var(--line);overflow:hidden;font-size:13px;line-height:1.25}
.g-row.head .g-label{z-index:4;font-family:var(--f-head);font-weight:600}
.g-row.etapa .g-label{background:var(--surface2);font-family:var(--f-head);font-weight:600;font-size:14px}
.g-row.etapa .g-track{background:var(--surface2)}
.g-label button{all:unset;cursor:pointer;display:block;width:100%}
.g-label button:hover .nm{text-decoration:underline}
.g-label .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.g-track{position:relative;background-image:repeating-linear-gradient(to right,var(--line2) 0,var(--line2) 1px,transparent 1px,transparent calc(var(--dw)*7))}
.g-weeks{display:flex;height:34px}
.g-weeks span{flex:none;width:calc(var(--dw)*7);font-size:11px;color:var(--ink3);padding:9px 0 0 4px;border-left:1px solid var(--line2);white-space:nowrap}
.g-bar{position:absolute;top:8px;height:16px;border-radius:3px;background:var(--steel-soft);border:1px solid var(--steel);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--steel)}
.g-bar.late{border-color:var(--crit);background:var(--crit-soft)}
.g-bar.late i{background:var(--crit)}
.g-bar.done{border-color:var(--ok);background:var(--ok-soft)}
.g-bar.done i{background:var(--ok)}
.g-base{position:absolute;top:26px;height:4px;border-radius:2px;background:var(--ink3);opacity:.55}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:1;pointer-events:none}
.g-today-l{position:absolute;top:0;z-index:5;transform:translateX(-50%);background:var(--crit);color:#fff;font-size:10px;padding:0 4px;border-radius:0 0 3px 3px}

/* diário */
.entry{padding:14px 16px;border-top:1px solid var(--line2)}
.entry:first-child{border-top:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs button{all:unset;cursor:pointer;display:block}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block}

/* ficha de verificação */
.ficha{padding:14px 16px;border-top:1px solid var(--line2);display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.ficha:first-child{border-top:0}
.ficha .cri{font-size:13px;color:var(--ink2)}
.ficha .err{font-size:12px;color:var(--ink3)}
.callout{border:1px solid var(--line);border-left:4px solid var(--amber-bar);background:var(--amber-soft);border-radius:5px;padding:12px 14px;font-size:14px}
.callout.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout ul{margin:6px 0 0;padding-left:18px}
details.ex summary{cursor:pointer;font-family:var(--f-head);font-weight:600;font-size:16px;padding:12px 16px}
details.ex ul{margin:0;padding:0 16px 14px 34px}
details.ex li+li{margin-top:4px}

/* tabelas simples */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--ink3);font-weight:500;text-align:left;padding:8px 16px}
.tbl td{padding:10px 16px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl-scroll{overflow-x:auto}

/* diálogos e formulários */
dialog{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 12px 40px rgba(0,0,0,.28)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,18,22,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.fld{display:block;margin-bottom:14px}
.fld>label,.fld>.lb{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-height:40px}
.fld textarea{resize:vertical}
.fld .hint{font-size:12px;color:var(--ink3);margin-top:4px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fld2{grid-template-columns:1fr}}
.seg-opts{display:flex;gap:6px;flex-wrap:wrap}
.seg-opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:7px 12px;cursor:pointer;font-size:14px;color:var(--ink);margin:0;font-weight:500}
.seg-opts input{width:auto;min-height:0;margin:0}
.seg-opts label:has(input:checked){border-color:var(--steel);background:var(--steel-soft)}
.efet-row{display:grid;grid-template-columns:1fr 84px 34px;gap:8px;margin-bottom:8px}
.err-msg{color:var(--crit);font-size:13px;margin-top:6px}
.thumbs.edit .rm{position:relative}
.thumbs.edit .rm button.x{position:absolute;top:2px;right:2px;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;text-align:center;line-height:22px;font-size:14px}
.lightbox img{max-width:100%;max-height:calc(100vh - 120px);display:block;margin:0 auto;border-radius:4px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100vw - 24px))}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.err{background:var(--crit);color:#fff}

@media (max-width:640px){
  h1{font-size:25px}
  .top-in{gap:8px;padding:8px 12px;flex-wrap:wrap}
  .top .tools{order:2}
  .top .nav{order:3;width:100%;overflow-x:visible;flex-wrap:wrap}
  .brand{font-size:16px}
  .wrap{padding:16px 12px 56px}
  .gantt{--lw:150px}
  .ind td.v{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.seg,.nav a,.tabs a{transition:background-color .12s,border-color .12s,color .12s}
}

.linkbtn{all:unset;cursor:pointer;color:var(--ink);font-weight:500;line-height:1.3;display:block}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.kcard a.t{color:var(--ink)}

/* agenda */
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 4px;font-size:12px;color:var(--ink3);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-d{all:unset;box-sizing:border-box;cursor:pointer;min-height:58px;background:var(--surface);border:1px solid var(--line2);border-radius:5px;padding:5px 6px;display:flex;flex-direction:column;gap:4px}
.cal-d:hover{border-color:var(--ink3)}
.cal-d:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.cal-d.out{opacity:.45}
.cal-d.venc{border-color:var(--crit)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--steel)}
.cal-d.sel{background:var(--steel-soft)}
.cal-d .n{font-family:var(--f-head);font-weight:600;font-size:14px}
.cal-d .dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.cal-d .dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line2);align-items:start}
@media (max-width:640px){.ev{grid-template-columns:44px 1fr}.ev>.row:last-child{grid-column:1/-1}.cal-d{min-height:48px;padding:4px}}
.lob{display:block;max-width:none}
.lob-grid{stroke:var(--line2);stroke-width:1}
.lob-t{fill:var(--ink3);font-size:11px;font-family:var(--f-body)}


/* nuvem, login e histórico */
.login{max-width:420px;margin:8vh auto 0}
.login .card{padding:22px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:120px 1fr auto;gap:6px 14px;padding:10px 16px;border-top:1px solid var(--line2);align-items:start}
.hist li:first-child{border-top:0}
.hist .q{font-size:12px;color:var(--ink3);line-height:1.3}
.hist .d{font-size:13px;color:var(--ink2)}
@media (max-width:640px){.hist li{grid-template-columns:1fr}.hist li>.row{justify-self:start}}
code.k{font-size:12px;background:var(--surface2);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;word-break:break-all}

/* impressão do relatório mensal (A4) */
@page{size:A4;margin:14mm}
@media print{
  body{background:#fff;color:#000}
  .top,.banner,.back,.ob-head,.tabs,.no-print,#toast,dialog{display:none!important}
  .wrap{max-width:none;padding:0}
  .rel-doc .card{box-shadow:none;break-inside:avoid;border-color:#bbb}
  .rel-doc h2,.rel-doc h3{break-after:avoid}
  .rel-doc a{color:inherit;text-decoration:none}
}

'use strict';
var PROTO = {"fases":[{"id":"F0","nome":"Planejamento e legalização","etapas":[1]},{"id":"F1","nome":"Preparação do terreno","etapas":[2,3,4]},{"id":"F2","nome":"Fundação, estrutura e fechamento","etapas":[5,6,7,8]},{"id":"F3","nome":"Sistemas embutidos e proteção","etapas":[9,10,11,12,13]},{"id":"F4","nome":"Acabamentos","etapas":[14,15,16,17,18,19]},{"id":"F5","nome":"Entorno, entrega e pós-obra","etapas":[20,21,22]}],"etapas":[{"n":1,"nome":"Pré-obra","objetivo":"A obra só abre com terreno regularizado, projetos completos, orçamento fechado, contratos assinados e licenças emitidas.","liberacao":"alvará emitido, contrato assinado e projetos compatibilizados.","itens":["Documentação do terreno: matrícula, IPTU, levantamento planialtimétrico e sondagem do solo (SPT).","Projeto arquitetônico aprovado pelo cliente e pela prefeitura.","Projetos complementares: estrutural, fundação, hidráulico, elétrico, gás, dados e demais disciplinas.","Compatibilização dos projetos, com conflitos resolvidos antes da execução.","Memorial descritivo e especificações de materiais e acabamentos definidos.","Orçamento detalhado por serviço, com quantitativos, unidades e preços unitários.","Cronograma físico-financeiro aprovado.","Contratos assinados: cliente, empreiteiros e fornecedores principais.","Alvará de construção, ART/RRT e matrícula da obra (CEI/CNO) emitidos.","Seguros e responsabilidades definidos."],"verif":[{"item":"Sondagem do solo","criterio":"Número de furos conforme NBR 8036, relatório assinado por profissional habilitado","erro":"Projetar fundação sem sondagem ou com relatório de outro terreno","evidencia":"Relatório de sondagem"},{"item":"Projetos","criterio":"Compatibilizados, sem interferência entre estrutura, hidráulica e elétrica","erro":"Executar com revisão desatualizada","evidencia":"Lista de projetos com revisão e data"},{"item":"Licenças","criterio":"Alvará, ART/RRT e matrícula da obra emitidos antes de iniciar","erro":"Iniciar a obra antes do alvará","evidencia":"Cópias arquivadas"},{"item":"Contratos","criterio":"Escopo, prazo, valor e medição definidos por escrito","erro":"Escopo genérico que gera disputa depois","evidencia":"Contratos assinados"},{"item":"Orçamento e cronograma","criterio":"Aprovados pelo cliente e com data-base registrada","erro":"Iniciar sem cronograma físico-financeiro","evidencia":"Documentos aprovados"}]},{"n":2,"nome":"Mobilização e canteiro","objetivo":"O canteiro precisa estar seguro, organizado e com água, energia e armazenagem antes da primeira máquina entrar.","liberacao":"canteiro fechado, com água, energia e almoxarifado funcionando.","itens":["Limpeza inicial do terreno e remoção de entulho ou vegetação.","Tapume ou cercamento e placa da obra com dados do alvará e dos responsáveis técnicos.","Ligação provisória de água e de energia.","Barracão, almoxarifado, sanitário e área de vivência da equipe.","Definição de áreas de estoque, bancada de armação e central de argamassa/concreto.","Acesso para caminhões e proteção da calçada e do entorno.","Registro fotográfico do terreno e dos imóveis vizinhos (vistoria cautelar quando necessário).","Plano de segurança do canteiro e treinamento inicial."],"verif":[{"item":"Placa da obra","criterio":"Visível, com dados do alvará e dos responsáveis técnicos","erro":"Obra sem placa","evidencia":"Foto da placa"},{"item":"Ligação elétrica provisória","criterio":"Quadro com DR, aterramento e disjuntores identificados","erro":"Ligação improvisada, fios expostos","evidencia":"Foto do quadro"},{"item":"Armazenagem de cimento","criterio":"Local seco, coberto e sobre estrado","erro":"Cimento no chão ou exposto à chuva","evidencia":"Foto do almoxarifado"},{"item":"Vistoria cautelar dos vizinhos","criterio":"Feita antes de escavar, com fotos das trincas existentes","erro":"Não registrar o estado prévio","evidencia":"Laudo com fotos"},{"item":"Sanitário e vivência","criterio":"Instalados e em uso pela equipe","erro":"Equipe sem estrutura mínima","evidencia":"Foto"}]},{"n":3,"nome":"Terraplanagem e locação","objetivo":"O terreno deve chegar às cotas de projeto, com o volume de corte e aterro controlado e a obra locada com precisão.","liberacao":"platô nas cotas de projeto e locação conferida pelo responsável técnico.","itens":["Conferência das cotas do terreno contra o projeto e o levantamento topográfico.","Plano de corte e aterro, com volumes calculados e destino do bota-fora definido.","Contratação da máquina e do transporte, com medição por hora ou por volume.","Execução do corte, do aterro e da regularização do terreno.","Aterro em camadas compactadas, com controle de compactação quando o projeto exigir.","Drenagem provisória para evitar erosão e acúmulo de água.","Contenção ou talude, quando houver desnível relevante.","Locação da obra com gabarito, conferência de esquadro, eixos e níveis.","Marco de referência de nível (RN) protegido para toda a obra.","Vizinhos avisados antes do primeiro corte, com canal de contato e horário de trabalho definidos.","Vistoria cautelar dos imóveis vizinhos concluída antes das máquinas entrarem.","Divisas e marcos conferidos antes de cortar ou aterrar perto deles, sem invadir nem retirar apoio de muros vizinhos.","Poeira, ruído, lama na via e trânsito de caminhões controlados, com a via limpa ao fim do dia.","Interferência encontrada na escavação (rede, tubulação, cisterna, rocha ou lençol freático): parar o serviço, registrar e acionar o responsável técnico.","Reclamação de vizinho ou imprevisto do solo registrado como ocorrência, com decisão e, quando couber, aditivo."],"verif":[{"item":"Cotas do platô","criterio":"Conferidas com nível topográfico, dentro da tolerância do projeto","erro":"Terreno nivelado a olho, sem referência","evidencia":"Planilha de níveis assinada"},{"item":"Compactação do aterro","criterio":"Camadas com espessura controlada e grau de compactação do projeto","erro":"Aterro lançado em camada grossa e sem compactar","evidencia":"Laudo de compactação"},{"item":"Bota-fora","criterio":"Destino licenciado e comprovado","erro":"Descarte irregular de terra e entulho","evidencia":"Comprovante de destinação"},{"item":"Locação","criterio":"Diagonais do gabarito iguais, eixos e níveis conferidos","erro":"Gabarito solto ou fora de esquadro","evidencia":"Planilha de locação assinada"},{"item":"Referência de nível (RN)","criterio":"Protegido e visível durante toda a obra","erro":"RN perdido ou removido pelas máquinas","evidencia":"Foto e croqui do RN"},{"item":"Vizinhos e divisas","criterio":"Divisas preservadas, sem invasão; reclamações registradas e respondidas no prazo","erro":"Cortar junto ao muro do vizinho sem aviso nem apoio","evidencia":"Vistoria cautelar e registro de ocorrências"},{"item":"Poeira, ruído e via pública","criterio":"Umidificação do terreno, horário permitido, via limpa","erro":"Caminhões saindo com lama, trabalho fora do horário","evidencia":"Foto da via e registro"},{"item":"Interferências e imprevistos do solo","criterio":"Serviço parado, registrado e avaliado antes de seguir","erro":"Continuar escavando sobre rede ou rocha sem avisar","evidencia":"Ocorrência com foto e decisão do responsável técnico"}]},{"n":4,"nome":"Contenções e drenagem do terreno","objetivo":"Quando há desnível, talude ou divisa com vizinho, a contenção e a drenagem são executadas antes de qualquer fundação próxima.","liberacao":"contenção executada conforme projeto e drenagem funcionando.","itens":["Levantamento dos desníveis, taludes, divisas e construções vizinhas.","Projeto de contenção (muro de arrimo, cortina, gabião ou talude) com responsável técnico.","Escavação e execução da contenção antes das fundações próximas ao desnível.","Drenagem do terreno: canaletas, drenos, barbacãs e caixas de passagem.","Impermeabilização da face da contenção em contato com o solo.","Reaterro com material drenante, em camadas compactadas.","Escoamento da água para ponto autorizado, sem prejudicar vizinhos nem a via.","Monitoramento de trincas e deslocamento s do projeto, fundo limpo e em solo firme","erro":"Escavação rasa ou com fundo de solo solto","evidencia":"Foto com trena e nível"},{"item":"Solo encontrado","criterio":"Compatível com a sondagem; divergência registrada e avaliada pelo projetista","erro":"Executar a fundação prevista sem avisar que o solo é diferente","evidencia":"Foto da escavação, parecer do projetista e aditivo, se houver mudança"},{"item":"Armadura","criterio":"Bitola, espaçamento, ancoragem e cobrimento do projeto, com espaçadores","erro":"Ferro encostado no fundo, sem espaçador","evidencia":"Checklist pré-concretagem assinado e foto"},{"item":"Concreto","criterio":"Resistência (fck) especificada, slump conferido, corpos de prova moldados","erro":"Adicionar água na obra para facilitar o lançamento","evidencia":"Nota fiscal, ensaio de slump, laudo dos corpos de prova"},{"item":"Cura","criterio":"Úmida por no mínimo 7 dias (NBR 14931)","erro":"Não curar, ou curar por um dia","evidencia":"Registro da cura no diário"},{"item":"Impermeabilização dos baldrames","criterio":"Aplicada em todas as faces, sobre superfície limpa","erro":"Aplicar sobre concreto sujo ou sem cura","evidencia":"Foto das demãos"},{"item":"Tubulações enterradas","criterio":"Passagens e testes feitos antes do reaterro","erro":"Quebrar o baldrame depois para passar tubo","evidencia":"Foto e registro de teste"},{"item":"Aterramento","criterio":"Malha ou espera executada conforme projeto","erro":"Esquecer o aterramento na fundação","evidencia":"Foto antes de concretar"}]},{"n":6,"nome":"Estrutura","objetivo":"Pilares, vigas e lajes são executados pavimento a pavimento, com cada concretagem liberada por vistoria de fôrma, armação e escoramento.","liberacao":"estrutura desformada, resultados de resistência aprovados e falhas corrigidas.","itens":["Locação dos pilares e conferência de prumo e esquadro.","Fôrmas e escoramento dimensionados e conferidos antes da armação.","Armação de pilares, vigas e lajes conforme projeto estrutural, com espaçadores e cobrimento.","Passagem de tubulações e caixas embutidas na laje antes da concretagem.","Vistoria pré-concretagem assinada pelo responsável técnico.","Concretagem com controle de traço, slump e corpos de prova.","Adensamento adequado e cura úmida pelo prazo mínimo.","Retirada de fôrmas e escoras apenas após o prazo e a resistência mínima exigidos.","Conferência de prumo, nível e dimensões após a desforma, com correção de falhas.","Repetição do ciclo para cada pavimento, incluindo a escada."],"verif":[{"item":"Prumo e nível dos pilares","criterio":"Desvios dentro do limite do projeto, conferidos com prumo ou laser","erro":"Pilar fora de prumo corrigido com massa","evidencia":"Registro de medição"},{"item":"Fôrmas e escoramento","criterio":"Rígidos, travados, estanques e conforme o projeto de escoramento","erro":"Escora improvisada, fôrma com vazamento de nata","evidencia":"Foto pré-concretagem"},{"item":"Armação","criterio":"Igual ao projeto: bitola, estribos, espaçamento e cobrimento","erro":"Reduzir bitola ou omitir estribos","evidencia":"Checklist pré-concretagem assinado"},{"item":"Instalações embutidas","criterio":"Passagens e caixas posicionadas antes de concretar","erro":"Quebrar laje depois para passar tubulação","evidencia":"Foto antes da concretagem"},{"item":"Concretagem","criterio":"fck e slump conferidos, adensamento com vibrador, corpos de prova","erro":"Concreto segregado por falta de vibração","evidencia":"Nota fiscal, slump, corpos de prova"},{"item":"Cura e desforma","criterio":"Cura úmida e desforma no prazo e resistência mínimos","erro":"Desformar cedo para reaproveitar fôrma","evidencia":"Datas registradas no diário"},{"item":"Falhas do concreto","criterio":"Sem bicheiras ou ninhos, ou reparo aprovado pela engenharia","erro":"Tapar falha sem avaliação técnica","evidencia":"Foto e laudo do reparo"}]},{"n":7,"nome":"Alvenaria e vedações","objetivo":"As paredes definem os ambientes e precisam sair no prumo, no esquadro e com todas as vergas e contravergas previstas.","liberacao":"alvenaria conferida em prumo e esquadro, com todos os vãos nas medidas de projeto.","itens":["Marcação da primeira fiada conferida contra o projeto de paginação.","Bloco ou tijolo especificado, com recebimento e conferência de lote.","Elevação da alvenaria com prumo, nível e alinhamento controlados.","Vergas, contravergas e cintas nos vãos e nos pontos indicados.","Encunhamento (fixação no topo) após o prazo de acomodação.","Ferros de amarração entre alvenaria e pilares.","Conferência de vãos de portas e janelas contra o projeto de esquadrias.","Pontos de instalação marcados antes de rasgar as paredes.","Drywall ou divisórias leves, quando previstos, em etapa própria."],"verif":[{"item":"Primeira fiada","criterio":"Nivelada, esquadrejada e na cota do projeto","erro":"Fiada de marcação fora de nível","evidencia":"Foto com nível"},{"item":"Prumo, nível e alinhamento","criterio":"Dentro da tolerância do projeto","erro":"Paredes fora de prumo compensadas no reboco","evidencia":"Registro de medição"},{"item":"Vergas e contravergas","criterio":"Em todos os vãos, com transpasse conforme projeto","erro":"Vão sem verga","evidencia":"Foto antes do reboco"},{"item":"Amarração","criterio":"Ferros ou telas ligando alvenaria e estrutura","erro":"Parede sem amarração, que trinca","evidencia":"Foto"},{"item":"Juntas de assentamento","criterio":"Preenchidas e com espessura uniforme","erro":"Juntas vazias e desiguais","evidencia":"Vistoria visual"},{"item":"Encunhamento","criterio":"Após o prazo de acomodação, com preenchimento total","erro":"Encunhar cedo, gerando trinca no topo","evidencia":"Registro de datas"},{"item":"Vãos de portas e janelas","criterio":"Nas medidas do projeto de esquadrias","erro":"Vão fora de medida, que atrasa a esquadria","evidencia":"Planilha de medidas"}]},{"n":8,"nome":"Cobertura","objetivo":"O telhado deve fechar a obra contra chuva o mais cedo possível, com caimento, estanqueidade e escoamento conferidos.", .","Teste de pressão nas tubulações de água antes de fechar.","Teste de estanqueidade e fluxo nas tubulações de esgoto.","Elétrica: eletrodutos, caixas, quadros e aterramento conforme projeto.","Gás: tubulação, ventilação e teste de estanqueidade.","Dados, telefonia, CFTV, automação e som: eletrodutos e pontos.","Ar-condicionado: tubulação frigorígena, dreno e pontos elétricos.","Aquecimento solar ou a gás e demais sistemas prediais, quando previstos.","Fotografia de todas as tubulações antes do fechamento, com cotas de referência."],"verif":[{"item":"Água fria e quente","criterio":"Teste de pressão conforme NBR 5626, sem queda de pressão","erro":"Fechar o rasgo sem testar","evidencia":"Registro do teste e foto do manômetro"},{"item":"Esgoto","criterio":"Caimento mínimo de 2% para DN até 75 e 1% para DN 100 ou mais (NBR 8160), com ventilação","erro":"Caimento invertido ou insuficiente","evidencia":"Foto com nível e teste de fluxo"},{"item":"Elétrica","criterio":"Bitolas, circuitos e condutor de proteção (terra) conforme projeto","erro":"Fiação subdimensionada, sem terra","evidencia":"Foto e teste de continuidade"},{"item":"Quadros elétricos","criterio":"Posição e capacidade de projeto, com DR e espaço para reserva","erro":"Quadro pequeno e sem identificação","evidencia":"Foto"},{"item":"Gás","criterio":"Teste de estanqueidade por profissional habilitado","erro":"Instalação sem teste","evidencia":"Laudo do teste"},{"item":"Dados, CFTV e ar-condicionado","criterio":"Eletrodutos livres, com fio-guia, e dreno com caimento","erro":"Eletroduto obstruído ou sem guia","evidencia":"Foto"},{"item":"Registro antes do fechamento","criterio":"Fotos com cotas de referência das tubulações","erro":"Fechar sem registrar o trajeto","evidencia":"Álbum de fotos por ambiente"}]},{"n":10,"nome":"Reservatórios, fossa e águas pluviais","objetivo":"A água que entra e a que sai da casa precisam de reservação, tratamento e destino corretos, testados antes de cobrir.","liberacao":"reservatório /* ---------- utilitários ---------- */
function $(s, el){ return (el||document).querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hoje(){ return iso(new Date()); }
function parse(s){ var p=String(s).slice(0,10).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function segunda(s){ var d=parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); }
function fmt(s){ if(!s) return '—'; var p=String(s).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtC(s){ if(!s) return '—'; var p=String(s).slice(0,10).split('-'); return p[2]+'/'+p[1]; }
function pct(x){ return x==null?'—':Math.round(x*100)+'%'; }
function nid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function plural(n,s,p){ return n+' '+(n===1?s:p); }

var renderTimer=null;
function scheduleRender(){ if(renderTimer) return; renderTimer=requestAnimationFrame(function(){ renderTimer=null; if(window.__render) window.__render(); }); }

function toast(msg, err){
  var box=document.getElementById('toast'); if(!box) return;
  var d=document.createElement('div'); if(err) d.className='err'; d.textContent=msg; box.appendChild(d);
  setTimeout(function(){ d.remove(); }, 4600);
}

/* ---------- Supabase (nuvem) ---------- */
var BUCKET='obras-arquivos';
function sbErr(r){ if(r&&r.error){ var e=new Error(r.error.message||'erro'); e.code=r.error.code||r.error.statusCode||'supabase'; throw e; } return r; }
var Supa={ cli:null, cfg:null, session:null, vers:{}, papel:null,
  v2:function(){ return !!(this.cfg&&this.cfg.esquema==='v2'); },
  config:function(){
    var c=null; try{ c=JSON.parse(localStorage.getItem('cob.supa')||'null'); }catch(e){}
    if(!c && window.COB_SUPABASE) c=window.COB_SUPABASE;
    return (c && c.url && c.key)?{url:String(c.url).replace(/\/+$/,''), key:String(c.key), esquema:c.esquema==='v2'?'v2':'v1'}:null;
  },
  saveConfig:function(c){ try{ if(c) localStorage.setItem('cob.supa', JSON.stringify(c)); else localStorage.removeItem('cob.supa'); }catch(e){} },
  start:async function(cfg){
    if(!window.supabase || !window.supabase.createClient) return 'sem_biblioteca';
    this.cfg=cfg;
    try{ this.cli=window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:true, storageKey:'cob.supa.sessao'}}); }catch(e){ return 'config_invalida'; }
    var r; try{ r=await this.cli.auth.getSession(); }catch(e){ return 'offline'; }
    this.session=r&&r.data&&r.data.session;
    if(!this.session) return 'login';
    if(this.v2()){
      var pr; try{ pr=await this.cli.from('perfis').select('nome,papel,ativo').eq('user_id', this.session.user.id); }catch(e){ return 'offline'; }
      var row=pr&&pr.data&&pr.data[0];
      if(!row||row.ativo===false) return 'sem_perfil';
      this.papel=row.papel; this.nome=row.nome||'';
      return 'ok';
    }
    this.perfil();
    return 'ok';
  },
  email:function(){ return this.session&&this.session.user?this.session.user.email:''; },
  uid:function(){ return this.session&&this.session.user?this.session.user.id:null; },
  perfil:function(){
    var u=this.session.user, md=u.user_metadata||{};
    this.cli.from('perfis').upsert({id:u.id, email:u.email, nome:md.nome||md.name||String(u.email||'').split('@')[0], atualizado_em:new Date().toISOString()}).then(function(){}, function(){});
  },
  adapter:function(){
    if(this.v2()) return this.adapterV2();
    var cli=this.cli;
    return { doc:function(p){ var i=p.indexOf('/'), c=p.slice(0,i), id=p.slice(i+1); return {
      set:function(rec){ return cli.from('registros').upsert({colecao:c, id:id, dados:rec}).then(sbErr); },
      delete:function(){ return cli.from('registros').delete().match({colecao:c, id:id}).then(sbErr); }
    }; } };
  },
  // Esquema novo (fase 6): uma tabela por coleção, controle de versão e exclusão lógica no servidor
  adapterV2:function(){
    var self=this, cli=this.cli;
    return { doc:function(p){ var i=p.indexOf('/'), c=p.slice(0,i), id=p.slice(i+1), k=c+'/'+id; return {
      set:async function(rec){
        var oid=c==='obras'?id:(rec.obraId||null), v=self.vers[k], r;
        if(v){
          r=sbErr(await cli.from(c).update({dados:rec, obra_id:oid}).eq('id',id).eq('versao',v).select('versao'));
          if(!r.data||!r.data.length){ var e=new Error('conflito'); e.code='conflito'; e.col=c; e.rid=id; throw e; }
        } else {
          r=sbErr(await cli.from(c).insert({id:id, obra_id:oid, dados:rec}).select('versao'));
        }
        if(r.data&&r.data[0]) self.vers[k]=r.data[0].versao;
      },
      delete:async function(){ sbErr(await cli.rpc('excluir_registro', {tab:c, rid:id})); delete self.vers[k]; }
    }; } };
  },
  recarregar:async function(c,id){
    var r=await this.cli.from(c).select('id,dados,versao,excluido_em').eq('id',id);
    var x=r&&r.data&&r.data[0]; if(!r||r.error) return;
    if(!x||x.excluido_em){ Store.data[c].delete(id); delete this.vers[c+'/'+id]; }
    else { Store.data[c].set(id, x.dados||{}); this.vers[c+'/'+id]=x.versao; }
    scheduleRender();
  },
  userShim:function(){
    var self=this;
    if(this.v2()) return { profiles:async function(ids){
      var r=sbErr(await self.cli.from('perfis').select('user_id,nome').in('user_id', ids)), out={}, me=self.uid();
      (r.data||[]).forEach(function(p){ out[p.user_id]={name:p.nome||'Alguém', isMe:p.user_id===me}; });
      ids.forEach(function(i){ if(i===me&&!out[i]) out[i]={name:'você', isMe:true}; });
      return out;
    } };
    return { profiles:async function(ids){
      var r=sbErr(await self.cli.from('perfis').select('id,nome,email').in('id', ids)), out={}, me=self.uid();
      (r.data||[]).forEach(function(p){ out[p.id]={name:p.nome||p.email, isMe:p.id===me}; });
      return out;
    } };
  },
  assets:function(){
    var self=this;
    return { upload:async function(blob){
      var t=(blob&&blob.type)||'', ext=t==='application/pdf'?'pdf':(t==='image/png'?'png':(t==='image/webp'?'webp':'jpg'));
      var path=(self.uid()||'anon')+'/'+hoje().slice(0,7)+'/'+nid()+Math.random().toString(36).slice(2,8)+'.'+ext;
      sbErr(await self.cli.storage.from(BUCKET).upload(path, blob, {contentType:t||'application/octet-stream', upsert:false}));
      return {id:'sb:'+path};
    } };
  },
  publicUrl:function(path){ var c=this.cfg||this.config(); return c?c.url+'/storage/v1/object/public/'+BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/'):''; },
  upsertMany:async function(rows){
    for(var i=0;i<rows.length;i+=400){ sbErr(await this.cli.from('registros').upsert(rows.slice(i,i+400))); }
  }
};
function blobUrl(id){ id=String(id||''); return id.indexOf('sb:')===0?Supa.publicUrl(id.slice(3)):'/_blob/'+id; }

/* ---------- armazenamento ---------- */
var COLS=['obras','etapas','atividades','pacotes','diarios','fichas','ocorrencias','prestadores','eventos','atas','acoes','docsLegais','docsPrest','rfis','materiais','locs','servicos','treinamentos','fornecedores','compras','movEstoque','locacoes','contratosPrest','termos','danos','orcamentos','orcItens','aditivos','medicoes','contasPagar','aportes','empresas','contratosCliente','lancamentos','relatorios','avaliacoes','licoes','config'];
var Store={
  mode:'boot', db:null, data:{}, uid:null, writable:true, user:null, q:new Map(), unsubs:[],
  init:async function(){
    var self=this; COLS.forEach(function(c){ self.data[c]=new Map(); });
    var db=null, user=null;
    try{ if(window.claude && window.claude.use){ db=await window.claude.use('db'); user=await window.claude.use('user'); } }catch(e){}
    this.user=user;
    if(user){
      try{ this.uid=await user.id(); }catch(e){}
      try{ var w=await user.can('data.write'); if(w===false) this.writable=false; }catch(e){}
    }
    if(db){ this.db=db; this.mode='db'; this.backend='claude'; await this.subscribeAll(); return; }
    var sc=Supa.config();
    if(sc){
      var st=await Supa.start(sc);
      if(st==='login'){ this.mode='login'; return; }
      if(st==='sem_perfil'){ this.mode='sem_acesso'; return; }
      if(st==='ok'){
        this.db=Supa.adapter(); this.mode='db'; this.backend='supabase';
        this.uid=Supa.uid(); this.user=Supa.userShim();
        if(Supa.v2()){ this.papel=Supa.papel; this.writable=['dono','gestor','financeiro','campo'].indexOf(Supa.papel)>=0; }
        await this.subscribeSupa(); return;
      }
      this.supaErro=st;
    }
    this.mode='local'; this.backend='local'; this.loadLocal();
  },
  subscribeSupaV2:async function(){
    var self=this, ch=Supa.cli.channel('dados-app');
    COLS.forEach(function(c){
      ch=ch.on('postgres_changes', {event:'*', schema:'public', table:c}, function(p){
        var n=p.new||{};
        if(!n.id) return;
        if(n.excluido_em){ self.data[c].delete(n.id); delete Supa.vers[c+'/'+n.id]; }
        else { self.data[c].set(n.id, n.dados||{}); Supa.vers[c+'/'+n.id]=n.versao; }
        scheduleRender();
      });
    });
    ch.subscribe();
    this.unsubs.push(function(){ Supa.cli.removeChannel(ch); });
    var falhou=false;
    for(var i=0;i<COLS.length;i++){
      var c=COLS[i], from=0, step=1000;
      while(true){
        var r=await Supa.cli.from(c).select('id,dados,versao').is('excluido_em', null).order('id').range(from, from+step-1);
        if(r.error){ if(!falhou) toast('Não foi possível carregar parte dos dados ('+(r.error.code||r.error.message)+').', true); falhou=true; break; }
        (r.data||[]).forEach(function(x){ self.data[c].set(x.id, x.dados||{}); Supa.vers[c+'/'+x.id]=x.versao; });
        if((r.data||[]).length<step) break; from+=step;
      }
    }
  },
  subscribeSupa:async function(){
    if(Supa.v2()) return this.subscribeSupaV2();
    var self=this;
    var ch=Supa.cli.channel('registros-app').on('postgres_changes', {event:'*', schema:'public', table:'registros'}, function(p){
      if(p.eventType==='DELETE'){ var o=p.old||{}; if(o.colecao && self.data[o.colecao]) self.data[o.colecao].delete(o.id); }
      else { var n=p.new||{}; if(n.colecao && self.data[n.colecao]) self.data[n.colecao].set(n.id, n.dados||{}); }
      scheduleRender();
    }).subscribe();
    this.unsubs.push(function(){ Supa.cli.removeChannel(ch); });
    var from=0, step=1000;
    while(true){
      var r=await Supa.cli.from('registros').select('colecao,id,dados').order('colecao').order('id').range(from, from+step-1);
      if(r.error){ toast('Não foi possível carregar os dados da nuvem ('+(r.error.code||r.error.message)+').', true); break; }
      r.data.forEach(function(x){ if(self.data[x.colecao]) self.data[x.colecao].set(x.id, x.dados||{}); });
      if(r.data.length<step) break; from+=step;
    }
  },
  subscribeAll:function(){
    var self=this;
    return new Promise(function(resolve){
      var pending=COLS.length;
      function done(){ pending--; if(pending===0) resolve(); }
      COLS.forEach(function(c){
        var first=true;
        var u=self.db.collection(c).onSnapshot(function(snap){
          var m=new Map(); snap.docs.forEach(function(d){ if(d.exists) m.set(d.id,d.data()); });
          self.data[c]=m;
          if(first){ first=false; done(); } else scheduleRender();
        }, function(err){
          if(first){ first=false; done(); }
          toast('Conexão com os dados interrompida ('+(err&&err.code||'erro')+'). Recarregue a página.', true);
        });
        self.unsubs.push(u);
      });
      setTimeout(function(){ if(pending>0){ pending=-99; resolve(); } }, 12000);
    });
  },
  loadLocal:function(){ var self=this; COLS.forEach(function(c){ try{ var raw=localStorage.getItem('cob.'+c); if(raw) self.data[c]=new Map(JSON.parse(raw)); }catch(e){} }); },
  saveLocal:function(c){ try{ localStorage.setItem('cob.'+c, JSON.stringify(Array.from(this.data[c].entries()))); }catch(e){ toast('Não foi possível salvar neste navegador.', true); } },
  enqueue:function(key, fn){
    var self=this, prev=this.q.get(key)||Promise.resolve();
    var next=prev.catch(function(){}).then(fn);
    this.q.set(key,next);
    next.then(function(){ if(self.q.get(key)===next) self.q.delete(key); }, function(){ if(self.q.get(key)===next) self.q.delete(key); });
    return next;
  },
  fail:function(e){
    if(e&&e.code==='conflito'){ toast('Este registro foi alterado por outra pessoa. Sua alteração não foi gravada; a tela foi atualizada.', true); if(e.col) Supa.recarregar(e.col,e.rid); return; }
    if(e&&/row-level security|permission denied|42501/i.test((e.message||'')+(e.code||''))){ toast('Seu perfil não tem permissão para esta alteração.', true); return; }
    toast('Não foi possível salvar'+(e&&e.code?' ('+e.code+')':'')+'. Confira sua conexão e tente de novo.', true); },
  set:function(c,id,data){
    var self=this;
    if(!this.writable){ toast('Seu acesso é somente leitura.', true); return Promise.resolve(); }
    var rec=clone(data); delete rec.id;
    this.data[c].set(id,rec); scheduleRender();
    if(this.mode==='db'){ return this.enqueue(c+'/'+id, function(){ return self.db.doc(c+'/'+id).set(rec); }).catch(function(e){ self.fail(e); }); }
    this.saveLocal(c); return Promise.resolve();
  },
  patch:function(c,id,fields){ var cur=this.data[c].get(id)||{}; return this.set(c,id,Object.assign({},cur,fields)); },
  add:function(c,data){ var id=nid(); this.set(c,id,data); return id; },
  del:function(c,id){
    var self=this;
    if(!this.writable){ toast('Seu acesso é somente leitura.', true); return Promise.resolve(); }
    this.data[c].delete(id); scheduleRender();
    if(this.mode==='db'){ return this.enqueue(c+'/'+id, function(){ return self.db.doc(c+'/'+id).delete(); }).catch(function(e){ self.fail(e); }); }
    this.saveLocal(c); return Promise.resolve();
  }
};

/* ---------- regras de negócio ---------- */
function ocAberta(o){ return o.status!=='fechada'; }
function vencidaOc(o){ return ocAberta(o) && o.prazo && o.prazo<hoje(); }
function atrasoOc(o){ return vencidaOc(o)?diffDays(o.prazo,hoje()):0; }
function idadeOc(o){ return diffDays((o.criadoEm||hoje()).slice(0,10), hoje()); }

function fichasResumo(oid,n){
  var v=etapaInfo(n).verif, r={total:v.length, aprov:0, rep:0, reins:0, pend:0};
  v.forEach(function(_,i){
    var f=fichaDoc(oid,n,i);
    if(!f) r.pend++;
    else if(f.resultado==='aprovado'||f.resultado==='na') r.aprov++;
    else if(f.resultado==='reprovado') r.rep++;
    else r.reins++;
  });
  return r;
}
function podeIniciar(oid,n){
  var m=[];
  if(n>1){ var p=etapaDoc(oid,n-1); if(p.status!=='liberada') m.push('A etapa '+(n-1)+' ('+etapaInfo(n-1).nome+') ainda não foi liberada em vistoria.'); }
  return {ok:m.length===0, motivos:m};
}
function podeLiberar(oid,n){
  var m=[], e=etapaDoc(oid,n), info=etapaInfo(n);
  info.verif.forEach(function(v,i){
    var f=fichaDoc(oid,n,i);
    if(!f) m.push('Ficha sem inspeção: '+v.item+'.');
    else if(f.resultado==='reprovado') m.push('Ficha reprovada: '+v.item+'.');
    else if(f.resultado==='reinspecao') m.push('Ficha aguardando reinspeção: '+v.item+'.');
  });
  var crit=byObra('ocorrencias',oid).filter(function(o){ return o.etapa===n && o.gravidade==='critica' && ocAberta(o); });
  if(crit.length) m.push(plural(crit.length,'ocorrência crítica aberta','ocorrências críticas abertas')+' nesta etapa.');
  if(!e.condicoesOk) m.push('Condições de liberação da etapa ainda não confirmadas.');
  return {ok:m.length===0, motivos:m};
}
function conformidade(oid){
  var fs=byObra('fichas',oid).filter(function(f){ return f.primeira==='ok'||f.primeira==='nok'; });
  if(!fs.length) return null;
  return fs.filter(function(f){ return f.primeira==='ok'; }).length/fs.length;
}
function semanaInfo(oid,semana){
  var ps=byObra('pacotes',oid).filter(function(p){ return p.semana===semana; });
  var ok=ps.filter(function(p){ return p.concluido===true; }).length;
  var pend=ps.filter(function(p){ return p.concluido!==true && p.concluido!==false; }).length;
  return {semana:semana, ps:ps, tot:ps.length, ok:ok, pend:pend, ppc:ps.length?ok/ps.length:null};
}
function ppcHist(oid,n){
  var cur=segunda(hoje()), out=[];
  for(var i=n-1;i>=0;i--) out.push(semanaInfo(oid, addDays(cur,-7*i)));
  return out;
}
function semanasFechadas(oid){ return ppcHist(oid,8).filter(function(w){ return w.tot>0 && w.pend===0; }); }
function ppcAtual(oid){ var h=semanasFechadas(oid); return h.length?h[h.length-1]:null; }
function ppcAbaixo2(oid,meta){
  var h=semanasFechadas(oid); if(h.length<2) return false;
  return h[h.length-1].ppc*100<meta && h[h.length-2].ppc*100<meta;
}
function atAtrasada(a){ return a.fim<hoje() && (a.avanco||0)<100; }
function avancoCron(oid){
  var ats=byObra('atividades',oid); if(!ats.length) return null;
  var tot=0, acc=0;
  ats.forEach(function(a){ var d=Math.max(1,diffDays(a.inicio,a.fim)+1); tot+=d; acc+=d*(a.avanco||0)/100; });
  return acc/tot;
}
function validade(s){
  if(!s) return {k:'', t:'Sem data'};
  var d=diffDays(hoje(),s);
  if(d<0) return {k:'crit', t:'Vencido em '+fmt(s)};
  if(d<=30) return {k:'warn', t:'Vence em '+d+(d===1?' dia':' dias')};
  return {k:'ok', t:'Válido até '+fmt(s)};
}
function prestBloqueado(p){ return validade(p.seguro).k==='crit' || validade(p.treinamento).k==='crit' || L('treinamentos').some(function(t){ return t.prestadorId===p.id && t.validade && validade(t.validade).k==='crit'; }); }

function alertasObra(o){
  var A=[], oid=o.id, base='#/obra/'+oid+'/';
  var meta=o.metaPPC==null?80:o.metaPPC, dias=o.diasEscalar==null?7:o.diasEscalar;
  var ocs=byObra('ocorrencias',oid).filter(ocAberta);
  var crit=ocs.filter(function(x){ return x.gravidade==='critica'; });
  if(crit.length) A.push({k:'crit', t:plural(crit.length,'ocorrência crítica aberta','ocorrências críticas abertas')+': a etapa afetada não pode ser liberada.', to:base+'ocorrencias'});
  var venc=ocs.filter(vencidaOc);
  if(venc.length){
    var esc_=venc.filter(function(x){ return atrasoOc(x)>dias; });
    A.push({k:esc_.length?'crit':'warn', t:plural(venc.length,'apontamento vencido','apontamentos vencidos')+(esc_.length?'; '+plural(esc_.length,'está','estão')+' há mais de '+dias+' dias e deve(m) ir à diretoria.':'. Cobrar o prestador.'), to:base+'ocorrencias'});
  }
  if(ppcAbaixo2(oid,meta)) A.push({k:'warn', t:'PPC abaixo da meta de '+meta+'% em duas semanas seguidas: replanejar e avisar o cliente.', to:base+'semana'});
  var atr=byObra('atividades',oid).filter(atAtrasada);
  if(atr.length) A.push({k:'warn', t:plural(atr.length,'atividade atrasada','atividades atrasadas')+' no cronograma.', to:base+'cronograma'});
  return A.concat(alertasP2(o));
}

}
async function shrink(file){
  try{
    var bmp=await createImageBitmap(file);
    var s=Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    var c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    var b=await new Promise(function(r){ c.toBlob(r,'image/jpeg',0.8); });
    return b||file;
  }catch(e){ return file; }
}
async function uploadFiles(files){
  var out=[]; if(!files||!files.length) return out;
  var a=await getAssets();
  if(!a){ toast('O envio de fotos não está disponível para o seu acesso.', true); return out; }
  for(var i=0;i<files.length;i++){
    try{ var b=await shrink(files[i]); var r=await a.upload(b); out.push(r.id); }
    catch(e){ toast('Falha ao enviar uma foto ('+(e&&e.code||'erro')+').', true); }
  }
  return out;
}

async function uploadAnexos(files){
  var out=[]; if(!files||!files.length) return out;
  var a=await getAssets();
  if(!a){ toast('O envio de arquivos não está disponível para o seu acesso.', true); return out; }
  for(var i=0;i<files.length;i++){
    try{ var f=files[i], pdf=f.type==='application/pdf', b=pdf?f:await shrink(f); var r=await a.upload(b); out.push({id:r.id, n:f.name, pdf:pdf}); }
    catch(e){ toast('Falha ao enviar um arquivo ('+(e&&e.code||'erro')+').', true); }
  }
  return out;
}

function short(s,n){ s=String(s||''); n=n||60; return s.length>n?s.slice(0,n-1)+'…':s; }
function mesAdd(m,n){ var p=m.split('-').map(Number), d=new Date(p[0],p[1]-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function mesNome(m){ var N=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'], p=m.split('-'); return N[Number(p[1])-1]+' de '+p[0]; }
function diasNoMes(m){ var p=m.split('-').map(Number); return new Date(p[0],p[1],0).getDate(); }
function anexosHtml(list){

function overduePlural(n){ return plural(n,'dia','dias'); }

/* ---------- dados auxiliares ---------- */
function docLegal(oid,k){ return G('docsLegais', oid+'_'+k); }
function docRegistrado(d){ return !!(d && (((d.numero||'').trim()) || (d.anexos&&d.anexos.length))); }
function docPrest(oid,pid,mes,k){ return G('docsPrest', oid+'_'+pid+'_'+mes+'_'+k); }
function prestAtivos(oid){
  var s={};
  byObra('atividades',oid).forEach(function(a){ if(a.prestadorId) s[a.prestadorId]=1; });
  byObra('servicos',oid).forEach(function(a){ if(a.prestadorId) s[a.prestadorId]=1; });
  byObra('diarios',oid).forEach(function(d){ (d.efetivo||[]).forEach(function(r){ if(r.p) s[r.p]=1; }); });
  return Object.keys(s).map(function(id){ return G('prestadores',id); }).filter(Boolean).sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });
}
function prestEmDia(oid,pid,mes){ return DOC_MENSAIS.every(function(t){ var d=docPrest(oid,pid,mes,t.k); return d&&d.status==='conferido'; }); }
function docsMesResumo(oid,mes){
  var ps=prestAtivos(oid), em=ps.filter(function(p){ return prestEmDia(oid,p.id,mes); });
  return {tot:ps.length, ok:em.length, pend:ps.length-em.length};
}
function acaoVencida(a){ return a.status==='aberta' && a.prazo && a.prazo<hoje(); }
function rfiVencido(r){ return r.status==='aberto' && r.prazo && r.prazo<hoje(); }
function matVencido(m){ return m.resultado==='pendente' && m.prazo && m.prazo<hoje(); }
function locsDe(oid){ return byObra('locs',oid).sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); }); }
function lobIni(s,k){ return addDays(s.inicio, k*(s.diasPorLoc||1)); }
function lobFim(s,k){ return addDays(lobIni(s,k), (s.diasPorLoc||1)-1); }
function avLoc(s,lid){ return (s.av&&s.av[lid])||null; }

/* ---------- LINHA DE BALANÇO: cálculo ---------- */
function lobResumo(s,locs){
  var N=locs.length, done=0, prog=0, plan=0, iniReal=null;
  locs.forEach(function(l,k){
    var a=avLoc(s,l.id), p=a?(a.p||0):0;
    if(p>=100) done++;
    prog+=p/100;
    var st=lobIni(s,k), f=(diffDays(st,hoje())+1)/(s.diasPorLoc||1);
    plan+=Math.max(0,Math.min(1,f));
    if(a&&a.ini&&(!iniReal||a.ini<iniReal)) iniReal=a.ini;
  });
  var ratio=plan>0?prog/plan:null;
  return {N:N, done:done, prog:prog, plan:plan, ratio:ratio, iniReal:iniReal, ritPlan:7/(s.diasPorLoc||1)};
}
function lobConflitos(oid){
  var locs=locsDe(oid), svs=byObra('servicos',oid), out=[];
  svs.forEach(function(s){
    var ps=s.pred?svs.filter(function(x){return x.id===s.pred;})[0]:null; if(!ps) return;
    locs.forEach(function(l,k){
      var a=avLoc(ps,l.id), feita=a&&a.p>=100, st=lobIni(s,k);
      if(!feita && st<=addDays(hoje(),7)) out.push('“'+s.nome+'” começa em '+l.nome+' no dia '+fmtC(st)+', mas “'+ps.nome+'” ainda não concluiu essa localização.');
    });
  });
  return out;
}
function lobRatioMedio(oid){
  var locs=locsDe(oid), svs=byObra('servicos',oid).map(function(s){ return lobResumo(s,locs).ratio; }).filter(function(x){ return x!=null; });
  if(!svs.length) return null;
  return svs.reduce(function(a,b){return a+b;},0)/svs.length;
}

/* ---------- ALERTAS DA FASE 2 ---------- */
function alertasP2(o){
  var A=[], oid=o.id, base='#/obra/'+oid+'/', dias=o.diasEscalar==null?7:o.diasEscalar;
  var rf=byObra('rfis',oid).filter(rfiVencido);
  if(rf.length) A.push({k:'warn', t:plural(rf.length,'RFI sem resposta e vencido','RFIs sem resposta e vencidos')+'. Cobrar o projetista.', to:base+'projeto'});
  var mt=byObra('materiais',oid).filter(matVencido);
  if(mt.length) A.push({k:'warn', t:plural(mt.length,'decisão de material ou amostra vencida','decisões de material ou amostra vencidas')+': pode atrasar pedido e execução.', to:base+'projeto'});
  var ac=byObra('acoes',oid).filter(acaoVencida);
  if(ac.length){
    var esc_=ac.filter(function(x){ return diffDays(x.prazo,hoje())>dias; });
    A.push({k:esc_.length?'crit':'warn', t:plural(ac.length,'ação de reunião vencida','ações de reunião vencidas')+(esc_.length?'; '+plural(esc_.length,'está','estão')+' há mais de '+dias+' dias e deve(m) ir à diretoria.':'.'), to:base+'reunioes'});
  }
  if(o.inicio && !docRegistrado(docLegal(oid,'cno'))){
    var d=diffDays(o.inicio,hoje());
    if(d>30) A.push({k:'crit', t:'Obra iniciada há '+overduePlural(d)+' sem cadastro no CNO (prazo de 30 dias).', to:base+'documentos'});
    else if(d>=20) A.push({k:'warn', t:'Cadastro no CNO vence em '+overduePlural(30-d)+'.', to:base+'documentos'});
  }
  DOC_LEGAIS.forEach(function(t){
    var dc=docLegal(oid,t.k); if(!dc||!dc.validade) return;
    var v=validade(dc.validade);
    if(v.k==='crit'||v.k==='warn') A.push({k:v.k, t:t.n+': '+v.t.toLowerCase()+'.', to:base+'documentos'});
  });
  if(new Date().getDate()>=10){
    var mes=mesAdd(hoje().slice(0,7),-1), r=docsMesResumo(oid,mes);
    if(r.pend>0) A.push({k:'warn', t:plural(r.pend,'prestador','prestadores')+' sem os documentos de '+mesNome(mes)+' conferidos (INSS, FGTS, folha e certidões).', to:base+'documentos'});
  }
  lobConflitos(oid).slice(0,3).forEach(function(t){ A.push({k:'warn', t:t, to:base+'balanco'}); });
  return A.concat(alertasP3(o));
}

/* ================= AGENDA ================= */
function eventosAuto(filtroOid){
  var out=[], hj=hoje(), seen={};
  function put(e){ if(!e.data||seen[e.key]) return; seen[e.key]=1; e.venc=e.data<hj&&e.status==='agendado'; out.push(e); }
  var obras=L('obras').filter(function(o){ return !filtroOid||o.id===filtroOid; });
  obras.forEach(function(o){
    var b='#/obra/'+o.id+'/';
    function add(data,titulo,area,to){ put({key:'a:'+o.id+':'+titulo+':'+data, data:data, hora:'', titulo:titulo, area:area, obraId:o.id, obra:o.nome, to:to, auto:true, status:'agendado'}); }
    byObra('ocorrencias',o.id).filter(ocAberta).forEach(function(x){ add(x.prazo, (x.status==='aguardando_reinspecao'?'Reinspeção: ':'Prazo de correção: ')+short(x.descricao,48), 'engenharia', b+'ocorrencias'); });
    byObra('atividades',o.id).forEach(function(a){ if((a.avanco||0)===0) add(a.inicio,'Início: '+a.nome,'prestadores',b+'cronograma'); if((a.avanco||0)<100) add(a.fim,'Fim previsto: '+a.nome,'prestadores',b+'cronograma'); });
    byObra('rfis',o.id).filter(function(r){return r.status==='aberto';}).forEach(function(r){ add(r.prazo,'Resposta de RFI: '+short(r.pergunta,44),'engenharia',b+'projeto'); });
    byObra('materiais',o.id).filter(function(m){return m.resultado==='pendente';}).forEach(function(m){ add(m.prazo,'Decisão sobre '+m.item,'cliente',b+'projeto'); });
    byObra('acoes',o.id).filter(function(a){return a.status==='aberta';}).forEach(function(a){ add(a.prazo,'Ação: '+short(a.descricao,44)+(a.responsavel?' ('+a.responsavel+')':''),'engenharia',b+'reunioes'); });
    DOC_LEGAIS.forEach(function(t){ var d=docLegal(o.id,t.k); if(d&&d.validade) add(d.validade,'Vence: '+t.n,'legal',b+'documentos'); });
    if(o.inicio && !docRegistrado(docLegal(o.id,'cno'))) add(addDays(o.inicio,30),'Prazo para cadastrar a obra no CNO','legal',b+'documentos');
    eventosP3(o,add,b);
  });
  var pr=filtroOid?prestAtivos(filtroOid):L('prestadores');
  pr.forEach(function(p){
    function addp(data,titulo){ put({key:'p:'+p.id+':'+titulo+':'+data, data:data, hora:'', titulo:titulo, area:'prestadores', obraId:filtroOid||'', obra:'', to:'#/prestadores', auto:true, status:'agendado'}); }
    addp(p.seguro,'Vence o seguro de '+p.nome); addp(p.treinamento,'Vence o treinamento de '+p.nome);
  });
  L('treinamentos').forEach(function(t){
    var p=G('prestadores',t.prestadorId); if(!p||!t.validade) return;
    if(filtroOid && prestAtivos(filtroOid).map(function(x){return x.id;}).indexOf(p.id)<0) return;
    put({key:'t:'+t.id, data:t.validade, hora:'', titulo:'Vence '+t.norma+' de '+(t.trabalhador||p.nome), area:'prestadores', obraId:filtroOid||'', obra:'', to:'#/prestadores', auto:true, status:'agendado'});
  });
  L('eventos').filter(function(e){ return !filtroOid||e.obraId===filtroOid; }).forEach(function(e){
    var ob=G('obras',e.obraId);
    put({key:'m:'+e.id, id:e.id, data:e.data, hora:e.hora||'', titulo:e.titulo, area:e.area||'engenharia', obraId:e.obraId||'', obra:ob?ob.nome:'', auto:false, status:e.status||'agendado', resp:e.responsavel||'', part:e.participantes||'', notas:e.notas||'', tipo:e.tipo||'', reag:e.reag||0, mot:e.motivoReag||''});
  });
  return out;
}

  var nvenc=evs.filter(function(e){return e.venc;}).length;

function conflitosEv(evs){
  var m={}, res={};
  evs.filter(function(e){ return !e.auto && e.hora && e.resp && e.status!=='cancelado' && e.status!=='realizado'; }).forEach(function(e){
    var k=e.data+'|'+e.hora+'|'+e.resp.trim().toLowerCase(); (m[k]=m[k]||[]).push(e);
  });
  Object.keys(m).forEach(function(k){ if(m[k].length>1) m[k].forEach(function(e){ res[e.key]=1; }); });
  return res;
}

/* ================= REUNIÕES E AÇÕES ================= */
function tReunioes(o){
  var oid=o.id, dias=o.diasEscalar==null?7:o.diasEscalar;
  var acs=byObra('acoes',oid), abertas=acs.filter(function(a){return a.status==='aberta';}).sort(function(a,b){return (a.prazo||'9')<(b.prazo||'9')?-1:1;});
  var feitas=acs.length-abertas.length;
  var atas=byObra('atas',oid).sort(function(a,b){ return a.data<b.data?1:-1; });

  var oid=o.id, its=byObra('ocorrencias',oid).filter(function(x){return x.origem==='pre_entrega';});
  var head='<div class="sec-h"><div><h2>Vistoria pré-entrega</h2><p class="muted small">Cada pendência vira uma ocorrência com prazo e responsável, e segue o mesmo fluxo de correção, contatos e reinspeção.</p></div><button class="btn primary" data-act="ent-nova" data-oid="'+oid+'" data-write>+ Item da vistoria</button></div>';
  if(!its.length) return head+'<div class="card empty" style="margin-top:14px"><h3>Nenhum item lançado</h3><p>Percorra a casa por ambiente e lance cada pendência com foto, responsável e prazo.</p></div>';
  var abertos=its.filter(ocAberta).length, amb={};
  its.forEach(function(x){ (amb[x.ambiente||'Sem ambiente']=amb[x.ambiente||'Sem ambiente']||[]).push(x); });
  var cards=Object.keys(amb).sort().map(function(a){
    var l=amb[a], ab=l.filter(ocAberta).length;
    return '<section class="card"><div class="card-h"><h3>'+esc(a)+'</h3><span class="chip '+(ab?'warn':'ok')+'">'+(ab?plural(ab,'pendente','pendentes'):'Concluído')+' · '+l.length+' item(ns)</span></div>'+l.sort(function(x,y){return ocAberta(x)===ocAberta(y)?0:(ocAberta(x)?-1:1);}).map(function(x){
      return '<div class="ficha" style="grid-template-columns:1fr auto"><div><button type="button" class="linkbtn" data-act="oc-abrir" data-id="'+x.id+'">'+esc(short(x.descricao,120))+'</button><div class="tiny muted">'+esc(prestNome(x.prestadorId)||'Responsável a definir')+(x.prazo?' · prazo '+fmtC(x.prazo):'')+'</div>'+thumbs(x.fotos)+'</div><span class="chip '+(!ocAberta(x)?'ok':(vencidaOc(x)?'crit':''))+'">'+esc(OC_STATUS[x.status])+'</span></div>';
    }).join('')+'</section>';
  }).join('');
  return head+'<div class="row" style="margin:12px 0"><span class="chip '+(abertos?'warn':'ok')+'">'+abertos+' de '+its.length+' itens abertos</span></div><div class="grid cols2">'+cards+'</div>';
}

  openForm({title:'Item da vistoria pré-entrega', wide:true,

      {name:'descricao',label:'Pendência',type:'textarea',required:true,rows:2,ph:'Ex.: Rejunte falhado atrás da porta'},
      {name:'gravidade',label:'Gravidade',type:'radio',required:true,options:Object.keys(GRAV).map(function(k){return [k,GRAV[k]];}),value:'simples'},
      [{name:'prestadorId',label:'Responsável pela correção',type:'select',options:prestOptions('A definir')},{name:'prazo',label:'Prazo',type:'date',required:true,value:addDays(hoje(),7)}],

/* ================= LINHA DE BALANÇO ================= */
function tBalanco(o){
  var oid=o.id, locs=locsDe(oid), svs=byObra('servicos',oid).sort(function(a,b){ return (a.ordem||0)-(b.ordem||0) || (a.inicio<b.inicio?-1:1); });
  var head='<div class="sec-h"><div><h2>Linha de balanço</h2><p class="muted small">Para obras com repetição (unidades, pavimentos ou quadras). Mostra o ritmo de cada serviço e onde uma equipe vai alcançar a outra.</p></div><div class="row"><button class="btn" data-act="loc-novas" data-oid="'+oid+'" data-write>+ Localizações</button><button class="btn primary" data-act="serv-novo" data-oid="'+oid+'" data-write'+(locs.length?'':' disabled')+'>+ Serviço</button></div></div>';
  if(!locs.length) return head+'<div class="card empty" style="margin-top:14px"><h3>Nenhuma localização cadastrada</h3><p>Cadastre as unidades, pavimentos ou quadras da obra (por exemplo, “Casa 1, Casa 2, Casa 3” ou “Térreo, 1º pavimento”). Depois lance os serviços que passam por todas elas.</p></div>';
  var chips='<div class="row" style="gap:6px;margin:12px 0">'+locs.map(function(l){ return '<span class="chip">'+esc(l.nome)+' <button type="button" class="linkbtn" style="display:inline;color:var(--crit)" data-act="loc-excluir" data-id="'+l.id+'" data-write aria-label="Remover '+esc(l.nome)+'">×</button></span>'; }).join('')+'</div>';
  if(!svs.length) return head+chips+'<div class="card empty"><h3>Nenhum serviço lançado</h3><p>Cada serviço tem uma data de início na primeira localização e um número de dias por localização. O gráfico mostra o previsto e o realizado.</p></div>';
  var cf=lobConflitos(oid), cfHtml=cf.length?'<div class="callout" style="margin-bottom:14px"><strong>Equipes que se alcançam</strong><ul>'+cf.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>':'';
  var rows=svs.map(function(s,i){
    var r=lobResumo(s,locs), k=r.ratio==null?'':(r.ratio>=0.95?'ok':(r.ratio>=0.75?'warn':'crit'));
    return '<tr><td><span class="dot" style="background:var(--s'+((i%5)+1)+');margin-right:8px"></span><strong>'+esc(s.nome)+'</strong><div class="tiny muted">'+esc(prestNome(s.prestadorId)||'Sem prestador')+' · início '+fmtC(s.inicio)+' · '+s.diasPorLoc+' dia(s) por localização</div></td><td class="num">'+r.done+' de '+r.N+'</td><td class="num">'+r.plan.toFixed(1).replace('.',',')+' → '+r.prog.toFixed(1).replace('.',',')+'</td><td><span class="chip '+k+'">'+(r.ratio==null?'Ainda não começou':Math.round(r.ratio*100)+'% do previsto')+'</span></td><td style="white-space:nowrap"><button class="btn sm" data-act="serv-av" data-id="'+s.id+'" data-write>Lançar avanço</button> <button class="btn sm ghost" data-act="serv-editar" data-id="'+s.id+'" data-write>Editar</button></td></tr>';
  }).join('');
  var leg=svs.map(function(s,i){ return '<span><i style="display:inline-block;width:18px;height:3px;background:var(--s'+((i%5)+1)+');margin-right:6px;vertical-align:middle"></i>'+esc(s.nome)+'</span>'; }).join('');
  return head+chips+cfHtml+'<div class="card" style="overflow-x:auto;padding:8px">'+lobChart(locs,svs)+'</div><div class="legenda" style="margin-top:8px">'+leg+'<span>Tracejado: previsto</span><span>Linha cheia: realizado</span><span>Anel vermelho: localização atrasada</span></div>'
    +'<section class="card" style="margin-top:16px"><div class="card-h"><h2>Ritmo por serviço</h2><span class="small muted">Previsto → realizado, em localizações concluídas até hoje</span></div><div class="tbl-scroll"><table class="tbl"><thead><tr><th>Serviço</th><th>Concluídas</th><th>Previsto → realizado</th><th>Ritmo</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function lobChart(locs,svs){
  var LW=124, RH=28, TOP=32, RIGHT=16, hj=hoje(), minD=hj, maxD=hj;
  svs.forEach(function(s){ locs.forEach(function(l,k){
    var a=avLoc(s,l.id), st=lobIni(s,k), en=lobFim(s,k);
    if(st<minD) minD=st; if(en>maxD) maxD=en; if(a&&a.ini&&a.ini<minD) minD=a.ini;
  }); });
  var start=addDays(minD,-2), end=addDays(maxD,7), days=diffDays(start,end)+1, dx=Math.max(7,Math.min(16,860/days));
  var W=LW+days*dx+RIGHT, H=TOP+locs.length*RH+18;
  var X=function(d){ return LW+diffDays(start,d)*dx; }, Y=function(k){ return TOP+k*RH+RH/2; };
  var g='';
  locs.forEach(function(l,k){ g+='<line x1="'+LW+'" x2="'+(W-RIGHT)+'" y1="'+(TOP+k*RH)+'" y2="'+(TOP+k*RH)+'" class="lob-grid"/><text x="'+(LW-8)+'" y="'+(Y(k)+4)+'" text-anchor="end" class="lob-t">'+esc(short(l.nome,16))+'</text>'; });
  g+='<line x1="'+LW+'" x2="'+(W-RIGHT)+'" y1="'+(TOP+locs.length*RH)+'" y2="'+(TOP+locs.length*RH)+'" class="lob-grid"/>';
  for(var d=segunda(start); d<=end; d=addDays(d,7)){ if(d<start) continue; g+='<line x1="'+X(d)+'" x2="'+X(d)+'" y1="'+(TOP-6)+'" y2="'+(TOP+locs.length*RH)+'" class="lob-grid"/><text x="'+(X(d)+3)+'" y="'+(TOP-12)+'" class="lob-t">'+fmtC(d)+'</text>'; }
  svs.forEach(function(s,i){
    var col='var(--s'+((i%5)+1)+')', pp=[], rp=[], marks='';
    locs.forEach(function(l,k){
      var st=lobIni(s,k), en=lobFim(s,k), mid=addDays(st,Math.floor((s.diasPorLoc||1)/2)), a=avLoc(s,l.id), p=a?(a.p||0):0;
      pp.push(X(mid)+','+Y(k));
      if(p>0){ var xr=X(a.fim||hj); rp.push(xr+','+Y(k)); marks+='<circle cx="'+xr+'" cy="'+Y(k)+'" r="'+(p>=100?4:3.5)+'" fill="'+(p>=100?col:'var(--surface)')+'" stroke="'+col+'" stroke-width="2"/>'; }
      if(en<hj && p<100) marks+='<circle cx="'+X(mid)+'" cy="'+Y(k)+'" r="7" fill="none" stroke="var(--crit)" stroke-width="2"><title>'+esc(s.nome+' em '+l.nome+': previsto até '+fmtC(en))+'</title></circle>';
    });
    g+='<polyline points="'+pp.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-dasharray="6 4" opacity=".6"/>';
    if(rp.length>1) g+='<polyline points="'+rp.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="3"/>';
    g+=marks;
  });
  g+='<line x1="'+X(hj)+'" x2="'+X(hj)+'" y1="'+(TOP-6)+'" y2="'+(TOP+locs.length*RH)+'" stroke="var(--crit)" stroke-width="2"/><text x="'+X(hj)+'" y="'+(TOP+locs.length*RH+13)+'" text-anchor="middle" class="lob-t" fill="var(--crit)" style="fill:var(--crit)">hoje</text>';
  return '<svg class="lob" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Linha de balanço: previsto e realizado de cada serviço por localização">'+g+'</svg>';
}
function locsForm(oid){
  openForm({title:'Cadastrar localizações', intro:'Uma por linha, na ordem em que a equipe percorre a obra. Ex.: Casa 1, Casa 2… ou Térreo, 1º pavimento, Cobertura.',
    fields:[{name:'lista',label:'Localizações',type:'textarea',required:true,rows:6},{name:'tipo',label:'Tipo',type:'select',options:[['Unidade','Unidade'],['Pavimento','Pavimento'],['Quadra','Quadra'],['Outro','Outro']],value:'Unidade'}],
    submit:'Cadastrar',
    onSubmit:async function(v){
      var nomes=(v.lista||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);
      if(!nomes.length) return 'Escreva ao menos uma localização.';
      var ordem=locsDe(oid).reduce(function(m,l){return Math.max(m,l.ordem||0);},0);
      await Promise.all(nomes.map(function(n,i){ return Store.add('locs',{obraId:oid, nome:n, tipo:v.tipo, ordem:ordem+i+1}); }));
    }});
}
function servForm(oid,s){
  var novo=!s, outros=byObra('servicos',oid).filter(function(x){return !s||x.id!==s.id;});
  openForm({title:novo?'Novo serviço na linha de balanço':'Editar serviço',
    intro:'O serviço começa na primeira localização na data de início e segue para as outras no ritmo de dias por localização.',
    fields:[{name:'nome',label:'Serviço',required:true,value:s&&s.nome,ph:'Ex.: Alvenaria'},
      [{name:'inicio',label:'Início na 1ª localização',type:'date',required:true,value:s&&s.inicio},{name:'diasPorLoc',label:'Dias por localização',type:'number',min:1,step:1,required:true,value:s?s.diasPorLoc:5}],
      [{name:'prestadorId',label:'Prestador',type:'select',options:prestOptions('Sem prestador'),value:s&&s.prestadorId},{name:'pred',label:'Vem depois de',type:'select',options:selOpts(outros.map(function(x){return [x.id,x.nome];}),'Nenhum'),value:s&&s.pred}]],
    extra:novo?'':'<button type="button" class="btn danger" data-act="serv-excluir" data-id="'+s.id+'" style="margin-right:auto">Excluir</button>',
    onSubmit:async function(v){
      if(!(v.nome||'').trim()) return 'Informe o serviço.';
      if(!v.inicio) return 'Informe o início.';
      if(!(v.diasPorLoc>=1)) return 'Informe quantos dias o serviço leva em cada localização.';
      await Store.set('servicos', s?s.id:nid(), Object.assign({av:{}, ordem:outros.length+1}, s||{}, {obraId:oid, nome:v.nome.trim(), inicio:v.inicio, diasPorLoc:Math.round(v.diasPorLoc), prestadorId:v.prestadorId||'', pred:v.pred||''}));
    }});
}
function servAvanco(id){
  var s=G('servicos',id), locs=locsDe(s.obraId);
  openForm({title:'Avanço: '+s.nome, intro:'Percentual concluído em cada localização, hoje ('+fmt(hoje())+').',
    fields:locs.map(function(l){ return {name:'p_'+l.id,label:l.nome,type:'number',min:0,max:100,step:1,value:(avLoc(s,l.id)||{p:0}).p||0}; }),
    submit:'Salvar avanço',
    onSubmit:async function(v){
      var av=clone(s.av||{});
      locs.forEach(function(l){
        var p=Math.max(0,Math.min(100,Number(v['p_'+l.id])||0)), a=av[l.id]||{p:0};
        var n={p:p};
        if(a.ini) n.ini=a.ini; if(p>0&&!n.ini) n.ini=hoje();
        if(p>=100) n.fim=a.fim||hoje();
        if(p>0||a.ini) av[l.id]=n; else delete av[l.id];
      });
      await Store.set('servicos', id, Object.assign({}, s, {av:av}));
    }});
}

function treinForm(t){
  var novo=!t;
  openForm({title:novo?'Novo treinamento':'Editar treinamento',
    fields:[{name:'prestadorId',label:'Prestador',type:'select',required:true,options:selOpts(L('prestadores').sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'');}).map(function(p){return [p.id,p.nome];}),'Selecione…'),value:t&&t.prestadorId},
      {name:'trabalhador',label:'Trabalhador',value:t&&t.trabalhador,ph:'Nome, ou deixe em branco para a equipe toda'},

      {name:'validade',label:'Validade',type:'date',required:true,value:t&&t.validade},
