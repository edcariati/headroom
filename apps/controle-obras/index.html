<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Controle de Obras Cariati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --surface2:#F5F7F6; --ink:#15242C; --ink2:#4B5C65; --ink3:#77888F;
  --line:#D2D9DB; --line2:#E3E8E9;
  --steel:#2B5B7B; --steel-soft:#DBE8F0; --on-steel:#FFFFFF;
  --ok:#2A7554; --ok-soft:#DCEEE5;
  --amber:#B87D00; --amber-bar:#E2A400; --amber-soft:#FAEFC8;
  --crit:#B4382C; --crit-soft:#F8DEDA;
  --idle:#CBD2D5; --shadow:0 1px 0 rgba(21,36,44,.06);
  --s1:#2B5B7B; --s2:#2A8A85; --s3:#B87D00; --s4:#8A4F91; --s5:#6C7A2B;
  --a-engenharia:var(--steel); --a-suprimentos:var(--amber-bar); --a-prestadores:var(--s2); --a-financeiro:var(--s4); --a-cliente:var(--s5); --a-legal:var(--ink2);
  --f-head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181C; --surface:#1A242A; --surface2:#202B32; --ink:#E6ECEE; --ink2:#A3B3BA; --ink3:#7C8D95;
    --line:#2F3D45; --line2:#26333A;
    --steel:#79B4DA; --steel-soft:#203B4D; --on-steel:#0D1A22;
    --ok:#5DC192; --ok-soft:#1B3A2E;
    --amber:#E3AE32; --amber-bar:#E7B341; --amber-soft:#3B3116;
    --crit:#F0806F; --crit-soft:#432420;
    --idle:#3A4A53; --shadow:none;
    --s1:#79B4DA; --s2:#5CC7C0; --s3:#E3AE32; --s4:#C68FD0; --s5:#B4C563;
  }
}
:root[data-theme="dark"]{
  --bg:#11181C; --surface:#1A242A; --surface2:#202B32; --ink:#E6ECEE; --ink2:#A3B3BA; --ink3:#7C8D95;
  --line:#2F3D45; --line2:#26333A;
  --steel:#79B4DA; --steel-soft:#203B4D; --on-steel:#0D1A22;
  --ok:#5DC192; --ok-soft:#1B3A2E;
  --amber:#E3AE32; --amber-bar:#E7B341; --amber-soft:#3B3116;
  --crit:#F0806F; --crit-soft:#432420;
  --idle:#3A4A53; --shadow:none;
  --s1:#79B4DA; --s2:#5CC7C0; --s3:#E3AE32; --s4:#C68FD0; --s5:#B4C563;
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;line-height:1.15;margin:0;letter-spacing:.005em}
h1{font-size:30px;font-weight:700}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
a{color:var(--steel);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:3px}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}
.num{font-family:var(--f-head);font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.stack>*+*{margin-top:12px}
.hide{display:none!important}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.01em;color:var(--ink);white-space:nowrap}
.brand span{color:var(--steel)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav a{font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--ink2);padding:6px 12px;border-radius:4px;white-space:nowrap}
.nav a:hover{text-decoration:none;background:var(--surface2)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--steel);border-radius:0}
.top .tools{margin-left:auto;display:flex;gap:6px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 64px}
.banner{background:var(--amber-soft);color:var(--ink);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;text-align:center}

/* botões */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--on-steel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ico{padding:8px 10px}
.ro [data-write]{display:none!important}

/* cartões e listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.pad{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.grid{display:grid;gap:14px}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.cols3{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.sec{margin-top:26px}
.sec>h2,.sec>.sec-h{margin-bottom:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--line);color:var(--ink2);background:var(--surface2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.steel{background:var(--steel-soft);color:var(--steel);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--amber-bar)}.dot.crit{background:var(--crit)}.dot.steel{background:var(--steel)}

/* alertas */
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line2)}
.alerts li:first-child{border-top:0}
.alerts .dot{margin-top:6px}

/* cabeçalho da obra */
.ob-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ob-head .meta{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:6px;color:var(--ink2);font-size:14px}
.back{font-size:14px;color:var(--ink2);display:inline-block;margin-bottom:6px}

/* régua de etapas */
.regua-wrap{overflow-x:auto;padding-bottom:4px}
.regua{display:flex;gap:10px;min-width:640px}
.regua .fase{min-width:0}
.regua .fase .segs{display:grid;gap:2px}
.regua .fase .lbl{font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;align-items:flex-end;justify-content:center;height:38px;border-radius:2px;background:transparent;border:1px solid var(--idle);color:var(--ink3);font-family:var(--f-head);font-size:11px;font-weight:600;padding-bottom:3px;position:relative}
.seg:hover{text-decoration:none;border-color:var(--ink2)}
.seg.em_execucao{background:var(--steel);border-color:var(--steel);color:var(--on-steel)}
.seg.aguardando_vistoria{background:var(--amber-bar);border-color:var(--amber-bar);color:#241B00}
.seg.liberada{background:var(--ok);border-color:var(--ok);color:#fff}
.seg.crit::before{content:"";position:absolute;left:-1px;right:-1px;top:-4px;height:4px;background:var(--crit);border-radius:2px 2px 0 0}
.regua.mini{min-width:0;gap:5px}
.regua.mini .seg{height:12px;padding:0;font-size:0;border-radius:1px}
.regua.mini .fase .lbl{display:none}
.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink2)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px;border:1px solid var(--idle)}
.legenda i.em_execucao{background:var(--steel);border-color:var(--steel)}
.legenda i.aguardando_vistoria{background:var(--amber-bar);border-color:var(--amber-bar)}
.legenda i.liberada{background:var(--ok);border-color:var(--ok)}
.legenda i.crit{background:var(--crit);border-color:var(--crit)}

/* abas */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:20px;scrollbar-width:none}
.tabs a{font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--ink2);padding:9px 14px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{text-decoration:none;color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--steel)}

/* quadro de indicadores */
.ind{width:100%;border-collapse:collapse}
.ind th,.ind td{text-align:left;padding:10px 16px;border-top:1px solid var(--line2);vertical-align:top}
.ind thead th{border-top:0;font-size:12px;color:var(--ink3);font-weight:500}
.ind td.v{font-family:var(--f-head);font-size:21px;font-weight:600;white-space:nowrap}
.ind .f{font-size:12px;color:var(--ink3)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding:8px 16px 0}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars .b .col{width:100%;max-width:38px;background:var(--steel);border-radius:2px 2px 0 0;min-height:2px}
.bars .b .col.low{background:var(--crit)}
.bars .b .col.open{background:var(--idle)}
.bars .b span{font-size:11px;color:var(--ink3);margin-top:4px;white-space:nowrap}
.bars .b .val{font-family:var(--f-head);font-size:12px;color:var(--ink2);margin:0 0 2px}
.hbar{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;padding:4px 16px;font-size:13px}
.hbar .t{height:10px;background:var(--surface2);border-radius:2px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--steel)}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line2);border-radius:6px;min-height:120px}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-family:var(--f-head);font-weight:600;font-size:15px}
.col>header .n{color:var(--ink3);font-weight:500}
.col .cards{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 12px;position:relative}
.kcard.crit{border-left:4px solid var(--crit)}
.kcard.importante{border-left:4px solid var(--amber-bar)}
.kcard .t{font-weight:500;display:block;color:var(--ink);line-height:1.3}
.kcard .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kcard .mv{display:flex;gap:6px;margin-top:8px}

/* gantt */
.gantt-scroll{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-height:70vh}
.gantt{--dw:16px;--lw:230px;position:relative;min-width:min-content}
.g-row{display:grid;grid-template-columns:var(--lw) calc(var(--days)*var(--dw));border-top:1px solid var(--line2);min-height:34px}
.g-row.head{position:sticky;top:0;z-index:3;background:var(--surface);border-top:0;border-bottom:1px solid var(--line)}
.g-label{position:sticky;left:0;z-index:2;background:var(--surface);padding:6px 10px;border-right:1px solid var(--line);overflow:hidden;font-size:13px;line-height:1.25}
.g-row.head .g-label{z-index:4;font-family:var(--f-head);font-weight:600}
.g-row.etapa .g-label{background:var(--surface2);font-family:var(--f-head);font-weight:600;font-size:14px}
.g-row.etapa .g-track{background:var(--surface2)}
.g-label button{all:unset;cursor:pointer;display:block;width:100%}
.g-label button:hover .nm{text-decoration:underline}
.g-label .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.g-track{position:relative;background-image:repeating-linear-gradient(to right,var(--line2) 0,var(--line2) 1px,transparent 1px,transparent calc(var(--dw)*7))}
.g-weeks{display:flex;height:34px}
.g-weeks span{flex:none;width:calc(var(--dw)*7);font-size:11px;color:var(--ink3);padding:9px 0 0 4px;border-left:1px solid var(--line2);white-space:nowrap}
.g-bar{position:absolute;top:8px;height:16px;border-radius:3px;background:var(--steel-soft);border:1px solid var(--steel);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--steel)}
.g-bar.late{border-color:var(--crit);background:var(--crit-soft)}
.g-bar.late i{background:var(--crit)}
.g-bar.done{border-color:var(--ok);background:var(--ok-soft)}
.g-bar.done i{background:var(--ok)}
.g-base{position:absolute;top:26px;height:4px;border-radius:2px;background:var(--ink3);opacity:.55}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:1;pointer-events:none}
.g-today-l{position:absolute;top:0;z-index:5;transform:translateX(-50%);background:var(--crit);color:#fff;font-size:10px;padding:0 4px;border-radius:0 0 3px 3px}

/* diário */
.entry{padding:14px 16px;border-top:1px solid var(--line2)}
.entry:first-child{border-top:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs button{all:unset;cursor:pointer;display:block}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block}

/* ficha de verificação */
.ficha{padding:14px 16px;border-top:1px solid var(--line2);display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.ficha:first-child{border-top:0}
.ficha .cri{font-size:13px;color:var(--ink2)}
.ficha .err{font-size:12px;color:var(--ink3)}
.callout{border:1px solid var(--line);border-left:4px solid var(--amber-bar);background:var(--amber-soft);border-radius:5px;padding:12px 14px;font-size:14px}
.callout.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout ul{margin:6px 0 0;padding-left:18px}
details.ex summary{cursor:pointer;font-family:var(--f-head);font-weight:600;font-size:16px;padding:12px 16px}
details.ex ul{margin:0;padding:0 16px 14px 34px}
details.ex li+li{margin-top:4px}

/* tabelas simples */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--ink3);font-weight:500;text-align:left;padding:8px 16px}
.tbl td{padding:10px 16px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl-scroll{overflow-x:auto}

/* diálogos e formulários */
dialog{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 12px 40px rgba(0,0,0,.28)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,18,22,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.fld{display:block;margin-bottom:14px}
.fld>label,.fld>.lb{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-height:40px}
.fld textarea{resize:vertical}
.fld .hint{font-size:12px;color:var(--ink3);margin-top:4px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fld2{grid-template-columns:1fr}}
.seg-opts{display:flex;gap:6px;flex-wrap:wrap}
.seg-opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:7px 12px;cursor:pointer;font-size:14px;color:var(--ink);margin:0;font-weight:500}
.seg-opts input{width:auto;min-height:0;margin:0}
.seg-opts label:has(input:checked){border-color:var(--steel);background:var(--steel-soft)}
.efet-row{display:grid;grid-template-columns:1fr 84px 34px;gap:8px;margin-bottom:8px}
.err-msg{color:var(--crit);font-size:13px;margin-top:6px}
.thumbs.edit .rm{position:relative}
.thumbs.edit .rm button.x{position:absolute;top:2px;right:2px;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;text-align:center;line-height:22px;font-size:14px}
.lightbox img{max-width:100%;max-height:calc(100vh - 120px);display:block;margin:0 auto;border-radius:4px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100vw - 24px))}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.err{background:var(--crit);color:#fff}

@media (max-width:640px){
  h1{font-size:25px}
  .top-in{gap:8px;padding:8px 12px}
  .brand{font-size:16px}
  .wrap{padding:16px 12px 56px}
  .gantt{--lw:150px}
  .ind td.v{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.seg,.nav a,.tabs a{transition:background-color .12s,border-color .12s,color .12s}
}

.linkbtn{all:unset;cursor:pointer;color:var(--ink);font-weight:500;line-height:1.3;display:block}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.kcard a.t{color:var(--ink)}

/* agenda */
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 4px;font-size:12px;color:var(--ink3);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-d{all:unset;box-sizing:border-box;cursor:pointer;min-height:58px;background:var(--surface);border:1px solid var(--line2);border-radius:5px;padding:5px 6px;display:flex;flex-direction:column;gap:4px}
.cal-d:hover{border-color:var(--ink3)}
.cal-d:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.cal-d.out{opacity:.45}
.cal-d.venc{border-color:var(--crit)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--steel)}
.cal-d.sel{background:var(--steel-soft)}
.cal-d .n{font-family:var(--f-head);font-weight:600;font-size:14px}
.cal-d .dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.cal-d .dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line2);align-items:start}
@media (max-width:640px){.ev{grid-template-columns:44px 1fr}.ev>.row:last-child{grid-column:1/-1}.cal-d{min-height:48px;padding:4px}}
.lob{display:block;max-width:none}
.lob-grid{stroke:var(--line2);stroke-width:1}
.lob-t{fill:var(--ink3);font-size:11px;font-family:var(--f-body)}


/* nuvem, login e histórico */
.login{max-width:420px;margin:8vh auto 0}
.login .card{padding:22px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:120px 1fr auto;gap:6px 14px;padding:10px 16px;border-top:1px solid var(--line2);align-items:start}
.hist li:first-child{border-top:0}
.hist .q{font-size:12px;color:var(--ink3);line-height:1.3}
.hist .d{font-size:13px;color:var(--ink2)}
@media (max-width:640px){.hist li{grid-template-columns:1fr}.hist li>.row{justify-self:start}}
code.k{font-size:12px;background:var(--surface2);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;word-break:break-all}
</style>

<script>
(function(){
'use strict';
var PROTO = {"fases":[{"id":"F0","nome":"Planejamento e legalização","etapas":[1]},{"id":"F1","nome":"Preparação do terreno","etapas":[2,3,4]},{"id":"F2","nome":"Fundação, estrutura e fechamento","etapas":[5,6,7,8]},{"id":"F3","nome":"Sistemas embutidos e proteção","etapas":[9,10,11,12,13]},{"id":"F4","nome":"Acabamentos","etapas":[14,15,16,17,18,19]},{"id":"F5","nome":"Entorno, entrega e pós-obra","etapas":[20,21,22]}],"etapas":[{"n":1,"nome":"Pré-obra","objetivo":"A obra só abre com terreno regularizado, projetos completos, orçamento fechado, contratos assinados e licenças emitidas.","liberacao":"alvará emitido, contrato assinado e projetos compatibilizados.","itens":["Documentação do terreno: matrícula, IPTU, levantamento planialtimétrico e sondagem do solo (SPT).","Projeto arquitetônico aprovado pelo cliente e pela prefeitura.","Projetos complementares: estrutural, fundação, hidráulico, elétrico, gás, dados e demais disciplinas.","Compatibilização dos projetos, com conflitos resolvidos antes da execução.","Memorial descritivo e especificações de materiais e acabamentos definidos.","Orçamento detalhado por serviço, com quantitativos, unidades e preços unitários.","Cronograma físico-financeiro aprovado.","Contratos assinados: cliente, empreiteiros e fornecedores principais.","Alvará de construção, ART/RRT e matrícula da obra (CEI/CNO) emitidos.","Seguros e responsabilidades definidos."],"verif":[{"item":"Sondagem do solo","criterio":"Número de furos conforme NBR 8036, relatório assinado por profissional habilitado","erro":"Projetar fundação sem sondagem ou com relatório de outro terreno","evidencia":"Relatório de sondagem"},{"item":"Projetos","criterio":"Compatibilizados, sem interferência entre estrutura, hidráulica e elétrica","erro":"Executar com revisão desatualizada","evidencia":"Lista de projetos com revisão e data"},{"item":"Licenças","criterio":"Alvará, ART/RRT e matrícula da obra emitidos antes de iniciar","erro":"Iniciar a obra antes do alvará","evidencia":"Cópias arquivadas"},{"item":"Contratos","criterio":"Escopo, prazo, valor e medição definidos por escrito","erro":"Escopo genérico que gera disputa depois","evidencia":"Contratos assinados"},{"item":"Orçamento e cronograma","criterio":"Aprovados pelo cliente e com data-base registrada","erro":"Iniciar sem cronograma físico-financeiro","evidencia":"Documentos aprovados"}]},{"n":2,"nome":"Mobilização e canteiro","objetivo":"O canteiro precisa estar seguro, organizado e com água, energia e armazenagem antes da primeira máquina entrar.","liberacao":"canteiro fechado, com água, energia e almoxarifado funcionando.","itens":["Limpeza inicial do terreno e remoção de entulho ou vegetação.","Tapume ou cercamento e placa da obra com dados do alvará e dos responsáveis técnicos.","Ligação provisória de água e de energia.","Barracão, almoxarifado, sanitário e área de vivência da equipe.","Definição de áreas de estoque, bancada de armação e central de argamassa/concreto.","Acesso para caminhões e proteção da calçada e do entorno.","Registro fotográfico do terreno e dos imóveis vizinhos (vistoria cautelar quando necessário).","Plano de segurança do canteiro e treinamento inicial."],"verif":[{"item":"Placa da obra","criterio":"Visível, com dados do alvará e dos responsáveis técnicos","erro":"Obra sem placa","evidencia":"Foto da placa"},{"item":"Ligação elétrica provisória","criterio":"Quadro com DR, aterramento e disjuntores identificados","erro":"Ligação improvisada, fios expostos","evidencia":"Foto do quadro"},{"item":"Armazenagem de cimento","criterio":"Local seco, coberto e sobre estrado","erro":"Cimento no chão ou exposto à chuva","evidencia":"Foto do almoxarifado"},{"item":"Vistoria cautelar dos vizinhos","criterio":"Feita antes de escavar, com fotos das trincas existentes","erro":"Não registrar o estado prévio","evidencia":"Laudo com fotos"},{"item":"Sanitário e vivência","criterio":"Instalados e em uso pela equipe","erro":"Equipe sem estrutura mínima","evidencia":"Foto"}]},{"n":3,"nome":"Terraplanagem e locação","objetivo":"O terreno deve chegar às cotas de projeto, com o volume de corte e aterro controlado e a obra locada com precisão.","liberacao":"platô nas cotas de projeto e locação conferida pelo responsável técnico.","itens":["Conferência das cotas do terreno contra o projeto e o levantamento topográfico.","Plano de corte e aterro, com volumes calculados e destino do bota-fora definido.","Contratação da máquina e do transporte, com medição por hora ou por volume.","Execução do corte, do aterro e da regularização do terreno.","Aterro em camadas compactadas, com controle de compactação quando o projeto exigir.","Drenagem provisória para evitar erosão e acúmulo de água.","Contenção ou talude, quando houver desnível relevante.","Locação da obra com gabarito, conferência de esquadro, eixos e níveis.","Marco de referência de nível (RN) protegido para toda a obra.","Vizinhos avisados antes do primeiro corte, com canal de contato e horário de trabalho definidos.","Vistoria cautelar dos imóveis vizinhos concluída antes das máquinas entrarem.","Divisas e marcos conferidos antes de cortar ou aterrar perto deles, sem invadir nem retirar apoio de muros vizinhos.","Poeira, ruído, lama na via e trânsito de caminhões controlados, com a via limpa ao fim do dia.","Interferência encontrada na escavação (rede, tubulação, cisterna, rocha ou lençol freático): parar o serviço, registrar e acionar o responsável técnico.","Reclamação de vizinho ou imprevisto do solo registrado como ocorrência, com decisão e, quando couber, aditivo."],"verif":[{"item":"Cotas do platô","criterio":"Conferidas com nível topográfico, dentro da tolerância do projeto","erro":"Terreno nivelado a olho, sem referência","evidencia":"Planilha de níveis assinada"},{"item":"Compactação do aterro","criterio":"Camadas com espessura controlada e grau de compactação do projeto","erro":"Aterro lançado em camada grossa e sem compactar","evidencia":"Laudo de compactação"},{"item":"Bota-fora","criterio":"Destino licenciado e comprovado","erro":"Descarte irregular de terra e entulho","evidencia":"Comprovante de destinação"},{"item":"Locação","criterio":"Diagonais do gabarito iguais, eixos e níveis conferidos","erro":"Gabarito solto ou fora de esquadro","evidencia":"Planilha de locação assinada"},{"item":"Referência de nível (RN)","criterio":"Protegido e visível durante toda a obra","erro":"RN perdido ou removido pelas máquinas","evidencia":"Foto e croqui do RN"},{"item":"Vizinhos e divisas","criterio":"Divisas preservadas, sem invasão; reclamações registradas e respondidas no prazo","erro":"Cortar junto ao muro do vizinho sem aviso nem apoio","evidencia":"Vistoria cautelar e registro de ocorrências"},{"item":"Poeira, ruído e via pública","criterio":"Umidificação do terreno, horário permitido, via limpa","erro":"Caminhões saindo com lama, trabalho fora do horário","evidencia":"Foto da via e registro"},{"item":"Interferências e imprevistos do solo","criterio":"Serviço parado, registrado e avaliado antes de seguir","erro":"Continuar escavando sobre rede ou rocha sem avisar","evidencia":"Ocorrência com foto e decisão do responsável técnico"}]},{"n":4,"nome":"Contenções e drenagem do terreno","objetivo":"Quando há desnível, talude ou divisa com vizinho, a contenção e a drenagem são executadas antes de qualquer fundação próxima.","liberacao":"contenção executada conforme projeto e drenagem funcionando.","itens":["Levantamento dos desníveis, taludes, divisas e construções vizinhas.","Projeto de contenção (muro de arrimo, cortina, gabião ou talude) com responsável técnico.","Escavação e execução da contenção antes das fundações próximas ao desnível.","Drenagem do terreno: canaletas, drenos, barbacãs e caixas de passagem.","Impermeabilização da face da contenção em contato com o solo.","Reaterro com material drenante, em camadas compactadas.","Escoamento da água para ponto autorizado, sem prejudicar vizinhos nem a via.","Monitoramento de trincas e deslocamentos nos imóveis vizinhos durante as escavações."],"verif":[{"item":"Contenção","criterio":"Dimensões, armação e fundação conforme projeto","erro":"Muro de arrimo sem dreno nem barbacã","evidencia":"Foto da armação, laudo do concreto"},{"item":"Drenagem","criterio":"Caimento contínuo, sem empoçamento, com descarga autorizada","erro":"Água direcionada para o terreno vizinho","evidencia":"Foto do teste com água"},{"item":"Impermeabilização do lado do solo","criterio":"Aplicada antes do reaterro","erro":"Reaterrar sem proteger a face","evidencia":"Foto antes do reaterro"},{"item":"Reaterro","criterio":"Material drenante, camadas compactadas","erro":"Reaterro com entulho ou terra argilosa","evidencia":"Registro e foto"},{"item":"Vizinhos","criterio":"Sem novas trincas, com monitoramento registrado","erro":"Não acompanhar as fissuras","evidencia":"Relatório de monitoramento"}]},{"n":5,"nome":"Fundação","objetivo":"A fundação segue estritamente o projeto de fundação e a sondagem, e nada é concretado sem conferência prévia.","liberacao":"vistoria da armação antes da concretagem, resultado dos corpos de prova e baldrames impermeabilizados.","itens":["Confirmação do tipo de fundação contra a sondagem (sapata, radier, estaca, broca, entre outras).","Gabarito e marcação dos eixos conferidos antes da escavação.","Escavação nas dimensões e profundidades de projeto, com fundo limpo e nivelado.","Lastro de concreto magro, quando previsto.","Fôrmas de vigas baldrame e sapatas, conferidas em prumo, nível e dimensões.","Armaduras conferidas: bitola, quantidade, espaçamento, cobrimento e ancoragens.","Espera dos pilares e das instalações que atravessam a fundação.","Concretagem com concreto especificado, nota de entrega, slump e corpos de prova.","Cura do concreto pelo prazo mínimo.","Impermeabilização das vigas baldrame.","Reaterro compactado e preparação do contrapiso, com tubulações enterradas testadas antes de fechar."],"verif":[{"item":"Escavação","criterio":"Profundidade e dimensões do projeto, fundo limpo e em solo firme","erro":"Escavação rasa ou com fundo de solo solto","evidencia":"Foto com trena e nível"},{"item":"Solo encontrado","criterio":"Compatível com a sondagem; divergência registrada e avaliada pelo projetista","erro":"Executar a fundação prevista sem avisar que o solo é diferente","evidencia":"Foto da escavação, parecer do projetista e aditivo, se houver mudança"},{"item":"Armadura","criterio":"Bitola, espaçamento, ancoragem e cobrimento do projeto, com espaçadores","erro":"Ferro encostado no fundo, sem espaçador","evidencia":"Checklist pré-concretagem assinado e foto"},{"item":"Concreto","criterio":"Resistência (fck) especificada, slump conferido, corpos de prova moldados","erro":"Adicionar água na obra para facilitar o lançamento","evidencia":"Nota fiscal, ensaio de slump, laudo dos corpos de prova"},{"item":"Cura","criterio":"Úmida por no mínimo 7 dias (NBR 14931)","erro":"Não curar, ou curar por um dia","evidencia":"Registro da cura no diário"},{"item":"Impermeabilização dos baldrames","criterio":"Aplicada em todas as faces, sobre superfície limpa","erro":"Aplicar sobre concreto sujo ou sem cura","evidencia":"Foto das demãos"},{"item":"Tubulações enterradas","criterio":"Passagens e testes feitos antes do reaterro","erro":"Quebrar o baldrame depois para passar tubo","evidencia":"Foto e registro de teste"},{"item":"Aterramento","criterio":"Malha ou espera executada conforme projeto","erro":"Esquecer o aterramento na fundação","evidencia":"Foto antes de concretar"}]},{"n":6,"nome":"Estrutura","objetivo":"Pilares, vigas e lajes são executados pavimento a pavimento, com cada concretagem liberada por vistoria de fôrma, armação e escoramento.","liberacao":"estrutura desformada, resultados de resistência aprovados e falhas corrigidas.","itens":["Locação dos pilares e conferência de prumo e esquadro.","Fôrmas e escoramento dimensionados e conferidos antes da armação.","Armação de pilares, vigas e lajes conforme projeto estrutural, com espaçadores e cobrimento.","Passagem de tubulações e caixas embutidas na laje antes da concretagem.","Vistoria pré-concretagem assinada pelo responsável técnico.","Concretagem com controle de traço, slump e corpos de prova.","Adensamento adequado e cura úmida pelo prazo mínimo.","Retirada de fôrmas e escoras apenas após o prazo e a resistência mínima exigidos.","Conferência de prumo, nível e dimensões após a desforma, com correção de falhas.","Repetição do ciclo para cada pavimento, incluindo a escada."],"verif":[{"item":"Prumo e nível dos pilares","criterio":"Desvios dentro do limite do projeto, conferidos com prumo ou laser","erro":"Pilar fora de prumo corrigido com massa","evidencia":"Registro de medição"},{"item":"Fôrmas e escoramento","criterio":"Rígidos, travados, estanques e conforme o projeto de escoramento","erro":"Escora improvisada, fôrma com vazamento de nata","evidencia":"Foto pré-concretagem"},{"item":"Armação","criterio":"Igual ao projeto: bitola, estribos, espaçamento e cobrimento","erro":"Reduzir bitola ou omitir estribos","evidencia":"Checklist pré-concretagem assinado"},{"item":"Instalações embutidas","criterio":"Passagens e caixas posicionadas antes de concretar","erro":"Quebrar laje depois para passar tubulação","evidencia":"Foto antes da concretagem"},{"item":"Concretagem","criterio":"fck e slump conferidos, adensamento com vibrador, corpos de prova","erro":"Concreto segregado por falta de vibração","evidencia":"Nota fiscal, slump, corpos de prova"},{"item":"Cura e desforma","criterio":"Cura úmida e desforma no prazo e resistência mínimos","erro":"Desformar cedo para reaproveitar fôrma","evidencia":"Datas registradas no diário"},{"item":"Falhas do concreto","criterio":"Sem bicheiras ou ninhos, ou reparo aprovado pela engenharia","erro":"Tapar falha sem avaliação técnica","evidencia":"Foto e laudo do reparo"}]},{"n":7,"nome":"Alvenaria e vedações","objetivo":"As paredes definem os ambientes e precisam sair no prumo, no esquadro e com todas as vergas e contravergas previstas.","liberacao":"alvenaria conferida em prumo e esquadro, com todos os vãos nas medidas de projeto.","itens":["Marcação da primeira fiada conferida contra o projeto de paginação.","Bloco ou tijolo especificado, com recebimento e conferência de lote.","Elevação da alvenaria com prumo, nível e alinhamento controlados.","Vergas, contravergas e cintas nos vãos e nos pontos indicados.","Encunhamento (fixação no topo) após o prazo de acomodação.","Ferros de amarração entre alvenaria e pilares.","Conferência de vãos de portas e janelas contra o projeto de esquadrias.","Pontos de instalação marcados antes de rasgar as paredes.","Drywall ou divisórias leves, quando previstos, em etapa própria."],"verif":[{"item":"Primeira fiada","criterio":"Nivelada, esquadrejada e na cota do projeto","erro":"Fiada de marcação fora de nível","evidencia":"Foto com nível"},{"item":"Prumo, nível e alinhamento","criterio":"Dentro da tolerância do projeto","erro":"Paredes fora de prumo compensadas no reboco","evidencia":"Registro de medição"},{"item":"Vergas e contravergas","criterio":"Em todos os vãos, com transpasse conforme projeto","erro":"Vão sem verga","evidencia":"Foto antes do reboco"},{"item":"Amarração","criterio":"Ferros ou telas ligando alvenaria e estrutura","erro":"Parede sem amarração, que trinca","evidencia":"Foto"},{"item":"Juntas de assentamento","criterio":"Preenchidas e com espessura uniforme","erro":"Juntas vazias e desiguais","evidencia":"Vistoria visual"},{"item":"Encunhamento","criterio":"Após o prazo de acomodação, com preenchimento total","erro":"Encunhar cedo, gerando trinca no topo","evidencia":"Registro de datas"},{"item":"Vãos de portas e janelas","criterio":"Nas medidas do projeto de esquadrias","erro":"Vão fora de medida, que atrasa a esquadria","evidencia":"Planilha de medidas"}]},{"n":8,"nome":"Cobertura","objetivo":"O telhado deve fechar a obra contra chuva o mais cedo possível, com caimento, estanqueidade e escoamento conferidos.","liberacao":"cobertura fechada, sem infiltração no teste de estanqueidade.","itens":["Estrutura do telhado (madeira, metálica ou laje) conforme projeto, com fixações conferidas.","Tratamento da madeira, quando aplicável.","Telhas ou laje impermeabilizada, com inclinação mínima do fabricante respeitada.","Rufos, calhas, condutores e pingadeiras instalados.","Cumeeiras, encontros e rincões vedados.","Passagem de tubos de ventilação, chaminés e dutos com vedação.","Ponto de saída para pluvial ligado à drenagem.","Teste de estanqueidade (lâmina d'água em laje ou chuva simulada)."],"verif":[{"item":"Estrutura do telhado","criterio":"Seções, apoios e fixações conforme o projeto","erro":"Peças subdimensionadas ou fixação frouxa","evidencia":"Foto das fixações"},{"item":"Inclinação","criterio":"Igual ou superior à mínima do fabricante da telha","erro":"Inclinação insuficiente, com infiltração","evidencia":"Medição registrada"},{"item":"Sobreposição das telhas","criterio":"Conforme o fabricante, com fixação adequada","erro":"Falta de sobreposição ou de fixação","evidencia":"Foto"},{"item":"Rufos e calhas","criterio":"Caimento, vedação e dimensão de projeto","erro":"Calha sem caimento, rufo sem vedação","evidencia":"Teste com água"},{"item":"Encontros e cumeeira","criterio":"Vedados e fixados","erro":"Frestas em rincões e encontros com parede","evidencia":"Foto"},{"item":"Estanqueidade","criterio":"Sem infiltração após teste com água ou chuva","erro":"Não testar antes de fechar o forro","evidencia":"Registro do teste"}]},{"n":9,"nome":"Instalações embutidas","objetivo":"Todas as tubulações e eletrodutos são instalados e testados antes de fechar paredes, pisos e forros.","liberacao":"testes aprovados e registro fotográfico arquivado, para então fechar rasgos e iniciar o revestimento.","itens":["Marcação e rasgo de paredes conforme projeto, sem comprometer a alvenaria estrutural.","Hidráulica: água fria, água quente, esgoto, ventilação e pluvial instalados na inclinação correta.","Teste de pressão nas tubulações de água antes de fechar.","Teste de estanqueidade e fluxo nas tubulações de esgoto.","Elétrica: eletrodutos, caixas, quadros e aterramento conforme projeto.","Gás: tubulação, ventilação e teste de estanqueidade.","Dados, telefonia, CFTV, automação e som: eletrodutos e pontos.","Ar-condicionado: tubulação frigorígena, dreno e pontos elétricos.","Aquecimento solar ou a gás e demais sistemas prediais, quando previstos.","Fotografia de todas as tubulações antes do fechamento, com cotas de referência."],"verif":[{"item":"Água fria e quente","criterio":"Teste de pressão conforme NBR 5626, sem queda de pressão","erro":"Fechar o rasgo sem testar","evidencia":"Registro do teste e foto do manômetro"},{"item":"Esgoto","criterio":"Caimento mínimo de 2% para DN até 75 e 1% para DN 100 ou mais (NBR 8160), com ventilação","erro":"Caimento invertido ou insuficiente","evidencia":"Foto com nível e teste de fluxo"},{"item":"Elétrica","criterio":"Bitolas, circuitos e condutor de proteção (terra) conforme projeto","erro":"Fiação subdimensionada, sem terra","evidencia":"Foto e teste de continuidade"},{"item":"Quadros elétricos","criterio":"Posição e capacidade de projeto, com DR e espaço para reserva","erro":"Quadro pequeno e sem identificação","evidencia":"Foto"},{"item":"Gás","criterio":"Teste de estanqueidade por profissional habilitado","erro":"Instalação sem teste","evidencia":"Laudo do teste"},{"item":"Dados, CFTV e ar-condicionado","criterio":"Eletrodutos livres, com fio-guia, e dreno com caimento","erro":"Eletroduto obstruído ou sem guia","evidencia":"Foto"},{"item":"Registro antes do fechamento","criterio":"Fotos com cotas de referência das tubulações","erro":"Fechar sem registrar o trajeto","evidencia":"Álbum de fotos por ambiente"}]},{"n":10,"nome":"Reservatórios, fossa e águas pluviais","objetivo":"A água que entra e a que sai da casa precisam de reservação, tratamento e destino corretos, testados antes de cobrir.","liberacao":"reservatórios testados e redes de esgoto e pluvial ligadas e funcionando.","itens":["Volume dos reservatórios (inferior, superior ou cisterna) conforme o projeto.","Impermeabilização e teste de estanqueidade do reservatório antes do uso.","Tampa vedada, extravasor (ladrão) com caimento e tela de proteção.","Fossa séptica, filtro e sumidouro dimensionados em projeto quando não houver rede de esgoto.","Afastamentos mínimos de divisas e poços conforme a legislação local.","Caixas de gordura, inspeção e passagem posicionadas com acesso para manutenção.","Rede pluvial separada do esgoto e com destino conforme a legislação local.","Cisterna ou retenção de águas pluviais, quando exigida."],"verif":[{"item":"Reservatório","criterio":"Estanque no teste de enchimento por no mínimo 24 horas","erro":"Colocar em uso sem teste","evidencia":"Registro do teste"},{"item":"Extravasor e tampa","criterio":"Ladrão com caimento, tela e tampa vedada","erro":"Reservatório sem ladrão","evidencia":"Foto"},{"item":"Fossa e sumidouro","criterio":"Dimensões e afastamentos do projeto","erro":"Sumidouro menor que o projetado","evidencia":"Foto e medição"},{"item":"Caixas de inspeção e gordura","criterio":"Caimento correto e tampa acessível","erro":"Caixa enterrada e sem acesso","evidencia":"Foto"},{"item":"Rede pluvial","criterio":"Separada do esgoto, com destino autorizado","erro":"Pluvial ligada à rede de esgoto","evidencia":"Teste de fluxo"}]},{"n":11,"nome":"SPDA e aterramento","objetivo":"O sistema de proteção contra descargas atmosféricas e o aterramento são executados conforme projeto e medidos antes da entrega.","liberacao":"laudo de medição do aterramento e SPDA conforme o projeto.","itens":["Projeto de SPDA conforme NBR 5419, quando exigido ou projetado.","Malha ou anel de aterramento executado na fundação, com esperas para as descidas.","Captores, descidas e conexões na cobertura conforme o projeto.","Aterramento do quadro geral, com DR e DPS instalados.","Equipotencialização de massas metálicas." /* ---------- utilitários ---------- */
function $(s, el){ return (el||document).querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hoje(){ return iso(new Date()); }
function parse(s){ var p=String(s).slice(0,10).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function segunda(s){ var d=parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); }
function fmt(s){ if(!s) return '—'; var p=String(s).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtC(s){ if(!s) return '—'; var p=String(s).slice(0,10).split('-'); return p[2]+'/'+p[1]; }
function pct(x){ return x==null?'—':Math.round(x*100)+'%'; }
function nid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function plural(n,s,p){ return n+' '+(n===1?s:p); }

var renderTimer=null;
function scheduleRender(){ if(renderTimer) return; renderTimer=requestAnimationFrame(function(){ renderTimer=null; if(window.__render) window.__render(); }); }

function toast(msg, err){
  var box=document.getElementById('toast'); if(!box) return;
  var d=document.createElement('div'); if(err) d.className='err'; d.textContent=msg; box.appendChild(d);
  setTimeout(function(){ d.remove(); }, 4600);
}

/* ---------- Supabase (nuvem) ---------- */
var BUCKET='obras-arquivos';
function sbErr(r){ if(r&&r.error){ var e=new Error(r.error.message||'erro'); e.code=r.error.code||r.error.statusCode||'supabase'; throw e; } return r; }
var Supa={ cli:null, cfg:null, session:null,
  config:function(){
    var c=null; try{ c=JSON.parse(localStorage.getItem('cob.supa')||'null'); }catch(e){}
    if(!c && window.COB_SUPABASE) c=window.COB_SUPABASE;
    return (c && c.url && c.key)?{url:String(c.url).replace(/\/+$/,''), key:String(c.key)}:null;
  },
  saveConfig:function(c){ try{ if(c) localStorage.setItem('cob.supa', JSON.stringify(c)); else localStorage.removeItem('cob.supa'); }catch(e){} },
  start:async function(cfg){
    if(!window.supabase || !window.supabase.createClient) return 'sem_biblioteca';
    this.cfg=cfg;
    try{ this.cli=window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:true, storageKey:'cob.supa.sessao'}}); }catch(e){ return 'config_invalida'; }
    var r; try{ r=await this.cli.auth.getSession(); }catch(e){ return 'offline'; }
    this.session=r&&r.data&&r.data.session;
    if(!this.session) return 'login';
    this.perfil();
    return 'ok';
  },
  email:function(){ return this.session&&this.session.user?this.session.user.email:''; },
  uid:function(){ return this.session&&this.session.user?this.session.user.id:null; },
  perfil:function(){
    var u=this.session.user, md=u.user_metadata||{};
    this.cli.from('perfis').upsert({id:u.id, email:u.email, nome:md.nome||md.name||String(u.email||'').split('@')[0], atualizado_em:new Date().toISOString()}).then(function(){}, function(){});
  },
  adapter:function(){
    var cli=this.cli;
    return { doc:function(p){ var i=p.indexOf('/'), c=p.slice(0,i), id=p.slice(i+1); return {
      set:function(rec){ return cli.from('registros').upsert({colecao:c, id:id, dados:rec}).then(sbErr); },
      delete:function(){ return cli.from('registros').delete().match({colecao:c, id:id}).then(sbErr); }
    }; } };
  },
  userShim:function(){
    var self=this;
    return { profiles:async function(ids){
      var r=sbErr(await self.cli.from('perfis').select('id,nome,email').in('id', ids)), out={}, me=self.uid();
      (r.data||[]).forEach(function(p){ out[p.id]={name:p.nome||p.email, isMe:p.id===me}; });
      return out;
    } };
  },
  assets:function(){
    var self=this;
    return { upload:async function(blob){
      var t=(blob&&blob.type)||'', ext=t==='application/pdf'?'pdf':(t==='image/png'?'png':(t==='image/webp'?'webp':'jpg'));
      var path=(self.uid()||'anon')+'/'+hoje().slice(0,7)+'/'+nid()+Math.random().toString(36).slice(2,8)+'.'+ext;
      sbErr(await self.cli.storage.from(BUCKET).upload(path, blob, {contentType:t||'application/octet-stream', upsert:false}));
      return {id:'sb:'+path};
    } };
  },
  publicUrl:function(path){ var c=this.cfg||this.config(); return c?c.url+'/storage/v1/object/public/'+BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/'):''; },
  upsertMany:async function(rows){
    for(var i=0;i<rows.length;i+=400){ sbErr(await this.cli.from('registros').upsert(rows.slice(i,i+400))); }
  }
};
function blobUrl(id){ id=String(id||''); return id.indexOf('sb:')===0?Supa.publicUrl(id.slice(3)):'/_blob/'+id; }

/* ---------- armazenamento ---------- */
var COLS=['obras','etapas','atividades','pacotes','diarios','fichas','ocorrencias','prestadores','eventos','atas','acoes','docsLegais','docsPrest','rfis','materiais','locs','servicos','treinamentos','fornecedores','compras','movEstoque','locacoes','contratosPrest','termos','danos'];
var Store={
  mode:'boot', db:null, data:{}, uid:null, writable:true, user:null, q:new Map(), unsubs:[],
  init:async function(){
    var self=this; COLS.forEach(function(c){ self.data[c]=new Map(); });
    var db=null, user=null;
    try{ if(window.claude && window.claude.use){ db=await window.claude.use('db'); user=await window.claude.use('user'); } }catch(e){}
    this.user=user;
    if(user){
      try{ this.uid=await user.id(); }catch(e){}
      try{ var w=await user.can('data.write'); if(w===false) this.writable=false; }catch(e){}
    }
    if(db){ this.db=db; this.mode='db'; this.backend='claude'; await this.subscribeAll(); return; }
    var sc=Supa.config();
    if(sc){
      var st=await Supa.start(sc);
      if(st==='login'){ this.mode='login'; return; }
      if(st==='ok'){
        this.db=Supa.adapter(); this.mode='db'; this.backend='supabase';
        this.uid=Supa.uid(); this.user=Supa.userShim();
        await this.subscribeSupa(); return;
      }
      this.supaErro=st;
    }
    this.mode='local'; this.backend='local'; this.loadLocal();
  },
  subscribeSupa:async function(){
    var self=this;
    var ch=Supa.cli.channel('registros-app').on('postgres_changes', {event:'*', schema:'public', table:'registros'}, function(p){
      if(p.eventType==='DELETE'){ var o=p.old||{}; if(o.colecao && self.data[o.colecao]) self.data[o.colecao].delete(o.id); }
      else { var n=p.new||{}; if(n.colecao && self.data[n.colecao]) self.data[n.colecao].set(n.id, n.dados||{}); }
      scheduleRender();
    }).subscribe();
    this.unsubs.push(function(){ Supa.cli.removeChannel(ch); });
    var from=0, step=1000;
    while(true){
      var r=await Supa.cli.from('registros').select('colecao,id,dados').order('colecao').order('id').range(from, from+step-1);
      if(r.error){ toast('Não foi possível carregar os dados da nuvem ('+(r.error.code||r.error.message)+').', true); break; }
      r.data.forEach(function(x){ if(self.data[x.colecao]) self.data[x.colecao].set(x.id, x.dados||{}); });
      if(r.data.length<step) break; from+=step;
    }
  },
  subscribeAll:function(){
    var self=this;
    return new Promise(function(resolve){
      var pending=COLS.length;
      function done(){ pending--; if(pending===0) resolve(); }
      COLS.forEach(function(c){
        var first=true;
        var u=self.db.collection(c).onSnapshot(function(snap){
          var m=new Map(); snap.docs.forEach(function(d){ if(d.exists) m.set(d.id,d.data()); });
          self.data[c]=m;
          if(first){ first=false; done(); } else scheduleRender();
        }, function(err){
          if(first){ first=false; done(); }
          toast('Conexão com os dados interrompida ('+(err&&err.code||'erro')+'). Recarregue a página.', true);
        });
        self.unsubs.push(u);
      });
      setTimeout(function(){ if(pending>0){ pending=-99; resolve(); } }, 12000);
    });
  },
  loadLocal:function(){ var self=this; COLS.forEach(function(c){ try{ var raw=localStorage.getItem('cob.'+c); if(raw) self.data[c]=new Map(JSON.parse(raw)); }catch(e){} }); },
  saveLocal:function(c){ try{ localStorage.setItem('cob.'+c, JSON.stringify(Array.from(this.data[c].entries()))); }catch(e){ toast('Não foi possível salvar neste navegador.', true); } },
  enqueue:function(key, fn){
    var self=this, prev=this.q.get(key)||Promise.resolve();
    var next=prev.catch(function(){}).then(fn);
    this.q.set(key,next);
    next.then(function(){ if(self.q.get(key)===next) self.q.delete(key); }, function(){ if(self.q.get(key)===next) self.q.delete(key); });
    return next;
  },
  fail:function(e){ toast('Não foi possível salvar'+(e&&e.code?' ('+e.code+')':'')+'. Confira sua conexão e tente de novo.', true); },
  set:function(c,id,data){
    var self=this;
    if(!this.writable){ toast('Seu acesso é somente leitura.', true); return Promise.resolve(); }
    var rec=clone(data); delete rec.id;
    this.data[c].set(id,rec); scheduleRender();
    if(this.mode==='db'){ return this.enqueue(c+'/'+id, function(){ return self.db.doc(c+'/'+id).set(rec); }).catch(function(e){ self.fail(e); }); }
    this.saveLocal(c); return Promise.resolve();
  },
  patch:function(c,id,fields){ var cur=this.data[c].get(id)||{}; return this.set(c,id,Object.assign({},cur,fields)); },
  add:function(c,data){ var id=nid(); this.set(c,id,data); return id; },
  del:function(c,id){
    var self=this;
    if(!this.writable){ toast('Seu acesso é somente leitura.', true); return Promise.resolve(); }
    this.data[c].delete(id); scheduleRender();
    if(this.mode==='db'){ return this.enqueue(c+'/'+id, function(){ return self.db.doc(c+'/'+id).delete(); }).catch(function(e){ self.fail(e); }); }
    this.saveLocal(c); return Promise.resolve();
  }
};

var Names={ map:{}, pending:new Set(), t:null,
  get:function(id){
    if(!id) return 'Alguém';
    if(this.map[id]) return this.map[id];
    if(!this.pending.has(id)){ this.pending.add(id); this.soon(); }
    return 'Alguém';
  },
  soon:function(){
    var self=this; if(this.t) return;
    this.t=setTimeout(async function(){
      self.t=null; var ids=Array.from(self.pending); self.pending.clear();
      var u=Store.user; if(!u||!u.profiles||!ids.length) return;
      try{
        var ps=await u.profiles(ids), ch=false;
        ids.forEach(function(i){ var p=ps[i]; if(p){ self.map[i]=p.isMe?'você':(p.name||'Alguém'); ch=true; } });
        if(ch) scheduleRender();
      }catch(e){}
    }, 60);
  }
};

/* ---------- acesso a dados ---------- */
function L(c){ var out=[]; Store.data[c].forEach(function(d,id){ out.push(Object.assign({},d,{id:id})); }); return out; }
function G(c,id){ var d=Store.data[c].get(id); return d?Object.assign({},d,{id:id}):null; }
function byObra(c,oid){ return L(c).filter(function(x){ return x.obraId===oid; }); }
function etapaInfo(n){ return ETAPAS.filter(function(e){ return e.n===n; })[0]; }
function faseDe(n){ return FASES.filter(function(f){ return f.etapas.indexOf(n)>=0; })[0]; }
function etapaDoc(oid,n){ return G('etapas',oid+'_'+n) || {id:oid+'_'+n, obraId:oid, n:n, status:'nao_iniciada', hist:[], condicoesOk:false}; }
function fichaDoc(oid,n,i){ return G('fichas',oid+'_'+n+'_'+i); }
function prestNome(id){ var p=id?G('prestadores',id):null; return p?p.nome:''; }

/* ---------- regras de negócio ---------- */
function ocAberta(o){ return o.status!=='fechada'; }
function vencidaOc(o){ return ocAberta(o) && o.prazo && o.prazo<hoje(); }
function atrasoOc(o){ return vencidaOc(o)?diffDays(o.prazo,hoje()):0; }
function idadeOc(o){ return diffDays((o.criadoEm||hoje()).slice(0,10), hoje()); }

function fichasResumo(oid,n){
  var v=etapaInfo(n).verif, r={total:v.length, aprov:0, rep:0, reins:0, pend:0};
  v.forEach(function(_,i){
    var f=fichaDoc(oid,n,i);
    if(!f) r.pend++;
    else if(f.resultado==='aprovado'||f.resultado==='na') r.aprov++;
    else if(f.resultado==='reprovado') r.rep++;
    else r.reins++;
  });
  return r;
}
function podeIniciar(oid,n){
  var m=[];
  if(n>1){ var p=etapaDoc(oid,n-1); if(p.status!=='liberada') m.push('A etapa '+(n-1)+' ('+etapaInfo(n-1).nome+') ainda não foi liberada em vistoria.'); }
  return {ok:m.length===0, motivos:m};
}
function podeLiberar(oid,n){
  var m=[], e=etapaDoc(oid,n), info=etapaInfo(n);
  info.verif.forEach(function(v,i){
    var f=fichaDoc(oid,n,i);
    if(!f) m.push('Ficha sem inspeção: '+v.item+'.');
    else if(f.resultado==='reprovado') m.push('Ficha reprovada: '+v.item+'.');
    else if(f.resultado==='reinspecao') m.push('Ficha aguardando reinspeção: '+v.item+'.');
  });
  var crit=byObra('ocorrencias',oid).filter(function(o){ return o.etapa===n && o.gravidade==='critica' && ocAberta(o); });
  if(crit.length) m.push(plural(crit.length,'ocorrência crítica aberta','ocorrências críticas abertas')+' nesta etapa.');
  if(!e.condicoesOk) m.push('Condições de liberação da etapa ainda não confirmadas.');
  return {ok:m.length===0, motivos:m};
}
function conformidade(oid){
  var fs=byObra('fichas',oid).filter(function(f){ return f.primeira==='ok'||f.primeira==='nok'; });
  if(!fs.length) return null;
  return fs.filter(function(f){ return f.primeira==='ok'; }).length/fs.length;
}
function semanaInfo(oid,semana){
  var ps=byObra('pacotes',oid).filter(function(p){ return p.semana===semana; });
  var ok=ps.filter(function(p){ return p.concluido===true; }).length;
  var pend=ps.filter(function(p){ return p.concluido!==true && p.concluido!==false; }).length;
  return {semana:semana, ps:ps, tot:ps.length, ok:ok, pend:pend, ppc:ps.length?ok/ps.length:null};
}
function ppcHist(oid,n){
  var cur=segunda(hoje()), out=[];
  for(var i=n-1;i>=0;i--) out.push(semanaInfo(oid, addDays(cur,-7*i)));
  return out;
}
function semanasFechadas(oid){ return ppcHist(oid,8).filter(function(w){ return w.tot>0 && w.pend===0; }); }
function ppcAtual(oid){ var h=semanasFechadas(oid); return h.length?h[h.length-1]:null; }
function ppcAbaixo2(oid,meta){
  var h=semanasFechadas(oid); if(h.length<2) return false;
  return h[h.length-1].ppc*100<meta && h[h.length-2].ppc*100<meta;
}
function atAtrasada(a){ return a.fim<hoje() && (a.avanco||0)<100; }
function avancoCron(oid){
  var ats=byObra('atividades',oid); if(!ats.length) return null;
  var tot=0, acc=0;
  ats.forEach(function(a){ var d=Math.max(1,diffDays(a.inicio,a.fim)+1); tot+=d; acc+=d*(a.avanco||0)/100; });
  return acc/tot;
}
function validade(s){
  if(!s) return {k:'', t:'Sem data'};
  var d=diffDays(hoje(),s);
  if(d<0) return {k:'crit', t:'Vencido em '+fmt(s)};
  if(d<=30) return {k:'warn', t:'Vence em '+d+(d===1?' dia':' dias')};
  return {k:'ok', t:'Válido até '+fmt(s)};
}
function prestBloqueado(p){ return validade(p.seguro).k==='crit' || validade(p.treinamento).k==='crit' || L('treinamentos').some(function(t){ return t.prestadorId===p.id && t.validade && validade(t.validade).k==='crit'; }); }

function alertasObra(o){
  var A=[], oid=o.id, base='#/obra/'+oid+'/';
  var meta=o.metaPPC==null?80:o.metaPPC, dias=o.diasEscalar==null?7:o.diasEscalar;
  var ocs=byObra('ocorrencias',oid).filter(ocAberta);
  var crit=ocs.filter(function(x){ return x.gravidade==='critica'; });
  if(crit.length) A.push({k:'crit', t:plural(crit.length,'ocorrência crítica aberta','ocorrências críticas abertas')+': a etapa afetada não pode ser liberada.', to:base+'ocorrencias'});
  var venc=ocs.filter(vencidaOc);
  if(venc.length){
    var esc_=venc.filter(function(x){ return atrasoOc(x)>dias; });
    A.push({k:esc_.length?'crit':'warn', t:plural(venc.length,'apontamento vencido','apontamentos vencidos')+(esc_.length?'; '+plural(esc_.length,'está','estão')+' há mais de '+dias+' dias e deve(m) ir à diretoria.':'. Cobrar o prestador.'), to:base+'ocorrencias'});
  }
  if(ppcAbaixo2(oid,meta)) A.push({k:'warn', t:'PPC abaixo da meta de '+meta+'% em duas semanas seguidas: replanejar e avisar o cliente.', to:base+'semana'});
  var atr=byObra('atividades',oid).filter(atAtrasada);
  if(atr.length) A.push({k:'warn', t:plural(atr.length,'atividade atrasada','atividades atrasadas')+' no cronograma.', to:base+'cronograma'});
  return A.concat(alertasP2(o));
}

function fldHtml(f){

  if(f.type==='textarea') ctl='<textarea id="'+id+'" name="'+f.name+'" rows="'+(f.rows||3)+'"'+req+' placeholder="'+esc(f.ph||'')+'">'+esc(v||'')+'</textarea>';

async function shrink(file){
  try{
    var bmp=await createImageBitmap(file);
    var s=Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    var c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    var b=await new Promise(function(r){ c.toBlob(r,'image/jpeg',0.8); });
    return b||file;
  }catch(e){ return file; }
}
async function uploadFiles(files){
  var out=[]; if(!files||!files.length) return out;
  var a=await getAssets();
  if(!a){ toast('O envio de fotos não está disponível para o seu acesso.', true); return out; }
  for(var i=0;i<files.length;i++){
    try{ var b=await shrink(files[i]); var r=await a.upload(b); out.push(r.id); }
    catch(e){ toast('Falha ao enviar uma foto ('+(e&&e.code||'erro')+').', true); }
  }
  return out;
}

async function uploadAnexos(files){
  var out=[]; if(!files||!files.length) return out;

    try{ var f=files[i], pdf=f.type==='application/pdf', b=pdf?f:await shrink(f); var r=await a.upload(b); out.push({id:r.id, n:f.name, pdf:pdf}); }

}

function avLoc(s,lid){ return (s.av&&s.av[lid])||null; }

/* ---------- LINHA DE BALANÇO: cálculo ---------- */
function lobResumo(s,locs){
  var N=locs.length, done=0, prog=0, plan=0, iniReal=null;
  locs.forEach(function(l,k){
    var a=avLoc(s,l.id), p=a?(a.p||0):0;
    if(p>=100) done++;
    prog+=p/100;
    var st=lobIni(s,k), f=(diffDays(st,hoje())+1)/(s.diasPorLoc||1);
    plan+=Math.max(0,Math.min(1,f));
    if(a&&a.ini&&(!iniReal||a.ini<iniReal)) iniReal=a.ini;
  });
  var ratio=plan>0?prog/plan:null;
  return {N:N, done:done, prog:prog, plan:plan, ratio:ratio, iniReal:iniReal, ritPlan:7/(s.diasPorLoc||1)};
}
function lobConflitos(oid){
  var locs=locsDe(oid), svs=byObra('servicos',oid), out=[];
  svs.forEach(function(s){
    var ps=s.pred?svs.filter(function(x){return x.id===s.pred;})[0]:null; if(!ps) return;
    locs.forEach(function(l,k){
      var a=avLoc(ps,l.id), feita=a&&a.p>=100, st=lobIni(s,k);
      if(!feita && st<=addDays(hoje(),7)) out.push('“'+s.nome+'” começa em '+l.nome+' no dia '+fmtC(st)+', mas “'+ps.nome+'” ainda não concluiu essa localização.');
    });
  });
  return out;
}
function lobRatioMedio(oid){
  var locs=locsDe(oid), svs=byObra('servicos',oid).map(function(s){ return lobResumo(s,locs).ratio; }).filter(function(x){ return x!=null; });
  if(!svs.length) return null;
  return svs.reduce(function(a,b){return a+b;},0)/svs.length;
}

  }

    else if(d>=20) A.push({k:'warn', t:'Cadastro no CNO vence em '+overduePlural(30-d)+'.', to:base+'documentos'});
  }
  DOC_LEGAIS.forEach(function(t){
    var dc=docLegal(oid,t.k); if(!dc||!dc.validade) return;

    if(v.k==='crit'||v.k==='warn') A.push({k:v.k, t:t.n+': '+v.t.toLowerCase()+'.', to:base+'documentos'});
  });
  if(new Date().getDate()>=10){
    var mes=mesAdd(hoje().slice(0,7),-1), r=docsMesResumo(oid,mes);

  }
  lobConflitos(oid).slice(0,3).forEach(function(t){ A.push({k:'warn', t:t, to:base+'balanco'}); });
  return A.concat(alertasP3(o));
}

function lobChart(locs,svs){
  var LW=124, RH=28, TOP=32, RIGHT=16, hj=hoje(), minD=hj, maxD=hj;
  svs.forEach(function(s){ locs.forEach(function(l,k){
    var a=avLoc(s,l.id), st=lobIni(s,k), en=lobFim(s,k);
    if(st<minD) minD=st; if(en>maxD) maxD=en; if(a&&a.ini&&a.ini<minD) minD=a.ini;
  }); });
  var start=addDays(minD,-2), end=addDays(maxD,7), days=diffDays(start,end)+1, dx=Math.max(7,Math.min(16,860/days));
  var W=LW+days*dx+RIGHT, H=TOP+locs.length*RH+18;
  var X=function(d){ return LW+diffDays(start,d)*dx; }, Y=function(k){ return TOP+k*RH+RH/2; };
  var g='';
  locs.forEach(function(l,k){ g+='<line x1="'+LW+'" x2="'+(W-RIGHT)+'" y1="'+(TOP+k*RH)+'" y2="'+(TOP+k*RH)+'" class="lob-grid"/><text x="'+(LW-8)+'" y="'+(Y(k)+4)+'" text-anchor="end" class="lob-t">'+esc(short(l.nome,16))+'</text>'; });
  g+='<line x1="'+LW+'" x2="'+(W-RIGHT)+'" y1="'+(TOP+locs.length*RH)+'" y2="'+(TOP+locs.length*RH)+'" class="lob-grid"/>';
  for(var d=segunda(start); d<=end; d=addDays(d,7)){ if(d<start) continue; g+='<line x1="'+X(d)+'" x2="'+X(d)+'" y1="'+(TOP-6)+'" y2="'+(TOP+locs.length*RH)+'" class="lob-grid"/><text x="'+(X(d)+3)+'" y="'+(TOP-12)+'" class="lob-t">'+fmtC(d)+'</text>'; }
  svs.forEach(function(s,i){
    var col='var(--s'+((i%5)+1)+')', pp=[], rp=[], marks='';

    });
    g+='<polyline points="'+pp.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-dasharray="6 4" opacity=".6"/>';
    if(rp.length>1) g+='<polyline points="'+rp.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="3"/>';
    g+=marks;
  });

function limiteCompra(c){ return (c.dataUso && c.prazoEntrega!=null && c.prazoEntrega!=='') ? addDays(c.dataUso, -Number(c.prazoEntrega)) : ''; }
function menorCot(c){ var cs=c.cotacoes||[]; if(!cs.length) return null; return cs.reduce(function(m,x){ return x.preco<m.preco?x:m; }, cs[0]); }
function cotEscolhida(c){ return (c.cotacoes||[]).filter(function(x){return x.id===c.escolhida;})[0]||null; }
function valorCompra(c){ if(c.pedido) return c.pedido.total; var e=cotEscolhida(c); if(e) return e.preco; var m=menorCot(c); return m?m.preco:null; }
function nivelCompra(o,total,orcado){
  var motivos=[], mg=o.margemPreco==null?5:o.margemPreco;
  if(orcado!=null && orcado>0 && total>orcado*(1+mg/100)) motivos.push('Acima do orçado em mais de '+mg+'% ('+brl(total)+' contra '+brl(orcado)+').');
  if(o.alcada!=null && total>o.alcada) motivos.push('Acima da alçada de '+brl(o.alcada)+'.');
  return {nivel:motivos.length?3:2, motivos:motivos, semRef:(orcado==null||!(orcado>0)) && o.alcada==null};

function fichaArmaduraOk(oid,n){

function chaveItem(item,un){ return String(item||'').trim().toLowerCase()+'|'+String(un||'').trim().toLowerCase(); }
function saldos(oid){
  var m={};

function rotuloAvancar(o,c){
  var adm=modAdm(o);
  if(c.status==='necessidade') return adm?'Iniciar cotação':'Registrar entrega';
  if(c.status==='cotacao') return 'Enviar para aprovação';
  if(c.status==='aprovacao') return c.aprov?'Emitir pedido':'Aprovar';
  if(c.status==='pedido') return 'Registrar entrega';
  if(c.status==='entregue') return 'Conferir recebimento';
  if(c.status==='conferido' && adm) return 'Marcar como pago';
  return '';
}

function escolherCotacao(id,cid){
  var c=G('compras',id), men=menorCot(c), x=(c.cotacoes||[]).filter(function(y){return y.id===cid;})[0];
  var fim=function(just){ return setCompra(c,{escolhida:cid, justificativa:just||'', aprov:null}).then(function(){ openCompra(id); }); };
  if(men && x.id!==men.id){
    openForm({title:'Não é o menor preço', intro:'A proposta escolhida ('+brl(x.preco)+') é maior que a menor ('+brl(men.preco)+'). Registre por quê.',
      fields:[{name:'j',label:'Justificativa',type:'textarea',required:true,rows:3,ph:'Ex.: prazo de entrega compatível com a concretagem'}], submit:'Escolher mesmo assim',
      onSubmit:async function(v){ if(!(v.j||'').trim()) return 'Escreva a justificativa.'; await fim(v.j.trim()); return false; }});
  } else fim('');
}
async function compraAvancar(id,vol){
  var c=G('compras',id); if(!c) return; var o=G('obras',c.obraId), adm=modAdm(o);
  if(c.status==='necessidade'){
    if(adm){ await setCompra(c,{status:'cotacao'},'Cotação iniciada'); return depoisCompra(id,vol); }
    return entregaCompraForm(id,vol);
  }
  if(c.status==='cotacao'){
    if(!(c.cotacoes||[]).length){ blockDlg('Falta cotação',['Registre ao menos uma proposta recebida.'],'Não dá para enviar para aprovação'); return; }
    if(!c.escolhida){ blockDlg('Falta escolher a proposta',['Escolha uma das propostas no mapa de cotações.'],'Não dá para enviar para aprovação'); return; }
    await setCompra(c,{status:'aprovacao'},'Enviada para aprovação'); return depoisCompra(id,vol);
  }
  if(c.status==='aprovacao'){
    if(!c.aprov) return aprovarCompra(id,vol);
    var tr=travasPedido(o,c); if(tr.length){ blockDlg('Não é possível emitir o pedido',tr,'Antes de emitir o pedido:'); return; }
    return pedidoForm(id,vol);
  }
  if(c.status==='pedido') return entregaCompraForm(id,vol);
  if(c.status==='entregue') return conferenciaForm(id,vol);
  if(c.status==='conferido' && adm) return pagoForm(id,vol);
}

function eventosP3(o,add,b){
  byObra('compras',o.id).forEach(function(c){
    var lim=limiteCompra(c);
    if(lim && ['necessidade','cotacao','aprovacao'].indexOf(c.status)>=0) add(lim,'Pedir até hoje: '+c.item,'suprimentos',b+'compras');
    if(c.status==='pedido' && c.pedido && c.pedido.entregaPrevista) add(c.pedido.entregaPrevista,'Entrega prevista: '+c.item,'suprimentos',b+'compras');
  });
  byObra('locacoes',o.id).forEach(function(l){
    if(l.status==='prevista') add(l.inicio,'Chega o equipamento: '+l.equipamento,'suprimentos',b+'locacoes');
    if(l.status!=='devolvida') add(l.fimPrevisto,'Devolver: '+l.equipamento,'suprimentos',b+'locacoes');
  });
  byObra('contratosPrest',o.id).filter(function(c){return c.status!=='encerrado';}).forEach(function(c){ add(c.fim,'Fim do contrato: '+(prestNome(c.prestadorId)||'prestador'),'prestadores',b+'contratos'); });
  byObra('danos',o.id).filter(function(d){return d.status==='aberta';}).forEach(function(d){ add(d.prazo,'Reparo de dano: '+short(d.descricao,40),'prestadores',b+'contratos'); });

function alertasP3(o){
  var A=[], oid=o.id, base='#/obra/'+oid+'/', hj=hoje();

    var venc=crit.filter(function(c){return limiteCompra(c)<hj;});
    A.push({k:venc.length?'crit':'warn', t:plural(crit.length,'item crítico chegando','itens críticos chegando')+' à data-limite de pedido sem pedido feito'+(venc.length?' ('+venc.length+' já passou)':'')+': '+crit.slice(0,2).map(function(c){return c.item;}).join(', ')+(crit.length>2?'…':'')+'.', to:base+'compras'});
  }

  var cli=byObra('compras',oid).filter(function(c){ var nv=c.status==='aprovacao'&&!c.aprov?nivelDaCompra(o,c):null; return nv&&nv.nivel===3; });
  if(cli.length) A.push({k:'warn', t:plural(cli.length,'compra aguardando aprovação do cliente','compras aguardando aprovação do cliente')+' (fora do orçado ou acima da alçada).', to:base+'compras'});

  var la=byObra('locacoes',oid).filter(locAtrasada);

  var dn=byObra('danos',oid).filter(function(d){return d.status==='aberta';});
  if(dn.length) A.push({k:'warn', t:plural(dn.length,'dano em aberto','danos em aberto')+', somando '+brl(dn.reduce(function(s,d){return s+(Number(d.custo)||0);},0))+'.', to:base+'contratos'});
  return A;

function indRowsP3(o){
  var oid=o.id, out='', cs=byObra('compras',oid), ls=byObra('locacoes',oid), ts=byObra('termos',oid), ds=byObra('danos',oid);

  if(ent.length){ var no=ent.filter(function(c){return c.entrega.data<=c.pedido.entregaPrevista;}).length; out+=indRow('Compras no prazo','Pedidos entregues na data ÷ pedidos entregues', pct(no/ent.length), no+' de '+ent.length+' pedidos', no/ent.length>=0.9?'ok':'warn'); }

  if(dv.length){ var sp=dv.reduce(function(s,c){return s+c.pedido.total;},0), so=dv.reduce(function(s,c){return s+c.orcado;},0), r=sp/so; out+=indRow('Desvio de compra','Preço pago ÷ preço orçado', Math.round(r*100)+'%', brl(sp)+' pedidos contra '+brl(so)+' orçados', r<=1?'ok':(r<=1+(o.margemPreco==null?5:o.margemPreco)/100?'warn':'crit')); }
  var ap=ls.reduce(function(a,l){ var x=locApont(l); return {n:a.n+x.n, p:a.p+x.parado}; },{n:0,p:0});
  if(ap.n) out+=indRow('Ociosidade de equipamento','Dias parado ÷ dias apontados', pct(ap.p/ap.n), ap.p+' de '+ap.n+' dias apontados', ap.p/ap.n>0.3?'warn':'ok');
  var dev=ls.filter(function(l){return l.status==='devolvida'&&l.devolucao;});
  if(dev.length){ var real=dev.reduce(function(s,l){return s+(Number(l.valorDia)||0)*Math.max(1,diffDays(l.inicio,l.devolucao.data)+1);},0), prev=dev.reduce(function(s,l){return s+locTotalPrev(l);},0); if(prev>0) out+=indRow('Custo de locação','Locação real ÷ locação prevista', Math.round(real/prev*100)+'%', brl(real)+' contra '+brl(prev)+' previstos', real<=prev?'ok':'warn'); }
  if(ts.length){ var lp=ts.filter(function(t){return t.estado==='limpa';}).length; out+=indRow('Frentes entregues limpas e sem dano','Termos sem pendência ÷ termos de frente', pct(lp/ts.length), lp+' de '+ts.length+' termos', lp/ts.length>=0.9?'ok':'warn'); }
  if(ds.length){ var tot=ds.reduce(function(s,d){return s+(Number(d.custo)||0);},0), ab=ds.filter(function(d){return d.status==='aberta';}).length; out+=indRow('Danos e quebras','Número e valor', String(ds.length), brl(tot)+' no total · '+ab+' em aberto', ab?'warn':'ok'); }
  return out;
}

function parseRoute(){

    return {view:'obra', oid:p[1], tab:p[2]||'resumo'};

  if(p[0]==='agenda') return {view:'agenda'};

      +'<div class="row" style="margin-top:10px;gap:8px"><span class="chip '+(ppc?(ppc.ppc*100>=(o.metaPPC==null?80:o.metaPPC)?'ok':'warn'):'')+'">PPC '+(ppc?pct(ppc.ppc):'—')+'</span><span class="chip '+(cr?'crit':(ab.length?'warn':'ok'))+'">'+plural(ab.length,'ocorrência aberta','ocorrências abertas')+(cr?' ('+cr+' crítica'+(cr>1?'s':'')+')':'')+'</span></div></a>';
  }).join('');
  var vazio='<div class="card empty" style="margin-top:18px"><h3>Nenhuma obra cadastrada</h3><p>Cadastre a primeira obra para receber as 22 etapas do protocolo, o cronograma e os controles de qualidade.</p><p style="margin-top:14px"><button class="btn primary" data-act="obra-nova" data-write>Cadastrar obra</button></p></div>';

/* ---- obra ---- */

  var fn={resumo:tResumo, etapas:tEtapas, cronograma:tCron, balanco:tBalanco, semana:tSemana, diario:tDiario, ocorrencias:tOcorr, agenda:tAgenda, reunioes:tReunioes, projeto:tProjeto, documentos:tDocumentos, entrega:tEntrega, compras:tCompras, estoque:tEstoque, locacoes:tLocacoes, contratos:tContratos}[r.tab]||tResumo;
  var meta=[o.cliente, o.endereco, o.tipologia, o.area?o.area+' m²':'', o.inicio?'início em '+fmt(o.inicio):''].filter(Boolean).map(esc).join(' · ');

    +'<div class="row"><button class="btn" data-act="obra-editar" data-oid="'+o.id+'" data-write>Editar obra</button></div></div>'
    +'<div style="margin-top:20px">'+regua(o.id,false)+legenda()+'</div>'
    +'<nav class="tabs" aria-label="Seções da obra">'+tabs.map(function(t){ return '<a href="#/obra/'+o.id+'/'+t[0]+'"'+(r.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</a>'; }).join('')+'</nav>'
    +'<div style="margin-top:20px">'+fn(o)+'</div></div>';
