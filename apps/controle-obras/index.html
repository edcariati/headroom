    var r=lobRatioMedio(oid);
    out+=indRow('Ritmo da equipe','Realizado ÷ previsto em cada serviço (média)', r==null?'—':Math.round(r*100)+'%', r==null?'Nenhum serviço começou ainda':plural(svs.length,'serviço','serviços')+' na linha de balanço', r==null?'':(r>=0.95?'ok':(r>=0.75?'warn':'crit')));
  }
  var mes=mesAdd(hoje().slice(0,7),-1), rs=docsMesResumo(oid,mes);
  if(rs.tot) out+=indRow('Documentos do prestador em dia','Prestadores com INSS, FGTS, folha e certidões conferidos', rs.ok+' <span class="small muted">de '+rs.tot+'</span>', 'Competência de '+mesNome(mes), rs.pend?'warn':'ok');

}

var COMPRA_ST={necessidade:'Necessidade', cotacao:'Cotação', aprovacao:'Aprovação', pedido:'Pedido', entregue:'Entregue', conferido:'Conferido', pago:'Pago'};
var FLUXO_ADM=['necessidade','cotacao','aprovacao','pedido','entregue','conferido','pago'];
var FLUXO_GEST=['necessidade','entregue','conferido'];
var LOC_ST={prevista:'Prevista', ativa:'Ativa', devolvida:'Devolvida'};
var CK_ENTRADA=['Funcionamento testado na entrega','Sem avarias visíveis','Documentos e manual entregues'];
var CK_SAIDA=['Equipamento limpo','Sem avarias novas','Acessórios e combustível devolvidos'];
var UNIDADES=['un','m','m²','m³','kg','saco','barra','lata','cx','vb'];

function brl(x){ return (x==null||x==='')?'—':Number(x).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function modAdm(o){ return o.modalidade==='Administração de Obra'; }
function fluxoDe(o){ return modAdm(o)?FLUXO_ADM:FLUXO_GEST; }
function fornNome(id){ var f=id?G('fornecedores',id):null; return f?f.nome:''; }
function fornOptions(blank){ return selOpts(L('fornecedores').sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'');}).map(function(f){return [f.id,f.nome];}), blank); }
function limiteCompra(c){ return (c.dataUso && c.prazoEntrega!=null && c.prazoEntrega!=='') ? addDays(c.dataUso, -Number(c.prazoEntrega)) : ''; }
function menorCot(c){ var cs=c.cotacoes||[]; if(!cs.length) return null; return cs.reduce(function(m,x){ return x.preco<m.preco?x:m; }, cs[0]); }
function cotEscolhida(c){ return (c.cotacoes||[]).filter(function(x){return x.id===c.escolhida;})[0]||null; }
function valorCompra(c){ if(c.pedido) return c.pedido.total; var e=cotEscolhida(c); if(e) return e.preco; var m=menorCot(c); return m?m.preco:null; }
function nivelCompra(o,total,orcado){
  var motivos=[], mg=o.margemPreco==null?5:o.margemPreco;
  if(orcado!=null && orcado>0 && total>orcado*(1+mg/100)) motivos.push('Acima do orçado em mais de '+mg+'% ('+brl(total)+' contra '+brl(orcado)+').');
  if(o.alcada!=null && total>o.alcada) motivos.push('Acima da alçada de '+brl(o.alcada)+'.');
  return {nivel:motivos.length?3:2, motivos:motivos, semRef:(orcado==null||!(orcado>0)) && o.alcada==null};
}
function compraAtrasadaPedido(c){ var lim=limiteCompra(c); return !!lim && lim<hoje() && ['necessidade','cotacao','aprovacao'].indexOf(c.status)>=0; }
function pedidoAtrasado(c){ return c.status==='pedido' && !!c.pedido && !!c.pedido.entregaPrevista && c.pedido.entregaPrevista<hoje(); }
function nivelDaCompra(o,c){ var e=cotEscolhida(c); return e?nivelCompra(o,e.preco,c.orcado):null; }
function fichaArmaduraOk(oid,n){
  var info=etapaInfo(n); if(!info) return null;
  var idx=-1; info.verif.forEach(function(v,i){ if(idx<0 && /^armadura/i.test(v.item)) idx=i; });
  if(idx<0) return null;
  var f=fichaDoc(oid,n,idx);
  return {ok:!!f && (f.resultado==='aprovado'||f.resultado==='na'), nome:info.verif[idx].item};
}
function travasPedido(o,c){
  var m=[];
  if(!c.aprov) m.push('A compra ainda não tem aprovação registrada.');
  if(c.sobMedida && !c.medidaOk) m.push('Item sob medida: confirme que a medida do vão acabado foi conferida em obra antes de pedir.');
  if(c.concretagem){
    var n=c.etapa||5, fa=fichaArmaduraOk(o.id,n);
    if(fa && !fa.ok) m.push('Concretagem: a ficha “'+fa.nome+'” da etapa '+n+' precisa estar aprovada (vistoria pré-concretagem) antes de agendar o concreto.');
  }
  return m;
}
function setCompra(c,patch,nota){
  var hist=(c.hist||[]);
  if(patch.status && patch.status!==c.status) hist=hist.concat([{de:c.status, para:patch.status, data:new Date().toISOString(), por:Store.uid||null, nota:nota||''}]).slice(-30);
  return Store.set('compras', c.id, Object.assign({}, c, patch, {hist:hist}));
}
function depoisCompra(id,vol){ if(vol){ openCompra(id); return false; } }

/* ---------- estoque ---------- */
function chaveItem(item,un){ return String(item||'').trim().toLowerCase()+'|'+String(un||'').trim().toLowerCase(); }
function saldos(oid){
  var m={};
  byObra('movEstoque',oid).forEach(function(x){
    var k=chaveItem(x.item,x.un); m[k]=m[k]||{item:x.item, un:x.un, saldo:0, entradas:0, saidas:0, perdas:0};
    var q=Number(x.qtd)||0;
    if(x.tipo==='entrada'){ m[k].saldo+=q; m[k].entradas+=q; }
    else { m[k].saldo-=q; if(x.tipo==='perda') m[k].perdas+=q; else m[k].saidas+=q; }
  });
  return Object.keys(m).map(function(k){ return Object.assign({k:k}, m[k]); }).sort(function(a,b){ return a.item.localeCompare(b.item); });
}

/* ---------- locação ---------- */
function locDiasPrev(l){ return Math.max(1, diffDays(l.inicio,l.fimPrevisto)+1); }
function locTotalPrev(l){ return (Number(l.valorDia)||0)*locDiasPrev(l); }
function locApont(l){ var a=l.apontamentos||{}, ds=Object.keys(a); return {n:ds.length, parado:ds.filter(function(d){return a[d].u==='parado';}).length}; }
function locParadoSeguidos(l){
  var a=l.apontamentos||{}, n=0, d=hoje();
  if(!a[d]) d=addDays(d,-1);
  while(a[d] && a[d].u==='parado'){ n++; d=addDays(d,-1); }
  return n;
}
function locAtrasada(l){ return l.status==='ativa' && l.fimPrevisto && l.fimPrevisto<hoje(); }

/* ================= COMPRAS ================= */
function rotuloAvancar(o,c){
  var adm=modAdm(o);
  if(c.status==='necessidade') return adm?'Iniciar cotação':'Registrar entrega';
  if(c.status==='cotacao') return 'Enviar para aprovação';
  if(c.status==='aprovacao') return c.aprov?'Emitir pedido':'Aprovar';
  if(c.status==='pedido') return 'Registrar entrega';
  if(c.status==='entregue') return 'Conferir recebimento';
  if(c.status==='conferido' && adm) return 'Marcar como pago';
  return '';
}
function kcardCompra(o,c){
  var val=valorCompra(c), lim=limiteCompra(c), atrLim=compraAtrasadaPedido(c), atrEnt=pedidoAtrasado(c), rot=rotuloAvancar(o,c);
  var nv=(c.status==='aprovacao'&&!c.aprov)?nivelDaCompra(o,c):null;
  return '<div class="kcard'+(atrLim||atrEnt?' crit':(c.critico?' importante':''))+'"><button type="button" class="linkbtn" data-act="compra-abrir" data-id="'+c.id+'">'+esc(c.item)+'</button><div class="m">'
    +(c.qtd?'<span class="chip">'+esc(String(c.qtd).replace('.',','))+' '+esc(c.un||'')+'</span>':'')
    +(val!=null?'<span class="chip steel">'+brl(val)+'</span>':'')
    +(c.etapa?'<span class="chip">Etapa '+c.etapa+'</span>':'')
    +(c.critico?'<span class="chip warn">Crítico</span>':'')
    +(lim&&['necessidade','cotacao','aprovacao'].indexOf(c.status)>=0?'<span class="chip '+(atrLim?'crit':'')+'">Pedir até '+fmtC(lim)+'</span>':'')
    +(c.status==='pedido'&&c.pedido&&c.pedido.entregaPrevista?'<span class="chip '+(atrEnt?'crit':'')+'">Entrega '+fmtC(c.pedido.entregaPrevista)+'</span>':'')
    +(nv&&nv.nivel===3?'<span class="chip warn">Precisa do cliente</span>':'')
    +(c.status==='aprovacao'&&c.aprov?'<span class="chip ok">Aprovado (nível '+c.aprov.nivel+')</span>':'')
    +'</div>'+(rot?'<div class="mv"><button class="btn sm primary" data-act="compra-avancar" data-id="'+c.id+'" data-write>'+rot+' →</button></div>':'')+'</div>';

function cotacaoForm(id){

  openForm({title:'Proposta recebida', intro:esc(c.item)+' — '+esc(String(c.qtd))+' '+esc(c.un||''),
    fields:[{name:'fornecedorId',label:'Fornecedor',type:'select',required:true,options:fornOptions('Selecione…')},
      [{name:'preco',label:'Preço total (R$)',type:'number',min:0,step:'0.01',required:true},{name:'prazo',label:'Prazo de entrega (dias)',type:'number',min:0,step:1}],
      [{name:'frete',label:'Frete (R$, se cobrado à parte)',type:'number',min:0,step:'0.01'},{name:'cond',label:'Condição de pagamento',ph:'Ex.: 28 dias'}],

function escolherCotacao(id,cid){
  var c=G('compras',id), men=menorCot(c), x=(c.cotacoes||[]).filter(function(y){return y.id===cid;})[0];
  var fim=function(just){ return setCompra(c,{escolhida:cid, justificativa:just||'', aprov:null}).then(function(){ openCompra(id); }); };
  if(men && x.id!==men.id){
    openForm({title:'Não é o menor preço', intro:'A proposta escolhida ('+brl(x.preco)+') é maior que a menor ('+brl(men.preco)+'). Registre por quê.',
      fields:[{name:'j',label:'Justificativa',type:'textarea',required:true,rows:3,ph:'Ex.: prazo de entrega compatível com a concretagem'}], submit:'Escolher mesmo assim',
      onSubmit:async function(v){ if(!(v.j||'').trim()) return 'Escreva a justificativa.'; await fim(v.j.trim()); return false; }});
  } else fim('');
}
async function compraAvancar(id,vol){
  var c=G('compras',id); if(!c) return; var o=G('obras',c.obraId), adm=modAdm(o);
  if(c.status==='necessidade'){
    if(adm){ await setCompra(c,{status:'cotacao'},'Cotação iniciada'); return depoisCompra(id,vol); }
    return entregaCompraForm(id,vol);
  }
  if(c.status==='cotacao'){
    if(!(c.cotacoes||[]).length){ blockDlg('Falta cotação',['Registre ao menos uma proposta recebida.'],'Não dá para enviar para aprovação'); return; }
    if(!c.escolhida){ blockDlg('Falta escolher a proposta',['Escolha uma das propostas no mapa de cotações.'],'Não dá para enviar para aprovação'); return; }
    await setCompra(c,{status:'aprovacao'},'Enviada para aprovação'); return depoisCompra(id,vol);
  }
  if(c.status==='aprovacao'){
    if(!c.aprov) return aprovarCompra(id,vol);
    var tr=travasPedido(o,c); if(tr.length){ blockDlg('Não é possível emitir o pedido',tr,'Antes de emitir o pedido:'); return; }
    return pedidoForm(id,vol);
  }
  if(c.status==='pedido') return entregaCompraForm(id,vol);
  if(c.status==='entregue') return conferenciaForm(id,vol);
  if(c.status==='conferido' && adm) return pagoForm(id,vol);
}

    submit:'Registrar aprovação',

    }});

function movForm(oid,tipo){
  var ss=saldos(oid).filter(function(s){ return s.saldo>0; }), titulo={entrada:'Entrada manual', saida:'Saída para a obra', perda:'Perda ou quebra'}[tipo];
  var campos=[];

  else {
    if(!ss.length){ blockDlg('Sem saldo em estoque',['Confira o recebimento de uma compra ou lance uma entrada manual.'],'Não há o que retirar'); return; }
    campos=[{name:'chave',label:'Item',type:'select',required:true,options:ss.map(function(s){ return [s.k, s.item+' — saldo '+String(Math.round(s.saldo*100)/100).replace('.',',')+' '+s.un]; })},{name:'qtd',label:'Quantidade',type:'number',min:0,step:'any',required:true}];
  }
  campos.push([{name:'data',label:'Data',type:'date',required:true,value:hoje()},{name:'etapa',label:'Frente (etapa)',type:'select',options:etapaOptions('—')}]);

  openForm({title:titulo, fields:campos,

      else { var s=ss.filter(function(x){return x.k===v.chave;})[0]; if(!s) return 'Escolha o item.'; if(v.qtd>s.saldo) return 'A quantidade é maior que o saldo ('+String(Math.round(s.saldo*100)/100).replace('.',',')+' '+s.un+').'; item=s.item; un=s.un; }
      await Store.add('movEstoque',{obraId:oid, item:item, un:un, tipo:tipo, qtd:v.qtd, data:v.data, etapa:v.etapa?Number(v.etapa):0, obs:(v.obs||'').trim()});

function cardLoc(o,l){
  var ap=locApont(l), oc=ap.n?ap.parado/ap.n:null, tot=locTotalPrev(l), ps=locParadoSeguidos(l), atr=locAtrasada(l);

  var real=l.status==='devolvida'&&l.devolucao?(Number(l.valorDia)||0)*Math.max(1,diffDays(l.inicio,l.devolucao.data)+1):null;
  return '<article class="card pad"><div class="row spread" style="align-items:flex-start"><div class="grow"><h3>'+esc(l.equipamento)+'</h3><p class="small muted">'+esc(fornNome(l.fornecedorId)||'Fornecedor a definir')+(l.etapa?' · Etapa '+l.etapa:'')+'</p></div><span class="chip '+(l.status==='ativa'?'steel':(l.status==='devolvida'?'ok':''))+'">'+LOC_ST[l.status]+'</span></div>'
    +'<p class="small" style="margin-top:8px">'+fmt(l.inicio)+' a '+fmt(l.fimPrevisto)+' ('+plural(locDiasPrev(l),'dia','dias')+') · '+brl(l.valorDia)+'/dia · previsto '+brl(tot)+(real!=null?' · real '+brl(real):'')+'</p>'

function eventosP3(o,add,b){
  byObra('compras',o.id).forEach(function(c){
    var lim=limiteCompra(c);
    if(lim && ['necessidade','cotacao','aprovacao'].indexOf(c.status)>=0) add(lim,'Pedir até hoje: '+c.item,'suprimentos',b+'compras');
    if(c.status==='pedido' && c.pedido && c.pedido.entregaPrevista) add(c.pedido.entregaPrevista,'Entrega prevista: '+c.item,'suprimentos',b+'compras');
  });
  byObra('locacoes',o.id).forEach(function(l){
    if(l.status==='prevista') add(l.inicio,'Chega o equipamento: '+l.equipamento,'suprimentos',b+'locacoes');
    if(l.status!=='devolvida') add(l.fimPrevisto,'Devolver: '+l.equipamento,'suprimentos',b+'locacoes');
  });
  byObra('contratosPrest',o.id).filter(function(c){return c.status!=='encerrado';}).forEach(function(c){ add(c.fim,'Fim do contrato: '+(prestNome(c.prestadorId)||'prestador'),'prestadores',b+'contratos'); });
  byObra('danos',o.id).filter(function(d){return d.status==='aberta';}).forEach(function(d){ add(d.prazo,'Reparo de dano: '+short(d.descricao,40),'prestadores',b+'contratos'); });
  eventosP4(o,add,b);
  eventosP5(o,add,b);
}
function alertasP3(o){

  if(crit.length){
    var venc=crit.filter(function(c){return limiteCompra(c)<hj;});
    A.push({k:venc.length?'crit':'warn', t:plural(crit.length,'item crítico chegando','itens críticos chegando')+' à data-limite de pedido sem pedido feito'+(venc.length?' ('+venc.length+' já passou)':'')+': '+crit.slice(0,2).map(function(c){return c.item;}).join(', ')+(crit.length>2?'…':'')+'.', to:base+'compras'});
  }
  var atr=byObra('compras',oid).filter(pedidoAtrasado);
  if(atr.length) A.push({k:'warn', t:plural(atr.length,'pedido com entrega atrasada','pedidos com entrega atrasada')+'. Cobrar o fornecedor.', to:base+'compras'});
  var cli=byObra('compras',oid).filter(function(c){ var nv=c.status==='aprovacao'&&!c.aprov?nivelDaCompra(o,c):null; return nv&&nv.nivel===3; });
  if(cli.length) A.push({k:'warn', t:plural(cli.length,'compra aguardando aprovação do cliente','compras aguardando aprovação do cliente')+' (fora do orçado ou acima da alçada).', to:base+'compras'});
  var lp=byObra('locacoes',oid).filter(function(l){ return l.status==='ativa' && locParadoSeguidos(l)>=2; });
  if(lp.length) A.push({k:'warn', t:'Equipamento parado há mais de um dia: '+lp.map(function(l){return l.equipamento;}).join(', ')+'. Levar para a pauta da reunião semanal.', to:base+'locacoes'});
  var la=byObra('locacoes',oid).filter(locAtrasada);
  if(la.length) A.push({k:'warn', t:plural(la.length,'locação com devolução atrasada','locações com devolução atrasada')+': cada dia extra é cobrado.', to:base+'locacoes'});
  var dn=byObra('danos',oid).filter(function(d){return d.status==='aberta';});
  if(dn.length) A.push({k:'warn', t:plural(dn.length,'dano em aberto','danos em aberto')+', somando '+brl(dn.reduce(function(s,d){return s+(Number(d.custo)||0);},0))+'.', to:base+'contratos'});
  return A.concat(alertasP4(o)).concat(alertasP5(o));
}
function indRowsP3(o){

  var ent=cs.filter(function(c){ return c.entrega && c.pedido && c.pedido.entregaPrevista; });
  if(ent.length){ var no=ent.filter(function(c){return c.entrega.data<=c.pedido.entregaPrevista;}).length; out+=indRow('Compras no prazo','Pedidos entregues na data ÷ pedidos entregues', pct(no/ent.length), no+' de '+ent.length+' pedidos', no/ent.length>=0.9?'ok':'warn'); }
  var dv=cs.filter(function(c){ return c.pedido && c.orcado>0; });

function r2(x){ x=Number(x)||0; return Math.round((x+(x<0?-1:1)*1e-9)*100)/100; }
function semAcento(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,''); }
function chave(s){ return semAcento(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
function numBR(s){
  var v=String(s==null?'':s).trim().replace(/R\$/i,'').replace(/\s/g,'');
  if(v==='') return NaN;
  if(v.indexOf(',')>=0 && v.indexOf('.')>=0){ v=v.lastIndexOf(',')>v.lastIndexOf('.')?v.replace(/\./g,'').replace(',','.'):v.replace(/,/g,''); }
  else if(v.indexOf(',')>=0){ v=v.replace(',','.'); }
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(v)){ v=v.replace(/\./g,''); }
  return /^-?\d*\.?\d+$/.test(v)?Number(v):NaN;
}
function csvParse(texto){
  var t=String(texto||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  var cab=t.split('\n')[0]||'', sep=cab.indexOf(';')>=0?';':(cab.indexOf('\t')>=0?'\t':',');
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==''; }); });
}
function csvLinha(vals, sep){
  return vals.map(function(v){ v=v==null?'':String(v); return (v.indexOf(sep)>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0)?'"'+v.replace(/"/g,'""')+'"':v; }).join(sep);
}

function orcParse(texto){
  var rows=csvParse(texto), rel={erros:[], avisos:[], itens:[], total:0, porEtapa:{}, porTipo:{}, nLinhas:0};
  if(rows.length<2){ rel.erros.push({linha:0, motivo:'O arquivo precisa ter o cabeçalho e ao menos uma linha de item.'}); rel.ok=false; return rel; }
  var hdr=rows[0].map(chave), idx={}, faltam=[];
  Object.keys(ORC_COLS).forEach(function(k){ var i=-1; ORC_COLS[k].forEach(function(a){ if(i<0) i=hdr.indexOf(a); }); idx[k]=i; });
  ORC_OBRIG.forEach(function(k){ if(idx[k]<0) faltam.push(k); });
  if(faltam.length){ rel.erros.push({linha:1, motivo:'Faltam colunas obrigatórias no cabeçalho: '+faltam.join(', ')+'.'}); rel.ok=false; return rel; }
  var prest={}; L('prestadores').forEach(function(p){ prest[chave(p.nome)]=p; });
  var vistos={}, naoAchados={};
  rel.nLinhas=rows.length-1;
  for(var i=1;i<rows.length;i++){
    var r=rows[i], linha=i+1, erros=[];
    var c=function(k){ return idx[k]>=0?String(r[idx[k]]==null?'':r[idx[k]]).trim():''; };
    var cod=c('codigo'), et=c('etapa'), desc=c('descricao'), un=c('unidade'), qtdS=c('quantidade'), puS=c('preco_unitario'), tipoS=c('tipo'), totS=c('total');
    if(!qtdS && !un && !puS && totS){ rel.erros.push({linha:linha, motivo:'Linha resumida (só com total). O orçamento precisa de quantidade, unidade e preço unitário.'}); continue; }
    if(!cod) erros.push('falta o código');
    else if(vistos[cod.toLowerCase()]) erros.push('código “'+cod+'” repetido (também na linha '+vistos[cod.toLowerCase()]+')');
    else vistos[cod.toLowerCase()]=linha;
    var n=numBR(et);
    if(!(n>=1 && n<=22 && n===Math.floor(n))) erros.push('etapa “'+et+'” fora de 1 a 22');
    if(!desc) erros.push('falta a descrição');
    if(!un) erros.push('falta a unidade');
    var q=numBR(qtdS), pu=numBR(puS);
    if(!(q>0)) erros.push('quantidade deve ser maior que zero');
    if(!(pu>=0)) erros.push('preço unitário inválido');
    var tp=tipoItemNorm(tipoS);
    if(!tp) erros.push('tipo “'+tipoS+'” inválido (use material, mao_de_obra, equipamento ou empreitada)');
    var tot=r2(q*pu);
    if(totS!==''){ var t2=numBR(totS); if(isNaN(t2)) erros.push('total inválido'); else if(q>0&&pu>=0&&Math.abs(t2-tot)>0.01) erros.push('total '+brl(t2)+' não bate com quantidade × preço unitário ('+brl(tot)+')'); }
    var pn=c('prestador'), pid='';
    if(pn){ var p=prest[chave(pn)]; if(p) pid=p.id; else naoAchados[pn]=(naoAchados[pn]||[]).concat([linha]); }
    if(erros.length){ rel.erros.push({linha:linha, motivo:erros.join('; ')+'.'}); continue; }
    rel.itens.push({codigo:cod, etapa:n, descricao:desc, unidade:un, quantidade:q, precoUnitario:pu, tipo:tp, prestador:pn, prestadorId:pid, total:tot});
    rel.total=r2(rel.total+tot);
    rel.porEtapa[n]=r2((rel.porEtapa[n]||0)+tot); rel.porTipo[tp]=r2((rel.porTipo[tp]||0)+tot);

  rel.ok=rel.erros.length===0 && rel.itens.length>0;
  return rel;
}

}

/* ================= MEDIÇÃO ================= */
var MED_ST={rascunho:'Rascunho', em_analise:'Em análise', aprovada:'Aprovada', paga:'Paga'};
var MED_CONTA=['em_analise','aprovada','paga'];   // situações que já contam como medido
function medDaObra(oid){ return byObra('medicoes',oid).sort(function(a,b){ return (a.periodoFim<b.periodoFim?1:(a.periodoFim>b.periodoFim?-1:b.numero-a.numero)); }); }
function medDoContrato(cid){ return L('medicoes').filter(function(m){ return m.contratoId===cid; }); }
function medBruto(m){ return r2((m.itens||[]).reduce(function(s,i){ return s+r2((Number(i.qtdMedida)||0)*i.precoUnitario); },0)); }
function medItensDoPrestador(oid,pid){
  return orcRevisado(oid).itens.filter(function(i){ return i.prestadorId===pid && i.total>0 && i.sinal!==-1; });
}
function medQtdOutras(oid, mid, cod){
  var s=0;
  byObra('medicoes',oid).forEach(function(m){
    if(m.id===mid || MED_CONTA.indexOf(m.status)<0) return;
    (m.itens||[]).forEach(function(i){ if(i.codigo===cod) s+=Number(i.qtdMedida)||0; });
  });
  return Math.round(s*1e6)/1e6;
}
function avancoPrestador(oid,pid){
  var ats=byObra('atividades',oid).filter(function(a){ return a.prestadorId===pid; });
  if(!ats.length) return null;
  var tot=0, acc=0;
  ats.forEach(function(a){ var d=Math.max(1,diffDays(a.inicio,a.fim)+1); tot+=d; acc+=d*(a.avanco||0)/100; });
  return acc/tot;
}
function retidoApontamento(m){
  var crit=byObra('ocorrencias',m.obraId).filter(function(x){ return ocAberta(x) && x.gravidade==='critica' && x.prestadorId===m.prestadorId && x.etapa; });
  var et={}; crit.forEach(function(x){ et[x.etapa]=1; });
  var itens=(m.itens||[]).filter(function(i){ return et[i.etapa] && (Number(i.qtdMedida)||0)>0; });
  return {itens:itens, etapas:Object.keys(et).map(Number).sort(function(a,b){return a-b;}), total:r2(itens.reduce(function(s,i){ return s+r2(i.qtdMedida*i.precoUnitario); },0))};
}
function medCalc(m,o){
  var adm=modAdm(o), bruto=medBruto(m), pct=Number(m.retencaoPct)||0, rap=retidoApontamento(m).total, ret=r2((bruto-rap)*pct/100);
  var desc=r2((m.descontos||[]).reduce(function(s,d){ return s+(Number(d.valor)||0); },0));
  var deduz=r2(ret+desc+rap);
  return {bruto:bruto, retencao:ret, descontos:desc, retidoApontamento:rap, deducoes:deduz, liquido:adm?r2(bruto-deduz):bruto, recomendado:adm?0:deduz};
}
function medTravas(m,o){
  var oid=m.obraId, b=[], av=[], its=(m.itens||[]).filter(function(i){ return (Number(i.qtdMedida)||0)>0; });
  var mes=(m.periodoFim||hoje()).slice(0,7);
  var faltam=DOC_MENSAIS.filter(function(t){ var d=docPrest(oid,m.prestadorId,mes,t.k); return !(d&&d.status==='conferido'); });
  if(faltam.length) b.push({cod:'docs', t:'Documentos de '+mesNome(mes)+' de '+(prestNome(m.prestadorId)||'prestador')+' ainda não conferidos: '+faltam.map(function(t){ return t.n; }).join(', ')+'. Confira na aba Documentos.'});
  its.forEach(function(i){
    var ac=Math.round(((Number(i.qtdAnterior)||0)*0+medQtdOutras(oid,m.id,i.codigo)+i.qtdMedida)*1e6)/1e6;
    if(ac>i.qtdOrcada+1e-9) b.push({cod:'qtd', t:'Item '+i.codigo+': quantidade acumulada '+String(ac).replace('.',',')+' '+i.unidade+' passa da orçada ('+String(i.qtdOrcada).replace('.',',')+'). Excedente: '+String(Math.round((ac-i.qtdOrcada)*1e6)/1e6).replace('.',',')+'.'});
  });
  var ct=G('contratosPrest',m.contratoId), baseCt=ct&&ct.valor>0?ct.valor:medItensDoPrestador(oid,m.prestadorId).reduce(function(s,i){ return s+i.total; },0);
  var medido=medDoContrato(m.contratoId).filter(function(x){ return x.id!==m.id && MED_CONTA.indexOf(x.status)>=0; }).reduce(function(s,x){ return s+medBruto(x); },0)+medBruto(m);
  var pctMed=baseCt>0?medido/baseCt*100:0, avp=avancoPrestador(oid,m.prestadorId), avanco=avp==null?0:avp*100, tol=o.tolerAvanco==null?5:o.tolerAvanco;
  if(pctMed>avanco+tol+1e-9 && !(m.justificativas||[]).some(function(j){ return j.trava==='avanco'; })){
    b.push({cod:'avanco', t:'Medição acumulada de '+(Math.round(pctMed*10)/10).toString().replace('.',',')+'% do contrato passa do avanço registrado no cronograma ('+(Math.round(avanco*10)/10).toString().replace('.',',')+'%) mais a tolerância de '+String(tol).replace('.',',')+' pontos.'+(avp==null?' Não há atividades do prestador no cronograma.':'')+' Registre uma justificativa da engenharia ou atualize o avanço.'});
  }
  var vistas={};
  its.forEach(function(i){
    var n=i.etapa; if(!n||vistas[n]) return; vistas[n]=1;
    var ap=0, rep=0, reins=0, pend=0;
    etapaInfo(n).verif.forEach(function(_,k){ var f=fichaDoc(oid,n,k); if(!f) pend++; else if(f.resultado==='aprovado') ap++; else if(f.resultado==='reprovado') rep++; else if(f.resultado==='reinspecao') reins++; });
    if(rep||reins) b.push({cod:'ficha', t:'Etapa '+n+' ('+etapaInfo(n).nome+'): há ficha de verificação '+(rep?'reprovada':'aguardando reinspeção')+'. Resolva antes de medir.'});
    else if(!ap) b.push({cod:'ficha', t:'Etapa '+n+' ('+etapaInfo(n).nome+'): nenhuma ficha de verificação aprovada. Inspecione ao menos uma ficha antes de medir.'});
    else if(pend) av.push('Etapa '+n+': '+plural(pend,'ficha ainda sem inspeção','fichas ainda sem inspeção')+'.');
  });
  its.forEach(function(i){
    if(!i.aditivoId) return;
    var a=G('aditivos',i.aditivoId);
    if(!a||a.status!=='assinado') b.push({cod:'aditivo', t:'Item '+i.codigo+' vem de um aditivo que não está assinado pelo cliente.'});
  });
  var rap=retidoApontamento(m);
  if(rap.total>0) av.push('Ocorrência crítica aberta do prestador na(s) etapa(s) '+rap.etapas.join(', ')+': '+brl(rap.total)+' ficam retidos até a ocorrência fechar.');
  return {bloqueios:b, avisos:av, pctMedido:pctMed, avanco:avanco};
}

function svgGrafico(cfg){
  var W=Math.max(520,cfg.labels.length*(cfg.largBarra||56)+90), H=cfg.altura||240, L0=64, R=14, T=14, B=34, iw=W-L0-R, ih=H-T-B, n=cfg.labels.length;

    s.v.forEach(function(x,i){ if(x!=null) g+='<circle cx="'+(L0+gw*i+gw/2)+'" cy="'+Y(x)+'" r="3" fill="'+s.cor+'"><title>'+esc(s.nome+' — '+cfg.labels[i]+': '+fmtv(x))+'</title></circle>'; });

}

/* ================= COMPROMETIDO, APROPRIADO E PAGO ================= */
// Cada valor passa por um caminho só: comprometido (ainda a executar) → apropriado (executado) → pago.
// Assim nada é contado duas vezes; "exposição" = comprometido + apropriado.
function repartir(valor, pesos){
  var ks=Object.keys(pesos).filter(function(k){ return pesos[k]>0; }), tot=ks.reduce(function(s,k){ return s+pesos[k]; },0), out={};
  if(!ks.length||!(valor>0)){ if(valor) out[0]=r2(valor); return out; }
  var soma=0, maior=ks[0];
  ks.forEach(function(k){ out[k]=r2(valor*pesos[k]/tot); soma=r2(soma+out[k]); if(pesos[k]>pesos[maior]) maior=k; });
  out[maior]=r2(out[maior]+valor-soma);
  return out;
}
function custoEtapa(oid){
  var o=G('obras',oid), adm=modAdm(o), rev=orcRevisado(oid), E={};
  var at=function(n){ n=Number(n)||0; return E[n]||(E[n]={etapa:n, orcado:0, comprometido:0, apropriado:0, pago:0}); };
  Object.keys(rev.porEtapa).forEach(function(n){ at(n).orcado=rev.porEtapa[n]; });
  var add=function(n,campo,v){ var x=at(n); x[campo]=r2(x[campo]+v); };
  if(adm){
    byObra('compras',oid).forEach(function(c){
      if(!c.pedido) return; var v=r2(c.pedido.total), n=c.etapa||0;
      if(c.status==='pedido'||c.status==='entregue') add(n,'comprometido',v);
      else if(c.status==='conferido'||c.status==='pago'){ add(n,'apropriado',v); if(c.status==='pago') add(n,'pago',v); }
    });
    byObra('locacoes',oid).forEach(function(l){
      var n=l.etapa||0;
      if(l.status==='prevista'||l.status==='ativa') add(n,'comprometido',locTotalPrev(l));
      else if(l.status==='devolvida'){
        add(n,'apropriado',locValorReal(l));
        var cp=G('contasPagar',contaId('locacao',l.id)); if(cp&&cp.status==='paga') add(n,'pago',cp.valor);
      }
    });
  }
  var meds=byObra('medicoes',oid), medidoPor={};
  meds.forEach(function(m){
    if(m.status!=='aprovada'&&m.status!=='paga') return;
    var porEt={}, bruto=0; (m.itens||[]).forEach(function(i){ var v=r2((Number(i.qtdMedida)||0)*i.precoUnitario); porEt[i.etapa||0]=r2((porEt[i.etapa||0]||0)+v); bruto=r2(bruto+v); });
    Object.keys(porEt).forEach(function(n){ add(n,'apropriado',porEt[n]); });
    medidoPor[m.contratoId]=r2((medidoPor[m.contratoId]||0)+bruto);
    if(m.status==='paga'){ var part=repartir(m.valorLiquido!=null?m.valorLiquido:bruto, porEt); Object.keys(part).forEach(function(n){ add(n,'pago',part[n]); }); }
  });
  byObra('contratosPrest',oid).forEach(function(c){
    if(c.status==='encerrado') return;
    var saldo=r2(Math.max(0,(Number(c.valor)||0)-(medidoPor[c.id]||0))); if(!saldo) return;
    var pesos={}; medItensDoPrestador(oid,c.prestadorId).forEach(function(i){ pesos[i.etapa||0]=(pesos[i.etapa||0]||0)+i.total; });
    var part=repartir(saldo,pesos); Object.keys(part).forEach(function(n){ add(n,'comprometido',part[n]); });
  });
  var lista=Object.keys(E).map(Number).sort(function(a,b){ return (a||99)-(b||99); }).map(function(n){ var x=E[n]; x.exposicao=r2(x.comprometido+x.apropriado); x.acima=x.orcado>0&&x.exposicao>x.orcado+0.005; x.semOrcamento=x.orcado<=0&&x.exposicao>0; return x; });
  var tot={orcado:0, comprometido:0, apropriado:0, pago:0};
  lista.forEach(function(x){ ['orcado','comprometido','apropriado','pago'].forEach(function(k){ tot[k]=r2(tot[k]+x[k]); }); }); tot.exposicao=r2(tot.comprometido+tot.apropriado);
  return {etapas:lista, total:tot};
}

/* ================= FÍSICO-FINANCEIRO, CURVAS S E INDICADORES ================= */
function janelaEtapa(oid,n){
  var ats=byObra('atividades',oid).filter(function(a){ return a.etapa===n; }); if(!ats.length) return null;
  var ini=ats[0].inicio, fim=ats[0].fim; ats.forEach(function(a){ if(a.inicio<ini) ini=a.inicio; if(a.fim>fim) fim=a.fim; });
  return {ini:ini, fim:fim, dias:Math.max(1,diffDays(ini,fim)+1)};
}
function fisicoEtapa(oid,n){
  var ats=byObra('atividades',oid).filter(function(a){ return a.etapa===n; }), e=etapaDoc(oid,n);
  if(e.status==='liberada') return {v:1, semAtividades:!ats.length, liberada:true};
  if(!ats.length) return {v:0, semAtividades:true, liberada:false};
  var tot=0, acc=0; ats.forEach(function(a){ var d=Math.max(1,diffDays(a.inicio,a.fim)+1); tot+=d; acc+=d*(a.avanco||0)/100; });
  return {v:acc/tot, semAtividades:false, liberada:false};
}
function pvAte(oid,data,rev){
  rev=rev||orcRevisado(oid); var pv=0, sem=[];
  Object.keys(rev.porEtapa).forEach(function(k){
    var n=Number(k), orc=rev.porEtapa[k]; if(!n||!(orc>0)) return;
    var j=janelaEtapa(oid,n); if(!j){ sem.push(n); return; }
    pv+=orc*Math.max(0,Math.min(1,(diffDays(j.ini,data)+1)/j.dias));
  });
  return {pv:r2(pv), semCronograma:sem};
}

function curvaABC(oid,o){

  var mats=orcRevisado(oid).itens.filter(function(i){ return i.tipo==='material'&&i.total>0; }).sort(function(a,b){ return b.total-a.total; });
  var tot=mats.reduce(function(s,i){ return s+i.total; },0), acum=0, itens=[], resumo={A:{n:0,v:0},B:{n:0,v:0},C:{n:0,v:0}};
  mats.forEach(function(i){
    var antes=tot>0?acum/tot*100:0; acum+=i.total;
    var cl=antes<A-1e-9?'A':(antes<B-1e-9?'B':'C');   // classe pela posição em que o item começa: quem cruza o corte fica na classe de baixo
    resumo[cl].n++; resumo[cl].v=r2(resumo[cl].v+i.total);
    itens.push(Object.assign({}, i, {pct:tot>0?i.total/tot*100:0, acumPct:tot>0?acum/tot*100:0, classe:cl}));
  });
  return {itens:itens, total:r2(tot), resumo:resumo, A:A, B:B};
}

  return orcRevisado(oid).itens.filter(function(i){ var r=refs[i.codigo]; return r>0 && i.precoUnitario>r*(1+mg/100)+1e-9; });
}

function refParse(texto,oid){
  var rows=csvParse(texto), rel={erros:[], refs:{}, naoAchados:[], achados:0};
  if(rows.length<2){ rel.erros.push('O arquivo precisa ter o cabeçalho (codigo;preco) e ao menos uma linha.'); rel.ok=false; return rel; }
  var h=rows[0].map(chave), ic=h.indexOf('codigo'), ip=-1; ['preco','preco_ref','preco_referencia','valor','preco_unitario'].forEach(function(a){ if(ip<0) ip=h.indexOf(a); });
  if(ic<0||ip<0){ rel.erros.push('O cabeçalho precisa das colunas codigo e preco.'); rel.ok=false; return rel; }
  var existe={}; orcRevisado(oid).itens.forEach(function(i){ existe[i.codigo]=1; });
  for(var i=1;i<rows.length;i++){
    var cod=String(rows[i][ic]||'').trim(), p=numBR(rows[i][ip]); if(!cod) continue;
    if(!(p>0)){ rel.erros.push('Linha '+(i+1)+': preço inválido para o código '+cod+'.'); continue; }
    rel.refs[cod]=r2(p); if(existe[cod]) rel.achados++; else rel.naoAchados.push(cod);
  }
  rel.ok=rel.erros.length===0 && Object.keys(rel.refs).length>0;
  return rel;
}

function parseManual(texto, obras){

  String(texto||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).forEach(function(l){
    var p=l.split(';'), nome=(p[0]||'').trim(), v=numBR(p[1]), o=obras.filter(function(x){ return chave(x.nome)===chave(nome); })[0];
    if(!o) erros.push('Obra “'+nome+'” não pertence a esta empresa.'); else if(!(v>=0)) erros.push('Percentual inválido para “'+nome+'”.'); else { out[o.id]=v; tot+=v; }
  });
  if(!erros.length && Object.keys(out).length && Math.abs(tot-100)>0.01) erros.push('Os percentuais somam '+String(Math.round(tot*100)/100).replace('.',',')+'%; precisam somar 100%.');
  return {rateio:out, erros:erros};
}

function parseParcelas(texto){
  var out=[], erros=[];
  String(texto||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).forEach(function(l,k){
    var p=l.split(';'), m=(p[0]||'').trim(), v=numBR(p[1]);
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)) erros.push('Parcela '+(k+1)+': competência “'+m+'” deve ser AAAA-MM.'); else if(!(v>0)) erros.push('Parcela '+(k+1)+': valor inválido.'); else out.push({competencia:m, valor:r2(v)});
  });
  return {parcelas:out, erros:erros};
}
function receitaPrevista(o, mes){
  var c=contratoCliente(o.id); if(!c) return 0;
  if(c.tipoRemuneracao==='fixo_mensal'){ return (c.inicio&&c.fim&&mes>=c.inicio.slice(0,7)&&mes<=c.fim.slice(0,7))?r2(c.valorMensal):0; }
  if(c.tipoRemuneracao==='parcelas'){ return r2((c.parcelas||[]).filter(function(p){ return p.competencia===mes; }).reduce(function(s,p){ return s+p.valor; },0)); }
  if(c.tipoRemuneracao==='percentual_custo'){
    if(!modAdm(o)) return 0;
    var ap=eventosCusto(o.id).filter(function(x){ return x.tipo==='apropriado'&&x.data.slice(0,7)===mes; }).reduce(function(s,x){ return s+x.valor; },0);
    return r2(ap*(Number(c.percentual)||0)/100);
  }
  return 0;
}

function mesesEntre(a,b){ var out=[]; for(var m=a; m<=b && out.length<240; m=mesAdd(m,1)) out.push(m); return out; }

function rateioMes(eid,mes){

  if(!total) return {total:0, porObra:{}, naoRateado:0};
  if(!obras.length) return {total:total, porObra:{}, naoRateado:total};
  var crit=emp.criterioRateio||'receita', pesos={};
  obras.forEach(function(o){ pesos[o.id]=crit==='receita'?receitaBrutaMes(o.id,mes):(crit==='manual'?(Number(emp.rateioManual&&emp.rateioManual[o.id])||0):1); });
  if(!Object.keys(pesos).some(function(k){ return pesos[k]>0; })) obras.forEach(function(o){ pesos[o.id]=1; });   // sem base de cálculo: partes iguais

function mesesRelevantes(oid){

}
function dreObra(oid,ini,fim){

  mesesRelevantes(oid).filter(function(m){ return m>=ini&&m<=fim; }).forEach(function(m){
    r.receita=r2(r.receita+somaLanc(ls,'receita',m)); r.impostos=r2(r.impostos+somaLanc(ls,'imposto',m)); r.custos=r2(r.custos+somaLanc(ls,'custo_direto',m));
    r.despesas=r2(r.despesas+((rateioMes(o?o.empresaId:'',m).porObra[oid])||0));
  });

}
function dreLinhas(r){

function repasseObra(oid,ini,fim){

function sugestoesMes(o,mes){

function parseCausas(texto){
  var out=[], erros=[];
  String(texto||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).forEach(function(l,i){
    var p=l.split(';').map(function(x){ return x.trim(); }), et=p[0]===''?0:numBR(p[0]), cs=chave(p[1]||''), v=p[2]?numBR(p[2]):0;
    if(!(et>=0&&et<=22&&et===Math.floor(et))){ erros.push('Linha '+(i+1)+': etapa de 1 a 22 (ou vazia).'); return; }
    if(!CAUSAS_DESVIO[cs]){ erros.push('Linha '+(i+1)+': causa “'+(p[1]||'')+'” inválida. Use: '+Object.keys(CAUSAS_DESVIO).join(', ')+'.'); return; }
    if(isNaN(v)){ erros.push('Linha '+(i+1)+': valor inválido.'); return; }
    out.push({etapa:et, causa:cs, valor:r2(v), texto:p.slice(3).join(';').trim()});
  });
  return {causas:out, erros:erros};
}

function alertasP5(o){
  var A=[], oid=o.id, base='#/obra/'+oid+'/', dias=o.diasEscalar==null?7:o.diasEscalar, hj=hoje(); if(encerrada(o)) return A;
  if(!o.empresaId) A.push({k:'warn', t:'Obra sem empresa: o DRE agrupa os lançamentos dela à parte.', to:base+'dre'});
  if(!contratoCliente(oid)) A.push({k:'warn', t:'Obra sem contrato do cliente: o DRE fica sem receita prevista.', to:base+'dre'});
  var ma=mesAdd(hj.slice(0,7),-1), fimMa=addDays(hj.slice(0,7)+'-01',-1);
  if(new Date().getDate()>5 && (!o.inicio||o.inicio<=fimMa) && !relVigente(oid,ma)) A.push({k:'warn', t:'Relatório de '+mesNome(ma)+' ainda não emitido (vencia no dia 5).', to:base+'relatorio'});
  byObra('relatorios',oid).filter(function(r){ return r.status==='emitido'&&r.enviadoEm&&r.prazoObjecao&&r.prazoObjecao<hj&&((r.validacaoCliente||{}).status||'pendente')==='pendente'; }).forEach(function(r){ A.push({k:'warn', t:'Relatório de '+mesNome(r.mes)+' sem resposta do cliente: o prazo para objeção venceu em '+fmt(r.prazoObjecao)+'.', to:base+'relatorio'}); });
  var semAv=avPendentes(oid).filter(function(c){ return diffDays((c.encerradoEm||c.fim||hj),hj)>dias; });
  if(semAv.length) A.push({k:'warn', t:plural(semAv.length,'contrato encerrado sem avaliação','contratos encerrados sem avaliação')+' há mais de '+dias+' dias: '+semAv.map(function(c){ return prestNome(c.prestadorId)||'prestador'; }).join(', ')+'.', to:base+'avaliacoes'});
  var libs=ETAPAS.map(function(e){ return etapaDoc(oid,e.n); });
  if(libs.every(function(e){ return e.status==='liberada'; })){ var ult=libs.reduce(function(m,e){ return e.liberadaEm&&e.liberadaEm>m?e.liberadaEm:m; },''); if(ult&&diffDays(ult,hj)>30) A.push({k:'warn', t:'Todas as etapas estão liberadas há mais de 30 dias e a obra não foi encerrada.', to:base+'encerramento'}); }
  return A;
}

function parseRoute(){
  var h=(location.hash||'#/painel').replace(/^#\/?/,''), p=h.split('/');
  if(p[0]==='obra' && p[1]){
    if(p[2]==='etapa' && p[3]) return {view:'etapa', oid:p[1], n:Number(p[3])};
    return {view:'obra', oid:p[1], tab:p[2]||'resumo'};
  }
  if(p[0]==='prestadores') return {view:'prestadores'};
  if(p[0]==='agenda') return {view:'agenda'};
  if(p[0]==='fornecedores') return {view:'fornecedores'};
  if(p[0]==='dre') return {view:'dre'};
  if(p[0]==='nuvem') return {view:'nuvem'};
  if(p[0]==='historico') return {view:'historico'};
  return {view:'painel'};
}

    return '<a class="card pad" style="display:block;color:inherit" href="#/obra/'+o.id+'/resumo"><div class="row spread" style="align-items:flex-start"><div class="grow"><h3>'+esc(o.nome)+'</h3><p class="muted small">'+esc([o.cliente,o.tipologia].filter(Boolean).join(' · '))+'</p></div>'+chipMod(o.modalidade)+'</div>'
      +'<div style="margin:14px 0 6px">'+regua(o.id,true)+'</div>'
      +'<p class="small muted">'+lib+' de 22 etapas liberadas'+(and.length?' · em andamento: '+and.slice(0,3).map(function(e){return e.n+'. '+esc(e.nome);}).join(', ')+(and.length>3?'…':''):'')+'</p>'
      +'<div class="row" style="margin-top:10px;gap:8px"><span class="chip '+(ppc?(ppc.ppc*100>=(o.metaPPC==null?80:o.metaPPC)?'ok':'warn'):'')+'">PPC '+(ppc?pct(ppc.ppc):'—')+'</span><span class="chip '+(cr?'crit':(ab.length?'warn':'ok'))+'">'+plural(ab.length,'ocorrência aberta','ocorrências abertas')+(cr?' ('+cr+' crítica'+(cr>1?'s':'')+')':'')+'</span></div></a>';
  }).join('');
  var vazio='<div class="card empty" style="margin-top:18px"><h3>Nenhuma obra cadastrada</h3><p>Cadastre a primeira obra para receber as 22 etapas do protocolo, o cronograma e os controles de qualidade.</p><p style="margin-top:14px"><button class="btn primary" data-act="obra-nova" data-write>Cadastrar obra</button></p></div>';
  return '<div class="wrap"><div class="row spread"><h1>Obras</h1><button class="btn primary" data-act="obra-nova" data-write>+ Nova obra</button></div>'+alHtml
    +(obras.length?'<div class="grid cols3 sec">'+cards+'</div>':vazio)+'</div>';
}

/* ---- obra ---- */
function vObra(r){
  var o=G('obras',r.oid); if(!o) return notFound();

  return '<div class="wrap"><a class="back" href="#/painel">← Todas as obras</a>'
    +'<div class="ob-head"><div class="grow"><h1>'+esc(o.nome)+(o.codigo?' <span class="muted small num">'+esc(o.codigo)+'</span>':'')+'</h1><div class="meta">'+chipMod(o.modalidade)+(o.situacao==='encerrada'?'<span class="chip ok">Encerrada em '+fmt(o.encerradaEm)+'</span>':'')+'<span>'+meta+'</span></div></div>'

function indRow(nome, formula, valor, sub, k){
  return '<tr><td><strong>'+esc(nome)+'</strong><div class="f">'+esc(formula)+'</div></td><td class="v">'+valor+'</td><td><span class="dot '+(k||'')+'" style="margin-right:8px"></span><span class="small">'+sub+'</span></td></tr>';
}
function tResumo(o){
  var oid=o.id, meta=o.metaPPC==null?80:o.metaPPC, dias=o.diasEscalar==null?7:o.diasEscalar;
  var al=alertasObra(o);
  var ppc=ppcAtual(oid), conf=conformidade(oid), nFichas=byObra('fichas',oid).length;
  var ab=byObra('ocorrencias',oid).filter(ocAberta);
  var cr=ab.filter(function(x){return x.gravidade==='critica';}).length, im=ab.filter(function(x){return x.gravidade==='importante';}).length, si=ab.length-cr-im;
  var venc=ab.filter(vencidaOc), maxV=venc.reduce(function(m,x){return Math.max(m,atrasoOc(x));},0);
  var lib=ETAPAS.filter(function(e){ return etapaDoc(oid,e.n).status==='liberada'; }).length;
  var cron=avancoCron(oid), atr=byObra('atividades',oid).filter(atAtrasada).length;
  var alHtml=al.length?'<section class="card"><div class="card-h"><h2>Alertas da obra</h2></div><ul class="alerts">'+al.map(function(a){ return '<li><span class="dot '+a.k+'"></span><div class="grow">'+esc(a.t)+'</div><a class="small" href="'+a.to+'">Abrir</a></li>'; }).join('')+'</ul></section>'
    :'<section class="card pad"><span class="dot ok" style="margin-right:8px"></span>Nenhum alerta aberto nesta obra.</section>';
  var tbl='<section class="card"><div class="card-h"><h2>Indicadores</h2></div><div class="tbl-scroll"><table class="ind"><thead><tr><th>Indicador</th><th>Valor</th><th>Situação</th></tr></thead><tbody>'
    +indRow('PPC','Pacotes 100% concluídos ÷ pacotes planejados na semana', ppc?pct(ppc.ppc):'—', ppc?(ppc.ok+' de '+ppc.tot+' pacotes na semana de '+fmtC(ppc.semana)+'. Meta: '+meta+'%'):'Nenhuma semana fechada ainda. Meta: '+meta+'%', ppc?(ppc.ppc*100>=meta?'ok':'warn'):'')
    +indRow('Taxa de conformidade','Fichas aprovadas na 1ª inspeção ÷ fichas emitidas', pct(conf), nFichas?plural(nFichas,'ficha registrada','fichas registradas'):'Nenhuma ficha registrada ainda', conf==null?'':(conf>=0.9?'ok':'warn'))
    +indRow('Ocorrências abertas','Críticas, importantes e simples', String(ab.length), cr+' crítica(s) · '+im+' importante(s) · '+si+' simples', cr?'crit':(ab.length?'warn':'ok'))
    +indRow('Apontamentos vencidos','Prazo de correção já passou', String(venc.length), venc.length?('O mais antigo venceu há '+plural(maxV,'dia','dias')+'. Escalar à diretoria após '+dias+' dias.'):'Nenhum vencido', venc.length?(maxV>dias?'crit':'warn'):'ok')
    +indRow('Etapas liberadas','Etapas com vistoria de liberação aprovada', lib+' <span class="small muted">de 22</span>', pct(lib/22)+' do protocolo concluído', '')
    +indRow('Avanço do cronograma','Avanço das atividades, ponderado pela duração', pct(cron), cron==null?'Nenhuma atividade cadastrada':(plural(atr,'atividade atrasada','atividades atrasadas')+(o.baseData?' · linha de base v'+o.baseVersao+' de '+fmt(o.baseData):' · sem linha de base')), cron==null?'':(atr?'warn':'ok'))
    +indRowsP2(o)+'</tbody></table></div></section>';
  var hist=ppcHist(oid,8);
  var bars=hist.map(function(w){
    var h=w.ppc==null?0:Math.round(w.ppc*70);
    var cls=w.tot===0?'':(w.pend>0?' open':(w.ppc*100<meta?' low':''));
    return '<div class="b"><div class="val">'+(w.ppc==null?'':Math.round(w.ppc*100)+'%')+'</div><div class="col'+cls+'" style="height:'+(w.tot?Math.max(h,3):2)+'%"></div><span>'+fmtC(w.semana)+'</span></div>';
  }).join('');
  var ppcCard='<section class="card"><div class="card-h"><h2>PPC das últimas 8 semanas</h2><span class="small muted">Cinza: semana com pacotes sem marcação</span></div><div class="bars">'+bars+'</div><div style="height:12px"></div></section>';
  var causas={}; hist.forEach(function(w){ w.ps.forEach(function(p){ if(p.concluido===false&&p.causa) causas[p.causa]=(causas[p.causa]||0)+1; }); });
  var maxC=Math.max.apply(null,Object.keys(causas).map(function(k){return causas[k];}).concat([1]));
  var causasHtml=Object.keys(causas).length?Object.keys(CAUSAS).map(function(k){ var n=causas[k]||0; return '<div class="hbar"><span>'+CAUSAS[k]+'</span><div class="t"><i style="width:'+Math.round(n/maxC*100)+'%"></i></div><span class="num">'+n+'</span></div>'; }).join(''):'<p class="muted small" style="padding:0 16px">Sem pacotes não concluídos nas últimas 8 semanas.</p>';
  var causasCard='<section class="card"><div class="card-h"><h2>Causas de não cumprimento</h2></div><div style="padding:10px 0">'+causasHtml+'</div></section>';
  var bands=[['0 a 3 dias',0,3],['4 a 7 dias',4,7],['8 a 15 dias',8,15],['Mais de 15 dias',16,99999]];
  var maxB=Math.max.apply(null,bands.map(function(b){return ab.filter(function(x){var i=idadeOc(x);return i>=b[1]&&i<=b[2];}).length;}).concat([1]));
  var agingHtml=ab.length?bands.map(function(b){ var n=ab.filter(function(x){var i=idadeOc(x);return i>=b[1]&&i<=b[2];}).length; return '<div class="hbar"><span>'+b[0]+'</span><div class="t"><i style="width:'+Math.round(n/maxB*100)+'%;background:'+(b[1]>=8?'var(--crit)':'var(--steel)')+'"></i></div><span class="num">'+n+'</span></div>'; }).join(''):'<p class="muted small" style="padding:0 16px">Nenhum apontamento aberto.</p>';
  var agingCard='<section class="card"><div class="card-h"><h2>Idade dos apontamentos abertos</h2></div><div style="padding:10px 0">'+agingHtml+'</div></section>';
  return '<div class="stack">'+alHtml+'<div class="grid cols2"><div class="stack">'+tbl+'</div><div class="stack">'+ppcCard+causasCard+agingCard+'</div></div></div>';
}

function kcardEtapa(o,e){
  var d=etapaDoc(o.id,e.n), res=fichasResumo(o.id,e.n), i=STATUS_ORDER.indexOf(d.status);
  var cr=byObra('ocorrencias',o.id).filter(function(x){ return x.etapa===e.n&&x.gravidade==='critica'&&ocAberta(x); }).length;
  var back=i>0?'<button class="btn sm" data-act="etapa-mover" data-oid="'+o.id+'" data-n="'+e.n+'" data-to="'+STATUS_ORDER[i-1]+'" data-write>← Voltar</button>':'';
  var fwd=i<3?'<button class="btn sm primary" data-act="etapa-mover" data-oid="'+o.id+'" data-n="'+e.n+'" data-to="'+STATUS_ORDER[i+1]+'" data-write>'+(i===0?'Iniciar':(i===1?'Vistoria':'Liberar'))+' →</button>':'';
  return '<div class="kcard'+(cr?' crit':'')+'"><a class="t" href="#/obra/'+o.id+'/etapa/'+e.n+'">'+e.n+'. '+esc(e.nome)+'</a><div class="m"><span class="chip">'+res.aprov+'/'+res.total+' fichas</span>'+(res.rep?'<span class="chip crit">'+res.rep+' reprovada'+(res.rep>1?'s':'')+'</span>':'')+(cr?'<span class="chip crit">Crítica aberta</span>':'')+'</div><div class="mv">'+back+fwd+'</div></div>';
}
function tEtapas(o){
  var cols=STATUS_ORDER.map(function(st){
    var es=ETAPAS.filter(function(e){ return etapaDoc(o.id,e.n).status===st; });
    return '<section class="col"><header>'+STATUS[st]+' <span class="n num">'+es.length+'</span></header><div class="cards">'+(es.length?es.map(function(e){ return kcardEtapa(o,e); }).join(''):'<p class="muted small" style="padding:8px 4px">Nenhuma etapa</p>')+'</div></section>';
  }).join('');
  return '<p class="muted small" style="margin-bottom:12px">O quadro segue o protocolo: uma etapa só começa com a anterior liberada em vistoria, e só é liberada com todas as fichas aprovadas e sem ocorrência crítica aberta.</p><div class="board">'+cols+'</div>';
}

/* ---- cronograma (Gantt) ---- */
function cmpAt(a,b){ return ((a.etapa||99)-(b.etapa||99)) || (a.inicio<b.inicio?-1:1); }
function tCron(o){
  var ats=byObra('atividades',o.id).sort(cmpAt), tem=!!o.baseData;
  var head='<div class="sec-h"><div><h2>Cronograma</h2><p class="muted small">'+(tem?'Linha de base v'+o.baseVersao+' congelada em '+fmt(o.baseData)+'. Mudar datas exige registrar o motivo.':'Sem linha de base. Congele-a quando o cronograma for aprovado.')+'</p></div>'
    +'<div class="row"><button class="btn" data-act="base-congelar" data-oid="'+o.id+'" data-write'+(ats.length?'':' disabled')+'>'+(tem?'Nova linha de base':'Congelar linha de base')+'</button><button class="btn primary" data-act="ativ-nova" data-oid="'+o.id+'" data-write>+ Atividade</button></div></div>';
  if(!ats.length) return head+'<div class="card empty" style="margin-top:14px"><h3>Nenhuma atividade no cronograma</h3><p>Cadastre as atividades de cada etapa, com início, fim, prestador e predecessora.</p></div>';
  var hj=hoje(), minD=hj, maxD=hj;
  ats.forEach(function(a){ [a.inicio,a.fim,a.base&&a.base.inicio,a.base&&a.base.fim].forEach(function(x){ if(x){ if(x<minD) minD=x; if(x>maxD) maxD=x; } }); });
  var start=segunda(addDays(minD,-3)), end=addDays(maxD,10), weeks=Math.ceil((diffDays(start,end)+1)/7), days=weeks*7;
  var dw=window.innerWidth<640?12:16, wk='';
  for(var i=0;i<weeks;i++) wk+='<span>'+fmtC(addDays(start,i*7))+'</span>';
  var rows='<div class="g-row head"><div class="g-label">Atividade</div><div class="g-weeks">'+wk+'</div></div>', lastE=-1;
  ats.forEach(function(a){
    var en=a.etapa||0;
    if(en!==lastE){ lastE=en; rows+='<div class="g-row etapa"><div class="g-label">'+(en?en+'. '+esc(etapaInfo(en).nome):'Geral')+'</div><div class="g-track"></div></div>'; }
    var off=diffDays(start,a.inicio), len=diffDays(a.inicio,a.fim)+1;
    var cls=(a.avanco||0)>=100?' done':(atAtrasada(a)?' late':'');
    var pred=a.pred?ats.filter(function(x){return x.id===a.pred;})[0]:null, warn=pred&&a.inicio<=pred.fim;
    var base=a.base?'<div class="g-base" style="left:calc('+diffDays(start,a.base.inicio)+'*var(--dw));width:calc('+(diffDays(a.base.inicio,a.base.fim)+1)+'*var(--dw))" title="Linha de base: '+fmtC(a.base.inicio)+' a '+fmtC(a.base.fim)+'"></div>':'';
    rows+='<div class="g-row"><div class="g-label"><button type="button" data-act="ativ-editar" data-id="'+a.id+'"><span class="nm">'+esc(a.nome)+'</span><span class="tiny muted">'+fmtC(a.inicio)+' a '+fmtC(a.fim)+' · '+(a.avanco||0)+'%'+(a.prestadorId?' · '+esc(prestNome(a.prestadorId)):'')+(warn?' · ⚠ começa antes do fim de "'+esc(pred.nome)+'"':'')+'</span></button></div>'
      +'<div class="g-track"><div class="g-bar'+cls+'" style="left:calc('+off+'*var(--dw));width:calc('+len+'*var(--dw))" title="'+esc(a.nome)+': '+fmtC(a.inicio)+' a '+fmtC(a.fim)+'"><i style="width:'+(a.avanco||0)+'%"></i></div>'+base+'</div></div>';
  });
  var todayOff=diffDays(start,hj);
  return head+'<div class="gantt-scroll" style="margin-top:14px"><div class="gantt" style="--days:'+days+';--dw:'+dw+'px">'+rows+'<div class="g-today" style="left:calc(var(--lw) + '+todayOff+'*var(--dw))" title="Hoje"></div></div></div>'
    +'<div class="legenda"><span><i class="em_execucao"></i>Atividade (preenchimento = avanço)</span><span><i class="crit"></i>Atrasada</span><span><i class="liberada"></i>Concluída</span><span>Traço cinza: linha de base</span><span>Linha vermelha: hoje</span></div>';
}

/* ---- semana / PPC ---- */
function tSemana(o){

  var ppc='<div class="card pad row spread" style="margin-top:14px"><div><div class="small muted">PPC da semana</div><div class="num" style="font-size:34px;font-weight:600;line-height:1.1">'+pct(info.ppc)+'</div></div><div class="small muted" style="text-align:right">'+info.ok+' de '+info.tot+' pacotes concluídos'+(info.pend?'<br>'+plural(info.pend,'pacote sem marcação','pacotes sem marcação'):'')+'<br>Meta '+meta+'%</div></div>';
  var body=info.ps.length?'<div class="card tbl-scroll" style="margin-top:14px"><table class="tbl"><thead><tr><th>Pacote de trabalho</th><th>Etapa</th><th>Prestador</th><th>Resultado</th><th></th></tr></thead><tbody>'
    +info.ps.map(function(p){
      var st=p.concluido===true?'<span class="chip ok">Concluído</span>':(p.concluido===false?'<span class="chip crit">Não concluído</span><div class="tiny muted">Causa: '+esc(CAUSAS[p.causa]||'—')+(p.obs?' · '+esc(p.obs):'')+'</div>':'<span class="chip">Sem marcação</span>');
      return '<tr><td>'+esc(p.descricao)+'</td><td>'+(p.etapa?p.etapa+'. '+esc(etapaInfo(p.etapa).nome):'—')+'</td><td>'+esc(prestNome(p.prestadorId)||'—')+'</td><td>'+st+'</td><td style="white-space:nowrap"><button class="btn sm" data-act="pac-ok" data-id="'+p.id+'" data-write>Concluído</button> <button class="btn sm" data-act="pac-nao" data-id="'+p.id+'" data-write>Não concluído</button> <button class="btn sm ghost" data-act="pac-editar" data-id="'+p.id+'" data-write aria-label="Editar pacote">Editar</button> <button class="btn sm ghost" data-act="pac-excluir" data-id="'+p.id+'" data-write aria-label="Excluir pacote">×</button></td></tr>';
    }).join('')+'</tbody></table></div>'
    :'<div class="card empty" style="margin-top:14px"><h3>Nenhum pacote nesta semana</h3><p>Liste o que a equipe se compromete a concluir. No fim da semana, marque cada pacote: só conta como concluído o que está 100% pronto.</p></div>';
  var pend=info.ps.filter(function(p){ return p.concluido!==true; }).length;
  var levar=pend?'<div style="margin-top:14px"><button class="btn" data-act="pac-levar" data-oid="'+oid+'" data-write>Levar '+plural(pend,'pacote pendente','pacotes pendentes')+' para a próxima semana</button></div>':'';
  return nav+ppc+body+levar;
}

/* ---- diário ---- */

  var head='<div class="sec-h"><div><h2>Diário de obra</h2><p class="muted small">Registro diário com fotos datadas de cada serviço antes de ser coberto.</p></div><button class="btn primary" data-act="dia-novo" data-oid="'+o.id+'" data-write>+ Registro do dia</button></div>';

/* ---- ocorrências ---- */
function kcardOc(o){
  var i=OC_ORDER.indexOf(o.status), v=vencidaOc(o), t=TIPOS_OC.filter(function(x){return x.k===o.tipo;})[0];
  var back=i>0&&o.status!=='fechada'?'<button class="btn sm" data-act="oc-mover" data-id="'+o.id+'" data-to="'+OC_ORDER[i-1]+'" data-write>←</button>':'';

async function excluirObra(oid){
  var o=G('obras',oid); if(!o) return;
  var ok=await confirmDlg('Excluir a obra “'+o.nome+'”?','<p>Isso apaga a obra e todos os registros dela: etapas, fichas, cronograma, pacotes, diário e ocorrências. Não dá para desfazer.</p>','Excluir obra',true);
  if(!ok) return;
  var tasks=[];
  ['etapas','atividades','pacotes','diarios','fichas','ocorrencias','eventos','atas','acoes','docsLegais','docsPrest','rfis','materiais','locs','servicos','compras','movEstoque','locacoes','contratosPrest','termos','danos','orcamentos','orcItens','aditivos','medicoes','contasPagar','aportes','contratosCliente','lancamentos','relatorios','avaliacoes','licoes','config'].forEach(function(c){ byObra(c,oid).forEach(function(x){ tasks.push(Store.del(c,x.id)); }); });
  tasks.push(Store.del('obras',oid));
  await Promise.all(tasks); location.hash='#/painel'; toast('Obra excluída.');

async function moverEtapa(oid,n,to){
  var e=etapaDoc(oid,n), extra={nota:''};
  if(e.status===to) return;
  if(to==='em_execucao' && e.status==='nao_iniciada'){
    var ini=podeIniciar(oid,n);
    if(!ini.ok){
      var ok=await new Promise(function(res){
        openForm({title:'Iniciar antes da liberação da etapa anterior?', intro:'O protocolo só permite iniciar com a etapa anterior liberada em vistoria. Para seguir mesmo assim, registre a justificativa.',
          fields:[{name:'j',label:'Justificativa',type:'textarea',required:true}], submit:'Iniciar com exceção',
          onSubmit:async function(v){ if(!(v.j||'').trim()) return 'Escreva a justificativa.'; extra.nota='Exceção: '+v.j.trim(); res(true); }});
        dlgEl().addEventListener('close',function(){ res(false); },{once:true});
      });
      if(!ok) return;
    }
  }
  if(to==='liberada'){
    var lib=podeLiberar(oid,n);
    if(!lib.ok){ blockDlg('Não é possível liberar a etapa '+n, lib.motivos, 'A etapa só é liberada quando:'); return; }
  }
  if(e.status==='liberada'){
    var seguintes=ETAPAS.filter(function(x){ return x.n>n && etapaDoc(oid,x.n).status!=='nao_iniciada'; });
    var c=await confirmDlg('Reabrir a etapa '+n+'?','<p>A liberação será desfeita e a etapa volta para vistoria.'+(seguintes.length?' Há '+plural(seguintes.length,'etapa seguinte já iniciada','etapas seguintes já iniciadas')+'.':'')+'</p>','Reabrir',false);
    if(!c) return;
  }
  var hist=(e.hist||[]).concat([{de:e.status, para:to, data:new Date().toISOString(), por:Store.uid||null, nota:extra.nota}]).slice(-30);
  var upd=Object.assign({}, e, {status:to, hist:hist});
  if(to==='liberada') upd.liberadaEm=hoje();
  if(to!=='liberada') delete upd.liberadaEm;
  await Store.set('etapas', e.id, upd);
  toast('Etapa '+n+': '+STATUS[to].toLowerCase()+'.');
}

function contarLocais(){ var n=0; COLS.forEach(function(c){ try{ var raw=localStorage.getItem('cob.'+c); if(raw) n+=JSON.parse(raw).length; }catch(e){} }); return n; }

function histLabel(c, d, id){
  d=d||{};
  if(c==='etapas'){ var e=etapaInfo(Number(d.n)); return 'Etapa '+(d.n||'')+(e?' — '+e.nome:''); }
  if(c==='fichas' && d.n){ var e2=etapaInfo(Number(d.n)); var v=e2&&e2.verif&&e2.verif[Number(d.i)]; return (v?v.item:'Ficha')+' (etapa '+d.n+')'; }
  return d.nome||d.titulo||d.item||d.descricao||d.assunto||d.pauta||d.trabalhador||d.norma||d.tipo||id;
}
function histResumo(x){
  var a=x.dados_antes||{}, b=x.dados_depois||{}, out=[];
  if(x.acao!=='alterado') return '';
  if(a.status!==b.status && (a.status||b.status)) out.push('situação: '+(a.status||'—').replace(/_/g,' ')+' → '+(b.status||'—').replace(/_/g,' '));
  var ks={}; Object.keys(a).concat(Object.keys(b)).forEach(function(k){ ks[k]=1; });
  var mud=Object.keys(ks).filter(function(k){ return k!=='status' && JSON.stringify(a[k])!==JSON.stringify(b[k]); });
  if(mud.length) out.push('campos alterados: '+mud.slice(0,6).join(', ')+(mud.length>6?'…':''));
  return out.join(' · ');
}
async function carregarHist(){
  if(hist.carregando) return; hist.carregando=true; hist.erro=''; scheduleRender();
  try{
    if(Supa.v2()){
      var ra=sbErr(await Supa.cli.from('auditoria').select('id,tabela,registro_id,acao,antes,depois,user_id,em').order('em',{ascending:false}).limit(500)), AC2={insert:'criado', update:'alterado', excluir:'excluido'};
      hist.rows=(ra.data||[]).map(function(x){ return {hid:x.id, colecao:x.tabela, registro_id:x.registro_id, acao:AC2[x.acao]||'alterado', dados_antes:x.antes?x.antes.dados:null, dados_depois:x.depois?x.depois.dados:null, feito_em:x.em, feito_por_email:x.user_id?String(x.user_id).slice(0,8):'sistema'}; });
    } else {
      var r=sbErr(await Supa.cli.from('registros_historico').select('*').order('feito_em',{ascending:false}).limit(500));
      hist.rows=r.data||[];
    }
  }catch(e){ hist.erro=e.message||'erro'; hist.rows=hist.rows||[]; }
  hist.carregando=false; scheduleRender();
}

function vHistorico(){

  if(hist.rows===null && !hist.carregando) setTimeout(carregarHist,0);
  var obras=L('obras').sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });

    if(hist.colecao && x.colecao!==hist.colecao) return false;

  });
  var h='<div class="wrap"><div class="sec-h"><div><h1>Histórico</h1><p class="muted" style="margin-top:4px">Tudo o que foi criado, alterado ou excluído, com quem fez e quando.</p></div><button class="btn" data-act="hist-atualizar">Atualizar</button></div>'
    +'<div class="row sec" style="margin-top:14px"><div class="fld" style="margin:0;min-width:220px"><select data-chg="hist-obra" aria-label="Filtrar por obra"><option value="">Todas as obras</option>'+obras.map(function(o){ return '<option value="'+esc(o.id)+'"'+(hist.obra===o.id?' selected':'')+'>'+esc(o.nome)+'</option>'; }).join('')+'</select></div>'
    +'<div class="fld" style="margin:0;min-width:200px"><select data-chg="hist-col" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option>'+Object.keys(COL_NOMES).map(function(k){ return '<option value="'+k+'"'+(hist.colecao===k?' selected':'')+'>'+esc(COL_NOMES[k])+'</option>'; }).join('')+'</select></div></div>';
  if(hist.erro) h+='<div class="callout crit sec">Não foi possível carregar o histórico: '+esc(hist.erro)+'</div>';
  if(hist.rows===null || (hist.carregando && !hist.rows.length)) return h+'<div class="card sec"><p class="empty">Carregando histórico…</p></div></div>';
  if(!rows.length) return h+'<div class="card sec empty"><h3>Nada registrado ainda</h3><p>As próximas alterações aparecem aqui.</p></div></div>';
  var AC={criado:['ok','Criado'], alterado:['steel','Alterado'], excluido:['crit','Excluído']};
  h+='<section class="card sec"><ul class="hist">'+rows.map(function(x){
    var d=x.dados_depois||x.dados_antes||{}, ac=AC[x.acao]||['','?'], dt=new Date(x.feito_em);
    var quando=pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+'/'+dt.getFullYear()+' '+pad(dt.getHours())+':'+pad(dt.getMinutes());
    var ob=d.obraId?G('obras',d.obraId):null, res=histResumo(x);
    var pode=x.acao!=='criado' && x.dados_antes && Store.writable && !Supa.v2();
    return '<li><div class="q">'+quando+'<br>'+esc(x.feito_por_email||'sistema')+'</div>'
      +'<div><div class="row" style="gap:6px"><span class="chip '+ac[0]+'">'+ac[1]+'</span><span class="chip">'+esc(COL_NOMES[x.colecao]||x.colecao)+'</span></div>'
      +'<div style="margin-top:4px;font-weight:500">'+esc(short(histLabel(x.colecao,d,x.registro_id),90))+'</div>'
      +(ob?'<div class="d">'+esc(ob.nome)+'</div>':'')+(res?'<div class="d">'+esc(res)+'</div>':'')+'</div>'
      +'<div class="row">'+(pode?'<button class="btn sm" data-write data-act="hist-restaurar" data-hid="'+x.hid+'">Restaurar versão anterior</button>':'')+'</div></li>';
  }).join('')+'</ul></section>'+(hist.rows.length>=500?'<p class="muted small" style="margin-top:8px">Mostrando as 500 alterações mais recentes.</p>':'');
  return h+'</div>';
}

async function importarDados(colecoes, origem){
  var rows=[];
  COLS.forEach(function(c){
    var v=colecoes[c]; if(!v) return;
    var lista=Array.isArray(v)?v:[];
    lista.forEach(function(it){
      var id, d;
      if(Array.isArray(it)){ id=it[0]; d=it[1]; } else { id=it.id; d=Object.assign({},it); delete d.id; }
      if(id) rows.push({colecao:c, id:String(id), dados:d||{}});
    });
  });
  if(!rows.length){ toast('Nenhum registro encontrado em '+origem+'.', true); return; }
  var ok=await confirmDlg('Enviar '+plural(rows.length,'registro','registros')+'?','<p>Os dados de '+esc(origem)+' vão para a nuvem. Registros com o mesmo identificador serão substituídos, e a versão anterior fica no histórico.</p>','Enviar');
  if(!ok) return;
  try{
    await Supa.upsertMany(rows);
    rows.forEach(function(r){ Store.data[r.colecao].set(r.id, r.dados); });
    hist.rows=null; scheduleRender(); toast(plural(rows.length,'registro enviado','registros enviados')+' para a nuvem.');
  }catch(e){ toast('Falha ao enviar ('+(e.code||e.message)+').', true); }
}

document.addEventListener('submit', async function(e){
  var f=e.target;
  if(f.id==='flogin'){
    e.preventDefault();
    var err=$('#lg_err'), btn=f.querySelector('[type=submit]'); err.classList.add('hide'); btn.disabled=true;
    var r=await Supa.cli.auth.signInWithPassword({email:f.email.value.trim(), password:f.senha.value});
    if(r.error){ btn.disabled=false; err.textContent=/invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':r.error.message; err.classList.remove('hide'); return; }
    location.reload();
  }
  if(f.id==='fnuvem'){
    e.preventDefault();
    var url=f.url.value.trim().replace(/\/+$/,''), key=f.key.value.trim();
    if(!/^https:\/\/.+/.test(url)){ toast('A URL precisa começar com https://', true); return; }
    if(/service_role|sb_secret_/.test(key) || (function(){ try{ return JSON.parse(atob(key.split('.')[1])).role==='service_role'; }catch(x){ return false; } })()){ toast('Essa é a chave secreta. Use a chave pública (anon/publishable).', true); return; }
    Supa.saveConfig({url:url, key:key, esquema:(Supa.config()||{}).esquema||'v1'}); location.hash='#/painel'; location.reload();
  }
});
document.addEventListener('change', function(e){
  var el=e.target;
  if(el.matches('[data-chg="hist-obra"]')){ hist.obra=el.value; render(); }
  else if(el.matches('[data-chg="hist-col"]')){ hist.colecao=el.value; render(); }
  else if(el.matches('[data-chg="importar"]')){
    var file=el.files&&el.files[0]; if(!file) return;
    file.text().then(function(t){ var j=JSON.parse(t); importarDados(j.colecoes||j, file.name); }).catch(function(){ toast('Arquivo inválido.', true); });
    el.value='';
  }
});

async function boot(){
  applyTheme(); render();
  window.addEventListener('hashchange', render);
  await Store.init();
  render();
}
COBX.Store=Store; COBX.Supa=Supa;
if(window.__COB_TEST_HOOK) window.__COB_TEST_HOOK(COBX);
