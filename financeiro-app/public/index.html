<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financeiro Interno</title>
  <link rel="icon" type="image/png" href="logo-cariati.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand"><img class="brand-logo" src="logo-cariati.png" alt="Cariati Arquitetura &amp; Gestão"><small>Financeiro interno</small></div>
      <nav id="nav"></nav>
      <button class="btn sair" id="sair" hidden>Sair</button>
    </aside>
    <main class="main">
      <header class="top">
        <button class="menu-btn" id="menu-btn" aria-label="Abrir menu">☰</button>
        <h1 id="titulo">Resumo</h1>
        <div class="novo" id="novo">
          <button class="btn primary" id="novo-btn">+ Novo ▾</button>
          <div class="novo-menu" id="novo-menu" hidden>
            <button data-novo="receita">Nova receita</button>
            <button data-novo="despesa">Nova despesa</button>
            <button data-novo="transferencia">Nova transferência</button>
          </div>
        </div>
      </header>
      <section id="conteudo" class="conteudo"></section>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
