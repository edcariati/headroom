<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financeiro Interno</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fd0'/%3E%3Cpath d='M9 22V10h3l4 7 4-7h3v12h-3v-7l-4 7-4-7v7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand"><span class="logo">F</span><span>Financeiro<br><small>interno</small></span></div>
      <nav id="nav"></nav>
      <button class="btn sair" id="sair" hidden>Sair</button>
    </aside>
    <main class="main">
      <header class="top">
        <button class="menu-btn" id="menu-btn" aria-label="Abrir menu">☰</button>
        <h1 id="titulo">Resumo</h1>
        <div class="novo" id="novo">
          <button class="btn primary" id="novo-btn">+ Novo ▾</button>
          <div class="novo-menu" id="novo-menu" hidden>
            <button data-novo="receita">Nova receita</button>
            <button data-novo="despesa">Nova despesa</button>
            <button data-novo="transferencia">Nova transferência</button>
          </div>
        </div>
      </header>
      <section id="conteudo" class="conteudo"></section>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
